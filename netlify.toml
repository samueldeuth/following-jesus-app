[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/.netlify/functions/get-blog-posts"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.netlify/functions/get-nature-photo"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Runs every 15 minutes. This is the push-notification heartbeat (Firebase
# Cloud Messaging). Each run asks the database "whose own local clock just
# reached the hour they chose for their verse / reading / 52-day-plan
# reminder?" and sends to those phones -- so every person gets their
# reminder at their OWN local time, same result OneSignal's timezone
# delivery used to give, from a single trigger. The same run also handles
# admin-composer pushes (scheduled "deliver at 9:30 in everyone's timezone"
# sends, and the 08:00 UTC conversion of recurring pushes). This function
# only STARTS the work (send-daily-notifications.js -> push-dispatch-
# background.js, which can run up to 15 minutes for very large audiences).
[functions."send-daily-notifications"]
  schedule = "*/15 * * * *"

# Runs once a day -- checks for any church_directory entry that's now
# 7+ days past its original confirmation email with no response, and
# sends exactly one follow-up reminder. Safe to run daily since the
# underlying query and its own tracking column (second_reminder_sent_at)
# mean a church can only ever receive this once, no matter how many
# times this fires.
[functions."send-church-directory-second-reminder"]
  schedule = "0 15 * * *"

# Weekly, Monday mornings -- matches the existing weekly course reminder
# email's own cadence for consistency.
[functions."send-weekly-checkin-reminders"]
  schedule = "0 15 * * 1"

# Runs every 3 days — comfortably inside Supabase's 7-day auto-pause window,
# so the free-tier database never goes to sleep from inactivity.
[functions."keep-alive-ping"]
  schedule = "0 12 */3 * *"

# Runs every hour, on the hour. Used to be a single fixed weekly UTC
# time (17:00 UTC = 9am Pacific during PDT months) that emailed
# everyone eligible at once, regardless of where they lived. Now checks
# hourly for students whose own local time currently falls in the 8am
# hour on a Monday (see get_students_needing_reminders's timezone
# window filter) -- so this fires 24 times each Monday, but any given
# student's existing 6-day "already reminded" guard means they still
# only ever get one email a week, just at their own local 8am instead
# of whatever hour that happened to be in Pacific time.
[functions."send-weekly-course-reminders"]
  schedule = "0 * * * *"

# (send-recurring-push-notifications used to be scheduled here. It is retired:
# recurring admin pushes are now converted into scheduled campaigns by the
# 15-minute push heartbeat above, at the 08:00 UTC slot.)

# Runs once a day. Pulls yesterday-minus-2 from App Store Connect's
# Sales Reports (Apple's own daily numbers aren't final until about
# two days after the fact -- see the function's own comments).
[functions."scheduled-fetch-apple-downloads"]
  schedule = "0 13 * * *"

# Runs once a day. Re-pulls the whole current month's installs CSV from
# Google Play's Cloud Storage bucket each time, so Google's own 1-2 day
# reporting lag corrects itself automatically without any extra logic.
[functions."scheduled-fetch-android-downloads"]
  schedule = "0 13 * * *"

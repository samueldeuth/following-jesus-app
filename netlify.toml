[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/.netlify/functions/get-blog-posts"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.netlify/functions/get-nature-photo"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Runs once a day at 8:00 UTC. This is NOT what determines when anyone
# actually receives their notification -- send-daily-notifications.js
# uses OneSignal's delayed_option: 'timezone', so each person's push
# arrives at their own chosen local hour regardless of when this
# trigger fires. What this trigger's OWN time actually controls is
# simpler: it just needs to run early enough, in UTC, that OneSignal
# has same-day lead time for every supported local hour (6am-9pm) across
# the app's US-timezone audience. The earliest of those, 6am Eastern,
# falls at 10:00 UTC during EDT -- 8:00 UTC gives a comfortable 2-hour
# margin ahead of that, so nobody's early-hour choice gets silently
# pushed to the next day. International users choosing very early local
# hours (parts of Australia, South Africa) aren't covered by any single
# fixed trigger time -- see send-daily-notifications.js's own comments
# for the fuller, options-based fix if that ever becomes worth doing.
[functions."send-daily-notifications"]
  schedule = "0 8 * * *"

# Runs once a day -- checks for any church_directory entry that's now
# 7+ days past its original confirmation email with no response, and
# sends exactly one follow-up reminder. Safe to run daily since the
# underlying query and its own tracking column (second_reminder_sent_at)
# mean a church can only ever receive this once, no matter how many
# times this fires.
[functions."send-church-directory-second-reminder"]
  schedule = "0 15 * * *"

# Runs every 3 days — comfortably inside Supabase's 7-day auto-pause window,
# so the free-tier database never goes to sleep from inactivity.
[functions."keep-alive-ping"]
  schedule = "0 12 */3 * *"

# Runs every hour, on the hour. Used to be a single fixed weekly UTC
# time (17:00 UTC = 9am Pacific during PDT months) that emailed
# everyone eligible at once, regardless of where they lived. Now checks
# hourly for students whose own local time currently falls in the 8am
# hour on a Monday (see get_students_needing_reminders's timezone
# window filter) -- so this fires 24 times each Monday, but any given
# student's existing 6-day "already reminded" guard means they still
# only ever get one email a week, just at their own local 8am instead
# of whatever hour that happened to be in Pacific time.
[functions."send-weekly-course-reminders"]
  schedule = "0 * * * *"

# Runs once a day, checking which recurring push notifications (see the
# admin Push Notifications page's "Recurring" mode) are due today.
# Doesn't need to run more than once a day -- OneSignal's own
# delayed_option:'timezone' resolves each recipient's own local
# delivery time from a single daily trigger, same as it already does
# for the one-time "Scheduled" push mode.
[functions."send-recurring-push-notifications"]
  schedule = "0 8 * * *"

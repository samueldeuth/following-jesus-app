<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church Dashboard — Following Jesus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#17191D; --ink-soft:#6B7280; --blue:#3E82F7;
    --bg:#FFFFFF; --bg-soft:#F4F4F2; --line:#E4E3DD; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  header{padding:24px 24px 18px;border-bottom:1px solid var(--line);}
  .logo-badge{
    background:var(--ink);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;
    letter-spacing:0.14em;font-size:12px;padding:10px 14px;text-transform:uppercase;display:inline-block;margin-bottom:14px;
  }
  header h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;margin:0;}
  .account-email{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
  .signout-link{font-size:12.5px;color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;font-family:'Inter',sans-serif;}
  main{max-width:860px;margin:0 auto;padding:28px 24px 80px;}

  .summary-row{display:flex;gap:12px;margin-bottom:26px;flex-wrap:wrap;}
  .summary-card{background:var(--bg-soft);border-radius:var(--radius);padding:16px 18px;min-width:150px;flex:1;}
  .summary-card .num{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;}
  .summary-card .label{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

  table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  thead th{
    text-align:left;font-size:11.5px;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-soft);
    padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg-soft);
  }
  tbody td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:var(--bg-soft);}
  .student-name{font-weight:600;}
  .bar-wrap{display:flex;align-items:center;gap:10px;}
  .bar-track{flex:1;height:7px;background:var(--bg-soft);border-radius:4px;overflow:hidden;min-width:80px;}
  .bar-fill{height:100%;background:var(--ink);}
  .bar-text{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .loading{padding:60px 20px;text-align:center;color:var(--ink-soft);font-size:13px;}

  /* ---------- Student detail panel ---------- */
  .back-link{font-size:13px;color:var(--ink-soft);cursor:pointer;display:inline-block;margin-bottom:14px;}
  .qa-block{border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;}
  .qa-session{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:6px;}
  .qa-question{text-align:left;font-weight:600;font-size:14.5px;margin-bottom:6px;}
  .qa-answer{text-align:left;font-size:14px;color:var(--ink);margin-bottom:10px;white-space:pre-wrap;}
  .qa-answer.empty{color:var(--ink-soft);font-style:italic;}
  .qa-reply{background:var(--bg-soft);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:8px;}
  .qa-reply .label{font-size:11px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:3px;}
  .reply-box{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px;font-family:'Inter',sans-serif;font-size:13.5px;min-height:60px;}
  .reply-btn{margin-top:8px;background:var(--ink);color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .mini-btn{
    border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:6px 11px;
    font-size:12px;font-weight:600;cursor:pointer;color:var(--ink);white-space:nowrap;
  }
  .mini-btn.danger{border-color:#C0392B;color:#C0392B;}
  .mini-btn.gold{border-color:#B08D3E;color:#B08D3E;}
  .panel{border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;}
  .panel h3{text-align:left;font-family:'Space Grotesk',sans-serif;font-size:15px;margin:0 0 12px;}
  .group-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;gap:12px;}
  .group-row:last-child{border-bottom:none;}

  .church-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;}
  .church-tab-btn{
    background:none;border:none;font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;
    color:var(--ink-soft);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .church-tab-btn.active{color:var(--ink);border-bottom-color:var(--ink);}
  .church-tab-panel{display:none;}
  .church-tab-panel.active{display:block;}

  .field-label{display:block;text-align:left;font-size:12px;font-weight:600;color:var(--ink-soft);margin:14px 0 5px;}
  .field-input{width:100%;border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13.5px;font-family:'Inter',sans-serif;box-sizing:border-box;}
  .field-textarea{min-height:90px;resize:vertical;font-family:'Inter',sans-serif;}
  .field-hint{font-size:11.5px;color:var(--ink-soft);margin:5px 0 0;}
  .field-section-title{text-align:left;font-family:'Space Grotesk',sans-serif;font-size:13.5px;margin:22px 0 2px;padding-top:16px;border-top:1px solid var(--line);}
  .color-field-row{display:flex;gap:8px;align-items:stretch;}
  .color-field-row .field-input{flex:1;}
  .color-swatch{
    width:44px;height:auto;border:1.5px solid var(--line);border-radius:6px;padding:2px;
    cursor:pointer;background:#fff;flex-shrink:0;
  }
  .new-group-form{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .new-group-form input{flex:1;min-width:140px;border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;font-family:'Inter',sans-serif;}
  .new-group-form button{background:var(--ink);color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>

<header>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
    <div>
      <div class="logo-badge" id="church-name">Loading…</div>
      <h1>Student Dashboard</h1>
    </div>
    <div id="admin-account-info" style="text-align:right;"></div>
  </div>
</header>

<main><div id="content" class="loading">Loading your church's students…</div></main>

<script>
const SUPABASE_URL = 'https://onflrmiifjjjboeimnva.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uZmxybWlpZmpqamJvZWltbnZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNTQ3NDUsImV4cCI6MjEwMjkzMDc0NX0.CeHfkR5PIH1dLW6JUPAoHSwx_AcQkFg0HtFQXV9jk5A';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentAdminId = null;
let allRows = [];
let myChurch = null;

// Pulls the video ID out of any common YouTube URL shape.
function extractYoutubeId(input){
  if(!input) return null;
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
    /^([a-zA-Z0-9_-]{11})$/
  ];
  for(const p of patterns){
    const match = input.match(p);
    if(match) return match[1];
  }
  return null;
}
let allPendingStudents = [];

function renderAccountInfo(email){
  const el = document.getElementById('admin-account-info');
  if(email){
    el.innerHTML = `
      <div class="account-email">Signed in as ${email}</div>
      <button class="signout-link" id="admin-signout-btn">Sign Out</button>
    `;
    document.getElementById('admin-signout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.reload();
    });
  } else {
    el.innerHTML = `<a href="course-player.html?return_to=${encodeURIComponent(window.location.pathname)}" style="font-size:12.5px;color:var(--ink);font-weight:600;">Sign in →</a>`;
  }
}

async function init(){
  const { data: { user } } = await supabaseClient.auth.getUser();
  if(!user){
    renderAccountInfo(null);
    document.getElementById('content').innerHTML = `
      <p style="color:var(--ink-soft);margin-bottom:14px;">Please sign in as a church admin to view this dashboard.</p>
      <a href="course-player.html?return_to=/dashboard" style="display:inline-block;background:var(--ink);color:#fff;text-decoration:none;padding:11px 22px;border-radius:8px;font-weight:600;font-size:14px;">Sign In</a>
    `;
    return;
  }
  currentAdminId = user.id;
  renderAccountInfo(user.email);

  const { data: profile } = await supabaseClient
    .from('profiles').select('role, church_id, churches(name)').eq('id', user.id).maybeSingle();

  if(!profile || profile.role !== 'church_admin'){
    document.getElementById('content').textContent = 'This dashboard is only available to church admins.';
    return;
  }

  document.getElementById('church-name').textContent = profile.churches?.name || 'Your church';

  const { data: churchRow } = await supabaseClient.from('churches').select('*').eq('id', profile.church_id).maybeSingle();
  myChurch = churchRow;

  const { data: rows, error } = await supabaseClient
    .from('church_student_progress')
    .select('*')
    .eq('church_id', profile.church_id)
    .order('full_name', { ascending: true });

  if(error || !rows){ document.getElementById('content').textContent = 'Could not load student progress.'; return; }
  allRows = rows;

  const { data: pending } = await supabaseClient.rpc('get_pending_legacy_students', { target_church_id: profile.church_id });
  allPendingStudents = pending || [];
  await renderDashboard(rows, allPendingStudents);
}

async function renderDashboard(rows, pendingStudents = allPendingStudents){
  const [{ data: currentAdminsData }, { data: myGroupsData }] = await Promise.all([
    supabaseClient.from('profiles').select('id, full_name').eq('church_id', myChurch.id).eq('role', 'church_admin'),
    supabaseClient.from('course_groups').select('*').eq('church_id', myChurch.id).order('name')
  ]);
  const currentAdmins = currentAdminsData || [];
  const myGroups = myGroupsData || [];

  const leaderIds = myGroups.map(g => g.leader_id).filter(Boolean);
  let leaderNameById = {};
  if(leaderIds.length){
    const { data: leaderProfiles } = await supabaseClient.from('profiles').select('id, full_name').in('id', leaderIds);
    (leaderProfiles || []).forEach(p => { leaderNameById[p.id] = p.full_name || 'Unnamed'; });
  }

  const totalStudents = rows.length;
  const completedCount = rows.filter(r => r.total_items > 0 && r.items_completed === r.total_items).length;
  const avgPct = totalStudents
    ? Math.round(rows.reduce((sum, r) => sum + (r.total_items ? r.items_completed / r.total_items : 0), 0) / totalStudents * 100)
    : 0;

  const rowsHtml = rows.map(r => {
    const pct = r.total_items ? Math.round((r.items_completed / r.total_items) * 100) : 0;
    const isComplete = r.total_items > 0 && r.items_completed === r.total_items;
    return `
      <tr>
        <td class="student-name clickable-cell" data-student-id="${r.student_id}" data-course-id="${r.course_id}">${r.full_name || 'Unnamed student'}</td>
        <td class="clickable-cell" data-student-id="${r.student_id}" data-course-id="${r.course_id}">${r.course_title}</td>
        <td class="clickable-cell" data-student-id="${r.student_id}" data-course-id="${r.course_id}">
          <div class="bar-wrap">
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <span class="bar-text">${r.items_completed}/${r.total_items}</span>
          </div>
        </td>
        <td>${new Date(r.enrolled_at).toLocaleDateString()}</td>
        <td>
          <div class="row-actions">
            ${isComplete ? `<button class="mini-btn gold" data-view-cert="${r.student_id}" data-cert-course="${r.course_id}">🏅 Certificate</button>` : ''}
            <button class="mini-btn danger" data-unenroll="${r.enrollment_id}" data-name="${(r.full_name||'this student').replace(/"/g,'')}">Unenroll</button>
          </div>
        </td>
      </tr>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="summary-row">
      <div class="summary-card"><div class="num">${totalStudents}</div><div class="label">Students enrolled</div></div>
      <div class="summary-card"><div class="num">${completedCount}</div><div class="label">Finished the course</div></div>
      <div class="summary-card"><div class="num">${avgPct}%</div><div class="label">Average progress</div></div>
    </div>

    <div class="church-tabs">
      <button class="church-tab-btn active" data-tab="students">Students</button>
      ${pendingStudents.length ? `<button class="church-tab-btn" data-tab="pending">Not Yet Signed Up (${pendingStudents.length})</button>` : ''}
      <button class="church-tab-btn" data-tab="settings">Settings</button>
      <button class="church-tab-btn" data-tab="groups">Groups</button>
    </div>

    <div class="church-tab-panel active" data-tab-panel="students">
      <table>
        <thead><tr><th>Student</th><th>Course</th><th>Progress</th><th>Enrolled</th><th>Actions</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>

    ${pendingStudents.length ? `
    <div class="church-tab-panel" data-tab-panel="pending">
      <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;">People who took your church's course on the old platform but haven't created an account here yet. Once they sign up with the same email, they'll move into the Students tab automatically.</p>
      <div style="max-height:320px;overflow-y:auto;">
        ${pendingStudents.map(p => `<div class="group-row"><span>${(p.first_name||'')} ${(p.last_name||'')}</span><span style="color:var(--ink-soft);font-size:12px;">${p.email}</span></div>`).join('')}
      </div>
      <button class="mini-btn" id="copy-pending-emails-btn" style="margin-top:12px;">Copy All Emails</button>
      <span id="copy-status" style="font-size:12.5px;color:var(--ink-soft);margin-left:8px;"></span>
    </div>` : ''}

    <div class="church-tab-panel" data-tab-panel="settings">
      <label class="field-label">Church Name</label>
      <p class="field-hint" style="margin-bottom:8px;">Read-only — contact Following Jesus support if this needs to change.</p>
      <input type="text" class="field-input" value="${(myChurch?.name||'').replace(/"/g,'&quot;')}" disabled style="background:var(--bg-soft);" />

      <label class="field-label">Custom URL</label>
      <p class="field-hint" style="margin-bottom:8px;">This can't be changed here — changing it would break any links or QR codes already shared with your church.</p>
      <p class="field-hint">Link: <a href="https://followingjesusapp.netlify.app/courses/${myChurch?.slug || ''}" target="_blank" rel="noopener">followingjesusapp.netlify.app/courses/${myChurch?.slug || '...'}</a></p>

      <h4 class="field-section-title">Church Admin</h4>
      <div id="current-admins-list">
        ${currentAdmins.length ? currentAdmins.map(a => `
          <div class="group-row">
            <span>${a.full_name || 'Unnamed'}</span>
            ${a.id !== currentAdminId ? `<button class="mini-btn danger" data-remove-admin="${a.id}">Remove Admin</button>` : `<span style="font-size:12px;color:var(--ink-soft);">You</span>`}
          </div>`).join('') : '<p style="color:var(--ink-soft);font-size:13px;margin:0 0 12px;">No other admins assigned yet.</p>'}
      </div>
      <label class="field-label">Promote a Student to Admin</label>
      <p class="field-hint" style="margin-bottom:8px;">They must already have an account (signed up at least once) before you can promote them.</p>
      <div class="new-group-form">
        <input type="text" id="promote-admin-email" placeholder="Their email address" />
        <button id="promote-admin-btn">Make Admin</button>
      </div>
      <span id="promote-status" style="font-size:12.5px;color:var(--ink-soft);"></span>

      <label class="field-label">Accent Color</label>
      <div class="color-field-row">
        <input type="color" class="color-swatch" id="edit-church-color-picker" value="${/^#[0-9a-fA-F]{6}$/.test(myChurch?.primary_color||'') ? myChurch.primary_color : '#3E82F7'}" />
        <input type="text" class="field-input" id="edit-church-color" value="${(myChurch?.primary_color||'').replace(/"/g,'&quot;')}" placeholder="#3E82F7" />
      </div>

      <h4 class="field-section-title">Welcome Letter (shown on your church's course page)</h4>
      <label class="field-label">Title</label>
      <input type="text" class="field-input" id="edit-letter-title" value="${(myChurch?.letter_title||'').replace(/"/g,'&quot;')}" placeholder="e.g. Welcome to Acacia Church" />
      <label class="field-label">Subtitle</label>
      <input type="text" class="field-input" id="edit-letter-subtitle" value="${(myChurch?.letter_subtitle||'').replace(/"/g,'&quot;')}" placeholder="A short line under the title" />
      <label class="field-label">Letter Body</label>
      <textarea class="field-input field-textarea" id="edit-letter-body" placeholder="Separate paragraphs with a blank line">${myChurch?.letter_body||''}</textarea>
      <label class="field-label">Welcome Video (YouTube link, optional)</label>
      <input type="text" class="field-input" id="edit-letter-video" value="${(myChurch?.letter_video_youtube_id||'').replace(/"/g,'&quot;')}" placeholder="https://youtube.com/watch?v=..." />
      <p class="field-hint" style="margin-bottom:8px;">If set, this shows instead of the welcome photo below.</p>
      <label class="field-label">Welcome Photo URL</label>
      <input type="text" class="field-input" id="edit-letter-image" value="${(myChurch?.letter_image_url||'').replace(/"/g,'&quot;')}" placeholder="https://..." />
      <label class="field-label">Pastor's Name</label>
      <input type="text" class="field-input" id="edit-letter-author" value="${(myChurch?.letter_author_name||'').replace(/"/g,'&quot;')}" placeholder="e.g. First & Spouse Last" />
      <label class="field-label">Pastor's Title</label>
      <input type="text" class="field-input" id="edit-letter-author-title" value="${(myChurch?.letter_author_title||'').replace(/"/g,'&quot;')}" placeholder="e.g. Church Name | Lead Pastor" />
      <label class="field-label">Church Website</label>
      <input type="text" class="field-input" id="edit-website" value="${(myChurch?.website_url||'').replace(/"/g,'&quot;')}" placeholder="https://..." />

      <button class="mini-btn" id="save-church-settings-btn" style="margin-top:14px;background:var(--ink);color:#fff;border-color:var(--ink);">Save Church Settings</button>
      <span id="save-status" style="font-size:12.5px;color:var(--ink-soft);margin-left:10px;"></span>
    </div>

    <div class="church-tab-panel" data-tab-panel="groups">
      <div id="groups-list">${myGroups.map(g => `
        <div class="group-row" style="flex-direction:column;align-items:stretch;gap:8px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span>${g.name}${g.leader_name ? ` (label: ${g.leader_name})` : ''}</span>
          </div>
          ${g.leader_id ? `
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;">
              <span>Real leader account: <strong>${leaderNameById[g.leader_id] || 'Unnamed'}</strong></span>
              <button class="mini-btn danger" data-remove-group-leader="${g.id}">Remove</button>
            </div>
          ` : `
            <div style="display:flex;gap:6px;">
              <input type="text" class="field-input" data-assign-leader-input="${g.id}" placeholder="Their email address" style="font-size:12.5px;padding:6px 10px;" />
              <button class="mini-btn" data-assign-group-leader="${g.id}">Assign as Leader</button>
            </div>
          `}
        </div>
      `).join('') || '<p style="color:var(--ink-soft);font-size:13px;margin:0;">No groups yet.</p>'}</div>
      <p class="field-hint" style="margin:10px 0 0;">A Group Leader can see everything about their group's students (progress, discussion answers) and reply to them, but can't unenroll anyone. They need to have signed up already before you can assign them.</p>
      <div class="new-group-form">
        <input type="text" id="new-group-name" placeholder="Group name (e.g. Wednesday Night)" />
        <input type="text" id="new-group-leader" placeholder="Leader's name" />
        <button id="create-group-btn">+ Add Group</button>
      </div>
    </div>
  `;

  document.querySelectorAll('.church-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.church-tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.church-tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector(`.church-tab-panel[data-tab-panel="${btn.dataset.tab}"]`).classList.add('active');
    });
  });

  const colorPicker = document.getElementById('edit-church-color-picker');
  const colorText = document.getElementById('edit-church-color');
  if(colorPicker && colorText){
    colorPicker.addEventListener('input', () => { colorText.value = colorPicker.value; });
    colorText.addEventListener('input', () => {
      if(/^#[0-9a-fA-F]{6}$/.test(colorText.value)) colorPicker.value = colorText.value;
    });
  }

  const saveBtn = document.getElementById('save-church-settings-btn');
  if(saveBtn) saveBtn.addEventListener('click', async () => {
    const videoInput = document.getElementById('edit-letter-video').value.trim();
    const videoId = extractYoutubeId(videoInput);
    if(videoInput && !videoId){
      alert("That doesn't look like a valid YouTube link — please check it and try again.");
      return;
    }
    const statusEl = document.getElementById('save-status');
    const updates = {
      primary_color: document.getElementById('edit-church-color').value.trim() || null,
      letter_title: document.getElementById('edit-letter-title').value.trim() || null,
      letter_subtitle: document.getElementById('edit-letter-subtitle').value.trim() || null,
      letter_body: document.getElementById('edit-letter-body').value.trim() || null,
      letter_video_youtube_id: videoId || null,
      letter_image_url: document.getElementById('edit-letter-image').value.trim() || null,
      letter_author_name: document.getElementById('edit-letter-author').value.trim() || null,
      letter_author_title: document.getElementById('edit-letter-author-title').value.trim() || null,
      website_url: document.getElementById('edit-website').value.trim() || null
    };
    statusEl.textContent = 'Saving...';
    const { data: updated, error } = await supabaseClient.from('churches').update(updates).eq('id', myChurch.id).select().maybeSingle();
    if(error || !updated){
      statusEl.textContent = '';
      alert('Could not save: ' + (error?.message || 'unknown error'));
      return;
    }
    myChurch = updated;
    statusEl.textContent = 'Saved ✓';
    setTimeout(() => { statusEl.textContent = ''; }, 2000);
  });

  const promoteBtn = document.getElementById('promote-admin-btn');
  if(promoteBtn) promoteBtn.addEventListener('click', async () => {
    const email = document.getElementById('promote-admin-email').value.trim();
    const statusEl = document.getElementById('promote-status');
    if(!email){ statusEl.textContent = 'Enter an email first.'; return; }
    statusEl.textContent = 'Promoting...';
    const { data: result, error } = await supabaseClient.rpc('promote_to_church_admin', { target_email: email, target_church_id: myChurch.id });
    if(error || result !== 'success'){
      statusEl.textContent = result === 'not_found'
        ? 'No account found with that email — they need to sign up first.'
        : 'Something went wrong. Please try again.';
      return;
    }
    statusEl.textContent = 'Promoted ✓';
    init();
  });

  document.querySelectorAll('[data-remove-admin]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Remove this person as church admin? They\'ll go back to being a regular student.')) return;
      await supabaseClient.from('profiles').update({ role: 'student' }).eq('id', btn.dataset.removeAdmin);
      init();
    });
  });

  const createGroupBtn = document.getElementById('create-group-btn');
  if(createGroupBtn) createGroupBtn.addEventListener('click', async () => {
    const name = document.getElementById('new-group-name').value.trim();
    const leader = document.getElementById('new-group-leader').value.trim();
    if(!name) return;
    await supabaseClient.from('course_groups').insert({ church_id: myChurch.id, name, leader_name: leader || null });
    init();
  });

  document.querySelectorAll('[data-assign-group-leader]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const groupId = btn.dataset.assignGroupLeader;
      const input = document.querySelector(`[data-assign-leader-input="${groupId}"]`);
      const email = input.value.trim();
      if(!email){ alert('Enter an email first.'); return; }
      const { data: result, error } = await supabaseClient.rpc('assign_group_leader', { target_email: email, target_group_id: groupId });
      if(error || result !== 'success'){
        alert(result === 'not_found' ? 'No account found with that email — they need to sign up first.' : 'Something went wrong. Please try again.');
        return;
      }
      init();
    });
  });

  document.querySelectorAll('[data-remove-group-leader]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Remove this person as leader of this group?')) return;
      await supabaseClient.rpc('remove_group_leader', { target_group_id: btn.dataset.removeGroupLeader });
      init();
    });
  });

  const copyBtn = document.getElementById('copy-pending-emails-btn');
  if(copyBtn) copyBtn.addEventListener('click', async () => {
    const emailList = pendingStudents.map(p => p.email).join(', ');
    try {
      await navigator.clipboard.writeText(emailList);
      document.getElementById('copy-status').textContent = `Copied ${pendingStudents.length} emails ✓`;
    } catch (e) {
      document.getElementById('copy-status').textContent = 'Could not copy — check clipboard permissions.';
    }
  });

  document.querySelectorAll('td.clickable-cell').forEach(td => {
    td.addEventListener('click', () => renderStudentDetail(td.dataset.studentId, td.dataset.courseId));
  });

  document.querySelectorAll('[data-unenroll]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(!confirm(`Unenroll ${btn.dataset.name} from this course? Their progress and answers will be permanently deleted.`)) return;
      await supabaseClient.from('enrollments').delete().eq('id', btn.dataset.unenroll);
      allRows = allRows.filter(r => r.enrollment_id !== btn.dataset.unenroll);
      await renderDashboard(allRows);
    });
  });

  document.querySelectorAll('[data-view-cert]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const { data: cert } = await supabaseClient.from('certificates').select('certificate_code').eq('student_id', btn.dataset.viewCert).eq('course_id', btn.dataset.certCourse).maybeSingle();
      if(cert) window.open(`certificate.html?code=${cert.certificate_code}`, '_blank');
      else alert('No certificate found yet for this student.');
    });
  });
}

/* ---------- Student detail: real discussion answers + reply ---------- */
async function renderStudentDetail(studentId, courseId){
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Loading student answers...</div>';

  const row = allRows.find(r => r.student_id === studentId);

  const { data: sessions } = await supabaseClient
    .from('sessions').select('*, session_items(*)').eq('course_id', courseId).order('sort_order');

  const discussionItems = (sessions||[]).flatMap(s => (s.session_items||[]).filter(i=>i.type==='discussion').map(i=>({...i, sessionTitle: s.title})));
  const itemIds = discussionItems.map(i=>i.id);

  const { data: questions } = itemIds.length
    ? await supabaseClient.from('discussion_questions').select('*').in('item_id', itemIds).order('sort_order')
    : { data: [] };

  const questionIds = (questions||[]).map(q=>q.id);
  const { data: responses } = questionIds.length
    ? await supabaseClient.from('discussion_responses').select('*').eq('student_id', studentId).in('question_id', questionIds)
    : { data: [] };
  const responseByQ = {};
  (responses||[]).forEach(r => { responseByQ[r.question_id] = r; });

  const blocksHtml = discussionItems.map(item => {
    const itemQuestions = (questions||[]).filter(q=>q.item_id===item.id);
    return itemQuestions.map(q => {
      const r = responseByQ[q.id];
      return `
        <div class="qa-block">
          <div class="qa-session">${item.sessionTitle}</div>
          <div class="qa-question">${q.question_text}</div>
          <div class="qa-answer ${r?.response_text ? '' : 'empty'}">${r?.response_text || 'No answer yet'}</div>
          ${r?.admin_reply ? `<div class="qa-reply"><div class="label">Your reply</div>${r.admin_reply}</div>` : ''}
          ${r ? `
            <textarea class="reply-box" data-response-id="${r.id}" placeholder="Write a reply...">${r.admin_reply || ''}</textarea>
            <button class="reply-btn" data-response-id="${r.id}">Send Reply</button>` : ''}
        </div>`;
    }).join('');
  }).join('');

  content.innerHTML = `
    <div class="back-link" id="back-to-list">&larr; Back to all students</div>
    <h2 style="font-family:'Space Grotesk',sans-serif;margin-bottom:4px;">${row?.full_name || 'Student'}</h2>
    <p style="color:var(--ink-soft);font-size:13.5px;margin-top:0;margin-bottom:24px;">${row?.course_title || ''}</p>
    ${blocksHtml || '<p style="color:var(--ink-soft);">No discussion questions found for this course.</p>'}
  `;

  document.getElementById('back-to-list').addEventListener('click', async () => { await renderDashboard(allRows); });

  content.querySelectorAll('.reply-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const responseId = btn.dataset.responseId;
      const textarea = content.querySelector(`textarea[data-response-id="${responseId}"]`);
      btn.textContent = 'Sending...';
      await supabaseClient.from('discussion_responses').update({
        admin_reply: textarea.value,
        admin_reply_by: currentAdminId,
        admin_reply_at: new Date().toISOString()
      }).eq('id', responseId);
      btn.textContent = 'Sent ✓';
      setTimeout(() => { btn.textContent = 'Send Reply'; }, 1500);
    });
  });
}

init();
</script>

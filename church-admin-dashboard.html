<head>

<style>
  :root{
    --ink:#17191D; --ink-soft:#6B7280; --blue:#3E82F7;
    --bg:#FFFFFF; --bg-soft:#F4F4F2; --line:#E4E3DD; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  header{padding:24px 24px 18px;border-bottom:1px solid var(--line);}
  .logo-badge{
    background:var(--ink);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;
    letter-spacing:0.14em;font-size:12px;padding:10px 14px;text-transform:uppercase;display:inline-block;margin-bottom:14px;
  }
  header h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;margin:0;}
  .account-email{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
  .signout-link{font-size:12.5px;color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;font-family:'Inter',sans-serif;}
  main{max-width:860px;margin:0 auto;padding:28px 24px 80px;}

  .summary-row{display:flex;gap:12px;margin-bottom:26px;flex-wrap:wrap;}
  .summary-card{background:var(--bg-soft);border-radius:var(--radius);padding:16px 18px;min-width:150px;flex:1;}
  .summary-card .num{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;}
  .summary-card .label{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

  table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  thead th{
    text-align:left;font-size:11.5px;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-soft);
    padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg-soft);
  }
  tbody td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:var(--bg-soft);}
  .student-name{font-weight:600;}
  .bar-wrap{display:flex;align-items:center;gap:10px;}
  .bar-track{flex:1;height:7px;background:var(--bg-soft);border-radius:4px;overflow:hidden;min-width:80px;}
  .bar-fill{height:100%;background:var(--ink);}
  .bar-text{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .loading{padding:60px 20px;text-align:center;color:var(--ink-soft);font-size:13px;}

  /* ---------- Student detail panel ---------- */
  .back-link{font-size:13px;color:var(--ink-soft);cursor:pointer;display:inline-block;margin-bottom:14px;}
  .qa-block{border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;}
  .qa-session{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:6px;}
  .qa-question{text-align:left;font-weight:600;font-size:14.5px;margin-bottom:6px;}
  .qa-answer{text-align:left;font-size:14px;color:var(--ink);margin-bottom:10px;white-space:pre-wrap;}
  .qa-answer.empty{color:var(--ink-soft);font-style:italic;}
  .qa-reply{background:var(--bg-soft);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:8px;}
  .qa-reply .label{font-size:11px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:3px;}
  .reply-box{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px;font-family:'Inter',sans-serif;font-size:13.5px;min-height:60px;}
  .reply-btn{margin-top:8px;background:var(--ink);color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .mini-btn{
    border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:6px 11px;
    font-size:12px;font-weight:600;cursor:pointer;color:var(--ink);white-space:nowrap;
  }
  .mini-btn.danger{border-color:#C0392B;color:#C0392B;}
  .mini-btn.gold{border-color:#B08D3E;color:#B08D3E;}
  .panel{border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;}
  .panel h3{text-align:left;font-family:'Space Grotesk',sans-serif;font-size:15px;margin:0 0 12px;}

.report-date{font-size:12px;color:var(--ink-soft);margin-top:10px;}

.report-verse-ref{text-align:center;font-size:12px;color:var(--ink-soft);margin:6px 0 36px;}

.report-metric-label{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.report-chart-block{display:flex;align-items:center;gap:32px;justify-content:center;margin-bottom:40px;flex-wrap:wrap;}

.report-legend-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);}

// Builds the OAuth redirect target WITHOUT any hash or query string --
// same fix as admin-dashboard.html. window.location.href can carry a
// leftover hash from a previous sign-in's own cleanup step, which then
// gets a second '#access_token=...' appended on top by Supabase's OAuth
// response, producing a malformed '##...' fragment that silently fails
// to parse into a real session.
function cleanRedirectUrl(){
  return window.location.origin + window.location.pathname;
}

// Defensive cleanup on every load: only strips a hash that's clearly

// Pulls the video ID out of any common YouTube URL shape.
function extractYoutubeId(input){
  if(!input) return null;
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
    /^([a-zA-Z0-9_-]{11})$/
  ];
  for(const p of patterns){
    const match = input.match(p);
    if(match) return match[1];
  }
  return null;
}
let allPendingStudents = [];

// Same escaping approach as the super admin's export — any name or
// value with a comma, quote, or line break gets properly quoted so it
// can't corrupt the columns after it.
// Same fix as send-broadcast-email.js's fetchAllRpcRows -- Supabase's
// default 1,000-row cap applies to supabase-js RPC calls too, not just
// raw fetch(). Unlikely to matter at a single church's scale today, but
// keeps this consistent and correct as a church's list grows.
async function fetchAllRpcRowsClient(rpcName, rpcParams){
  const PAGE_SIZE = 1000;
  let allRows = [];
  let offset = 0;
  for(let page = 0; page < 100; page++){
    const { data, error } = await supabaseClient.rpc(rpcName, rpcParams).range(offset, offset + PAGE_SIZE - 1);
    if(error || !data || data.length === 0) break;
    allRows = allRows.concat(data);
    if(data.length < PAGE_SIZE) break;
    offset += PAGE_SIZE;
  }
  return allRows;
}

function csvEscape(value){
  const str = (value === null || value === undefined) ? '' : String(value);
  if(/[",\n]/.test(str)){
    return `"${str.replace(/"/g, '""')}"`;
  }
  return str;
}

function exportStudentsCSV(rows, filename){
  const headers = ['Name', 'Email', 'Course', 'Enrolled', 'Progress', 'Completed'];
  const lines = [headers.map(csvEscape).join(',')];

  rows.forEach(r => {
    const completed = r.total_items > 0 && r.items_completed === r.total_items;
    const progress = r.total_items > 0 ? `${r.items_completed}/${r.total_items}` : '0/0';
    const enrolledDate = r.enrolled_at ? new Date(r.enrolled_at).toLocaleDateString() : '';
    const fields = [
      r.full_name || 'Unnamed student',
      r.student_email || '',
      r.course_title || '',
      enrolledDate,
      progress,
      completed ? 'Yes' : 'No'
    ];
    lines.push(fields.map(csvEscape).join(','));
  });

  const csvContent = lines.join('\r\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

// ---------- Student progress report (beautiful, printable-to-PDF) ----------
// Same logic as the super admin's version, scoped to myChurch directly
// since a church admin only ever has one church to report on.

function computeReportStats(rows){
  const totalStudents = rows.length;
  const completedCount = rows.filter(r => r.total_items > 0 && r.items_completed === r.total_items).length;
  const avgPct = totalStudents
    ? Math.round(rows.reduce((sum, r) => sum + (r.total_items ? r.items_completed / r.total_items : 0), 0) / totalStudents * 100)
    : 0;

  const buckets = { completed: 0, wellUnderway: 0, justStarted: 0, notStarted: 0 };
  rows.forEach(r => {
    if(r.total_items > 0 && r.items_completed === r.total_items) buckets.completed++;
    else if(r.total_items > 0 && r.items_completed / r.total_items >= 0.5) buckets.wellUnderway++;
    else if(r.items_completed > 0) buckets.justStarted++;
    else buckets.notStarted++;
  });

  return { totalStudents, completedCount, avgPct, buckets };
}

function buildDonutSegments(segments, radius = 70){
  const circumference = 2 * Math.PI * radius;
  const total = segments.reduce((sum, s) => sum + s.count, 0);
  if(total === 0) return [];

  let cumulativeOffset = 0;
  return segments
    .filter(s => s.count > 0)
    .map(s => {
      const fraction = s.count / total;
      const arcLength = fraction * circumference;
      const dashArray = `${arcLength} ${circumference - arcLength}`;
      const dashOffset = -cumulativeOffset;
      cumulativeOffset += arcLength;
      return { ...s, dashArray, dashOffset, pct: Math.round(fraction * 100) };
    });
}

function renderStudentReport(rows){
  const stats = computeReportStats(rows);
  const accent = (myChurch && /^#[0-9a-fA-F]{6}$/.test(myChurch.primary_color)) ? myChurch.primary_color : '#3E82F7';
  const churchName = myChurch ? myChurch.name : 'Following Jesus';
  const radius = 70;
  const segments = buildDonutSegments([
    { label: 'Completed', count: stats.buckets.completed, color: '#B08D3E' },
    { label: 'Well underway', count: stats.buckets.wellUnderway, color: accent },
    { label: 'Just started', count: stats.buckets.justStarted, color: '#C4C2B8' },
    { label: 'Not yet started', count: stats.buckets.notStarted, color: '#E4E3DD' }
  ], radius);

  const ringSvg = segments.length ? `
    <svg viewBox="0 0 180 180" width="180" height="180">
      <g transform="rotate(-90 90 90)">
        <circle cx="90" cy="90" r="${radius}" fill="none" stroke="#F4F4F2" stroke-width="22" />
        ${segments.map(s => `<circle cx="90" cy="90" r="${radius}" fill="none" stroke="${s.color}" stroke-width="22" stroke-dasharray="${s.dashArray}" stroke-dashoffset="${s.dashOffset}" />`).join('')}
      </g>
      <text x="90" y="84" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="34" fill="var(--ink)">${stats.avgPct}%</text>
      <text x="90" y="106" text-anchor="middle" font-family="Inter" font-size="12" fill="var(--ink-soft)">avg. progress</text>
    </svg>` : `<p style="color:var(--ink-soft);font-size:13px;">No enrollment data yet.</p>`;

  const legendHtml = segments.map(s => `
    <div class="report-legend-item">
      <span class="report-legend-dot" style="background:${s.color};"></span>
      <span>${s.label}</span>
      <span class="report-legend-count">${s.count}</span>
    </div>`).join('');

  const sortedRows = [...rows].sort((a,b) => (b.items_completed/Math.max(b.total_items,1)) - (a.items_completed/Math.max(a.total_items,1)));
  const studentRowsHtml = sortedRows.map(r => {
    const pct = r.total_items ? Math.round((r.items_completed / r.total_items) * 100) : 0;
    return `
      <div class="report-student-row">
        <span class="report-student-name">${escapeHtmlReport(r.full_name || 'Unnamed student')}</span>
        <div class="report-student-bar-track"><div class="report-student-bar-fill" style="width:${pct}%;background:${accent};"></div></div>
        <span class="report-student-pct">${pct}%</span>
      </div>`;
  }).join('') || '<p style="color:var(--ink-soft);font-size:13px;">No students enrolled yet.</p>';

  const overlay = document.createElement('div');
  overlay.id = 'report-overlay';
  overlay.innerHTML = `
    <div class="report-toolbar">
      <button class="mini-btn" id="report-close-btn">&larr; Close</button>
      <div style="display:flex;gap:8px;">
        <button class="mini-btn" id="report-csv-btn">Download CSV</button>
        <button class="mini-btn gold" id="report-pdf-btn">Download PDF</button>
      </div>
    </div>
    <div class="report-page" style="--report-accent:${accent};">
      <div class="report-header">
        <div class="report-church-name">${escapeHtmlReport(churchName)}</div>
        <div class="report-subtitle">Following Jesus Course &middot; Progress Report</div>
        <div class="report-date">Generated ${new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })}</div>
      </div>
      <div class="report-verse">"He who began a good work in you will carry it on to completion."</div>
      <div class="report-verse-ref">Philippians 1:6</div>

      <div class="report-metrics">
        <div class="report-metric"><div class="report-metric-num">${stats.totalStudents}</div><div class="report-metric-label">Students</div></div>
        <div class="report-metric"><div class="report-metric-num">${stats.completedCount}</div><div class="report-metric-label">Finished the course</div></div>
        <div class="report-metric"><div class="report-metric-num">${stats.avgPct}%</div><div class="report-metric-label">Average progress</div></div>
      </div>

      <div class="report-chart-block">
        <div class="report-ring">${ringSvg}</div>
        <div class="report-legend">${legendHtml}</div>
      </div>

      <div class="report-students-block">
        <div class="report-section-title">Student Progress</div>
        ${studentRowsHtml}
      </div>

      <div class="report-footer">Following Jesus</div>
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById('report-close-btn').addEventListener('click', () => overlay.remove());
  document.getElementById('report-pdf-btn').addEventListener('click', () => window.print());
  document.getElementById('report-csv-btn').addEventListener('click', () => {
    const nameSlug = churchName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    exportStudentsCSV(rows, `${nameSlug}-students-${new Date().toISOString().slice(0,10)}.csv`);
  });
}

function escapeHtmlReport(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Send Email to My Students ---------- */
// Mirrors send-broadcast-email.js's formatting rules exactly (**bold**,
// [text](url), ![](image url), "# " heading lines) so the preview is
// byte-identical to what actually sends.
function applyInlineFormattingPreview(escapedLine){
  return escapedLine
    .replace(/!\[\]\((https?:\/\/[^\s)]+)\)/g, '<img src="$1" alt="" style="width:100%;display:block;border-radius:8px;margin:8px 0;" />')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" style="color:#17191D;text-decoration:underline;">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

function buildBroadcastPreviewHtml(bodyText, imageUrl, linkText, linkUrl){
  const source = bodyText || '(your message will appear here)';
  const paragraphs = source
    .split(/\n\s*\n/)
    .map(block => {
      if(/^#\s+/.test(block)){
        const headingText = applyInlineFormattingPreview(escapeHtmlReport(block.replace(/^#\s+/, '')));
        return `<p style="margin:0 0 16px;font-size:19px;font-weight:700;">${headingText}</p>`;
      }
      return `<p style="margin:0 0 16px;">${applyInlineFormattingPreview(escapeHtmlReport(block)).replace(/\n/g, '<br>')}</p>`;
    })
    .join('');
  const imageBlock = imageUrl ? `<img src="${imageUrl}" alt="" style="width:100%;display:block;" />` : '';
  const buttonBlock = (linkUrl && linkText)
    ? `<p style="text-align:center;margin:8px 0 24px;"><a href="${linkUrl}" style="background:#17191D;color:#ffffff;padding:12px 24px;text-decoration:none;border-radius:6px;display:inline-block;font-weight:600;">${escapeHtmlReport(linkText)}</a></p>`
    : '';
  return `
    <div style="background:#F4F4F2;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
      <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;">
        <div style="background:#17191D;padding:22px 24px;text-align:center;">
          <span style="color:#ffffff;font-weight:700;letter-spacing:0.14em;font-size:13px;text-transform:uppercase;">Following Jesus</span>
        </div>
        ${imageBlock}
        <div style="padding:32px 28px 8px;color:#17191D;font-size:15px;line-height:1.65;">
          ${paragraphs}
        </div>
        ${buttonBlock}
        <div style="padding:0 28px 28px;">
          <p style="color:#9CA3AF;font-size:11.5px;margin:0;border-top:1px solid #E4E3DD;padding-top:16px;">
            Don't want occasional emails like this? <a href="#">Unsubscribe</a>
          </p>
        </div>
      </div>
    </div>
  `;
}

// Only one possible audience here (this admin's own church, enforced
// server-side by get_my_church_broadcast_recipients deriving the church
// from the caller's own profile) -- no scope options needed, unlike the
// super admin's version.
// Reusable formatting-toolbar helpers -- same as admin-dashboard.html's
// version, insert the same markdown-lite syntax the server parses, via
// a button instead of requiring anyone to type it themselves.
function wrapTextareaSelection(textareaId, before, after, placeholder){
  const textarea = document.getElementById(textareaId);
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const selected = textarea.value.slice(start, end) || placeholder;
  textarea.setRangeText(before + selected + after, start, end, 'select');
  textarea.focus();
}
function insertHeadingLine(textareaId){
  const textarea = document.getElementById(textareaId);
  const value = textarea.value;
  const cursor = textarea.selectionStart;
  const lineStart = value.lastIndexOf('\n', cursor - 1) + 1;
  if(value.slice(lineStart, lineStart + 2) === '# ') return;
  textarea.setRangeText('# ', lineStart, lineStart, 'end');
  textarea.focus();
}
function insertLinkFormatting(textareaId){
  const url = prompt('Link URL:');
  if(!url) return;
  const textarea = document.getElementById(textareaId);
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const selected = textarea.value.slice(start, end) || 'link text';
  textarea.setRangeText(`[${selected}](${url})`, start, end, 'select');
  textarea.focus();
}
function wireFormattingToolbar(textareaId, boldBtnId, headingBtnId, linkBtnId){
  document.getElementById(boldBtnId).addEventListener('click', () => wrapTextareaSelection(textareaId, '**', '**', 'bold text'));
  document.getElementById(headingBtnId).addEventListener('click', () => insertHeadingLine(textareaId));
  document.getElementById(linkBtnId).addEventListener('click', () => insertLinkFormatting(textareaId));
}

      </div>
      <textarea class="field-input field-textarea" id="broadcast-message" style="min-height:140px;" placeholder="Write your message here — separate paragraphs with a blank line, plain text is fine."></textarea>
      <p class="field-hint" style="margin-bottom:8px;">Or type it yourself: <code>**bold**</code>, <code># </code> for a heading, <code>[text](url)</code> for a link.</p>

      <label class="field-label">Image (optional)</label>
      <div id="broadcast-image-dropzone" style="border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;margin-bottom:6px;">
        <input type="file" accept="image/*" id="broadcast-image-file" style="font-size:12.5px;" />
        <p style="font-size:11.5px;color:var(--ink-soft);margin:6px 0 0;">or drag and drop an image here</p>
        <span id="broadcast-image-status" style="font-size:12px;color:var(--ink-soft);display:block;margin-top:4px;"></span>
      </div>
      <p class="field-hint" style="margin-bottom:8px;">Shows full-width right under the header, above your message.</p>

      <label class="field-label">Link (optional)</label>
      <div style="display:flex;gap:8px;">

      <p class="field-hint" style="margin-bottom:8px;">An unsubscribe link is added automatically at the bottom — anyone who's already opted out won't receive this.</p>

      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">

        <button class="mini-btn gold" id="broadcast-send-btn">Send</button>

  const { data: { session } } = await supabaseClient.auth.getSession();

  if(session?.access_token){

  }

  let uploadedImageUrl = null;

  async function handleImageFile(file){
    if(!file) return;
    const statusEl = document.getElementById('broadcast-image-status');
    statusEl.textContent = 'Uploading...';
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `broadcast/${Date.now()}.${ext}`;
    const { error: uploadError } = await supabaseClient.storage.from('church-photos').upload(path, file);
    if(uploadError){
      statusEl.textContent = '';
      alert('Could not upload the image: ' + uploadError.message);
      return;
    }
    const { data: urlData } = supabaseClient.storage.from('church-photos').getPublicUrl(path);
    uploadedImageUrl = urlData.publicUrl;
    statusEl.textContent = 'Uploaded ✓';
  }

  const imageFileInput = document.getElementById('broadcast-image-file');
  imageFileInput.addEventListener('change', () => handleImageFile(imageFileInput.files[0]));

  const dropzone = document.getElementById('broadcast-image-dropzone');
  ['dragenter', 'dragover'].forEach(evt => dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.style.borderColor = 'var(--ink)';
  }));
  ['dragleave', 'drop'].forEach(evt => dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.style.borderColor = 'var(--line)';
  }));
  dropzone.addEventListener('drop', (e) => {
    const file = e.dataTransfer?.files?.[0];
    if(file && file.type.startsWith('image/')) handleImageFile(file);
  });

  const getFormValues = () => ({
    subject: document.getElementById('broadcast-subject').value.trim(),
    message: document.getElementById('broadcast-message').value.trim(),
    linkText: document.getElementById('broadcast-link-text').value.trim(),
    linkUrl: document.getElementById('broadcast-link-url').value.trim(),
  });

  if(session?.access_token){
    const { data: draftRows } = await supabaseClient.rpc('get_my_broadcast_draft', { p_draft_key: BROADCAST_DRAFT_KEY });
    const draft = draftRows?.[0];
    if(draft && (draft.subject || draft.message)){
      document.getElementById('broadcast-subject').value = draft.subject || '';
      document.getElementById('broadcast-message').value = draft.message || '';
      document.getElementById('broadcast-link-text').value = draft.link_text || '';
      document.getElementById('broadcast-link-url').value = draft.link_url || '';
      if(draft.image_url){
        uploadedImageUrl = draft.image_url;
        document.getElementById('broadcast-image-status').textContent = 'Image from draft ✓';
      }
      document.getElementById('broadcast-draft-notice').style.display = 'block';
    }
  }

  document.getElementById('broadcast-discard-draft-btn').addEventListener('click', async () => {
    await supabaseClient.rpc('delete_my_broadcast_draft', { p_draft_key: BROADCAST_DRAFT_KEY });
    document.getElementById('broadcast-subject').value = '';
    document.getElementById('broadcast-message').value = '';
    document.getElementById('broadcast-link-text').value = '';
    document.getElementById('broadcast-link-url').value = '';
    document.getElementById('broadcast-image-status').textContent = '';
    uploadedImageUrl = null;
    document.getElementById('broadcast-draft-notice').style.display = 'none';
  });

  document.getElementById('broadcast-save-draft-btn').addEventListener('click', async () => {
    const { subject, message, linkText, linkUrl } = getFormValues();
    const statusEl = document.getElementById('broadcast-status');
    await supabaseClient.rpc('save_broadcast_draft', {
      p_draft_key: BROADCAST_DRAFT_KEY, p_subject: subject, p_message: message, p_image_url: uploadedImageUrl, p_link_text: linkText, p_link_url: linkUrl
    });
    statusEl.textContent = 'Draft saved — come back anytime, this composer will load it automatically.';
  });

  document.getElementById('broadcast-preview-btn').addEventListener('click', () => {
    const { message, linkText, linkUrl } = getFormValues();
    const previewArea = document.getElementById('broadcast-preview-area');
    const html = buildBroadcastPreviewHtml(message, uploadedImageUrl, linkText, linkUrl);
    previewArea.innerHTML = `<iframe srcdoc="${html.replace(/"/g,'&quot;')}" style="width:100%;height:420px;border:none;display:block;"></iframe>`;
    previewArea.style.display = 'block';
  });

  document.getElementById('broadcast-test-btn').addEventListener('click', async () => {
    const { subject, message, linkText, linkUrl } = getFormValues();
    const statusEl = document.getElementById('broadcast-status');
    if(!subject || !message){ statusEl.textContent = 'Please fill in both the subject and message first.'; return; }
    statusEl.textContent = 'Sending a test to your own email...';
    try {
      const res = await fetch('/.netlify/functions/send-broadcast-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ subject, message, imageUrl: uploadedImageUrl, linkText, linkUrl, testOnly: true })
      });
      const result = await res.json();
      statusEl.textContent = res.ok ? `Test sent to ${result.to} — check your inbox.` : 'Something went wrong: ' + (result.error || 'unknown error');
    } catch (err) {
      statusEl.textContent = 'Something went wrong sending the test.';
    }
  });

  document.getElementById('broadcast-send-btn').addEventListener('click', async () => {
    const { subject, message, linkText, linkUrl } = getFormValues();
    const statusEl = document.getElementById('broadcast-status');
    const sendBtn = document.getElementById('broadcast-send-btn');
    if(!subject || !message){ statusEl.textContent = 'Please fill in both the subject and message.'; return; }
    if(!confirm(`Send this email to your students? This can't be undone once sent.`)) return;

    sendBtn.disabled = true;
    statusEl.textContent = 'Sending...';
    try {
      const res = await fetch('/.netlify/functions/send-broadcast-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ subject, message, imageUrl: uploadedImageUrl, linkText, linkUrl })
      });
      const result = await res.json();
      if(!res.ok){
        statusEl.textContent = 'Something went wrong: ' + (result.error || 'unknown error');
        sendBtn.disabled = false;
        return;
      }
      await supabaseClient.rpc('delete_my_broadcast_draft', { p_draft_key: BROADCAST_DRAFT_KEY });
      statusEl.textContent = `Done — sent to ${result.sent} of ${result.total}${result.failed ? `, ${result.failed} failed` : ''}.`;
      document.getElementById('broadcast-cancel-btn').textContent = 'Done';
    } catch (err) {
      statusEl.textContent = 'Something went wrong sending this. Please try again.';
      sendBtn.disabled = false;
    }
  });
}

  ]);

  const myGroups = myGroupsData || [];

  const leaderIds = myGroups.map(g => g.leader_id).filter(Boolean);

            <span>${a.full_name || 'Unnamed'}</span>
            ${a.id !== currentAdminId ? `<button class="mini-btn danger" data-remove-admin="${a.id}">Remove Admin</button>` : `<span style="font-size:12px;color:var(--ink-soft);">You</span>`}
          </div>`).join('') : '<p style="color:var(--ink-soft);font-size:13px;margin:0 0 12px;">No other admins assigned yet.</p>'}
      </div>
      <label class="field-label">Promote a Student to Admin</label>
      <p class="field-hint" style="margin-bottom:8px;">They must already have an account (signed up at least once) before you can promote them.</p>
      <div class="new-group-form">
        <input type="text" id="promote-admin-email" placeholder="Their email address" />
        <button id="promote-admin-btn">Make Admin</button>
      </div>
      <span id="promote-status" style="font-size:12.5px;color:var(--ink-soft);"></span>

      <label class="field-label">Accent Color</label>
      <div class="color-field-row">
        <input type="color" class="color-swatch" id="edit-church-color-picker" value="${/^#[0-9a-fA-F]{6}$/.test(myChurch?.primary_color||'') ? myChurch.primary_color : '#3E82F7'}" />
        <input type="text" class="field-input" id="edit-church-color" value="${(myChurch?.primary_color||'').replace(/"/g,'&quot;')}" placeholder="#3E82F7" />
      </div>

      <h4 class="field-section-title">Welcome Letter (shown on your church's course page)</h4>
      <label class="field-label">Title</label>
      <input type="text" class="field-input" id="edit-letter-title" value="${(myChurch?.letter_title||'').replace(/"/g,'&quot;')}" placeholder="e.g. Welcome to Acacia Church" />
      <label class="field-label">Subtitle</label>
      <input type="text" class="field-input" id="edit-letter-subtitle" value="${(myChurch?.letter_subtitle||'').replace(/"/g,'&quot;')}" placeholder="A short line under the title" />
      <label class="field-label">Letter Body</label>
      <textarea class="field-input field-textarea" id="edit-letter-body" placeholder="Separate paragraphs with a blank line">${myChurch?.letter_body||''}</textarea>
      <label class="field-label">Welcome Video (YouTube link, optional)</label>
      <input type="text" class="field-input" id="edit-letter-video" value="${(myChurch?.letter_video_youtube_id||'').replace(/"/g,'&quot;')}" placeholder="https://youtube.com/watch?v=..." />
      <p class="field-hint" style="margin-bottom:8px;">If set, this shows instead of the welcome photo below.</p>
      <label class="field-label">Welcome Photo</label>
      <div id="edit-letter-image-dropzone" style="border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;margin-bottom:6px;">
        <input type="file" accept="image/*" id="edit-letter-image-file" style="font-size:12.5px;" />
        <p style="font-size:11.5px;color:var(--ink-soft);margin:6px 0 0;">or drag and drop an image here</p>
        <span id="upload-photo-status" style="font-size:12px;color:var(--ink-soft);display:block;margin-top:4px;"></span>
      </div>
      <input type="text" class="field-input" id="edit-letter-image" value="${(myChurch?.letter_image_url||'').replace(/"/g,'&quot;')}" placeholder="https://... (or upload/drop a file above)" />
      <p class="field-hint" style="margin-bottom:8px;">Upload a photo, or paste a link to one already hosted somewhere.</p>
      <label class="field-label">Pastor's Name</label>
      <input type="text" class="field-input" id="edit-letter-author" value="${(myChurch?.letter_author_name||'').replace(/"/g,'&quot;')}" placeholder="e.g. First & Spouse Last" />
      <label class="field-label">Pastor's Title</label>
      <input type="text" class="field-input" id="edit-letter-author-title" value="${(myChurch?.letter_author_title||'').replace(/"/g,'&quot;')}" placeholder="e.g. Church Name | Lead Pastor" />
      <label class="field-label">Church Website</label>
      <input type="text" class="field-input" id="edit-website" value="${(myChurch?.website_url||'').replace(/"/g,'&quot;')}" placeholder="https://..." />

      <button class="mini-btn" id="save-church-settings-btn" style="margin-top:14px;background:var(--ink);color:#fff;border-color:var(--ink);">Save Church Settings</button>
      <span id="save-status" style="font-size:12.5px;color:var(--ink-soft);margin-left:10px;"></span>
    </div>

    <div class="church-tab-panel" data-tab-panel="groups">
      <div id="groups-list">${myGroups.map(g => `
        <div class="group-row" style="flex-direction:column;align-items:stretch;gap:8px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span>${g.name}${g.leader_name ? ` (label: ${g.leader_name})` : ''}</span>
          </div>
          ${g.leader_id ? `
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;">
              <span>Real leader account: <strong>${leaderNameById[g.leader_id] || 'Unnamed'}</strong></span>
              <button class="mini-btn danger" data-remove-group-leader="${g.id}">Remove</button>
            </div>
          ` : `
            <div style="display:flex;gap:6px;">
              <input type="text" class="field-input" data-assign-leader-input="${g.id}" placeholder="Their email address" style="font-size:12.5px;padding:6px 10px;" />
              <button class="mini-btn" data-assign-group-leader="${g.id}">Assign as Leader</button>
            </div>
          `}
        </div>
      `).join('') || '<p style="color:var(--ink-soft);font-size:13px;margin:0;">No groups yet.</p>'}</div>
      <p class="field-hint" style="margin:10px 0 0;">A Group Leader can see everything about their group's students (progress, discussion answers) and reply to them, but can't unenroll anyone. They need to have signed up already before you can assign them.</p>
      <div class="new-group-form">
        <input type="text" id="new-group-name" placeholder="Group name (e.g. Wednesday Night)" />
        <input type="text" id="new-group-leader" placeholder="Leader's name" />
        <button id="create-group-btn">+ Add Group</button>
      </div>
    </div>
  `;

  document.querySelectorAll('.church-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.church-tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.church-tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector(`.church-tab-panel[data-tab-panel="${btn.dataset.tab}"]`).classList.add('active');
    });
  });

  const colorPicker = document.getElementById('edit-church-color-picker');
  const colorText = document.getElementById('edit-church-color');
  if(colorPicker && colorText){
    colorPicker.addEventListener('input', () => { colorText.value = colorPicker.value; });
    colorText.addEventListener('input', () => {
      if(/^#[0-9a-fA-F]{6}$/.test(colorText.value)) colorPicker.value = colorText.value;
    });
  }

  async function handleChurchPhotoFile(file){
    if(!file) return;
    const statusEl = document.getElementById('upload-photo-status');
    statusEl.textContent = 'Uploading...';
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${myChurch.id}/${Date.now()}.${ext}`;
    const { error: uploadError } = await supabaseClient.storage.from('church-photos').upload(path, file);
    if(uploadError){
      statusEl.textContent = '';
      alert('Could not upload the photo: ' + uploadError.message);
      return;
    }
    const { data: urlData } = supabaseClient.storage.from('church-photos').getPublicUrl(path);
    document.getElementById('edit-letter-image').value = urlData.publicUrl;
    statusEl.textContent = 'Uploaded ✓';
    setTimeout(() => { statusEl.textContent = ''; }, 2000);
  }

  const photoFileInput = document.getElementById('edit-letter-image-file');
  if(photoFileInput) photoFileInput.addEventListener('change', () => handleChurchPhotoFile(photoFileInput.files[0]));

  const photoDropzone = document.getElementById('edit-letter-image-dropzone');
  if(photoDropzone){
    ['dragenter', 'dragover'].forEach(evt => photoDropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      photoDropzone.style.borderColor = 'var(--ink)';
    }));
    ['dragleave', 'drop'].forEach(evt => photoDropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      photoDropzone.style.borderColor = 'var(--line)';
    }));
    photoDropzone.addEventListener('drop', (e) => {
      const file = e.dataTransfer?.files?.[0];
      if(file && file.type.startsWith('image/')) handleChurchPhotoFile(file);
    });
  }

  const saveBtn = document.getElementById('save-church-settings-btn');
  if(saveBtn) saveBtn.addEventListener('click', async () => {
    const videoInput = document.getElementById('edit-letter-video').value.trim();
    const videoId = extractYoutubeId(videoInput);
    if(videoInput && !videoId){
      alert("That doesn't look like a valid YouTube link — please check it and try again.");
      return;
    }
    const statusEl = document.getElementById('save-status');
    const updates = {
      primary_color: document.getElementById('edit-church-color').value.trim() || null,
      letter_title: document.getElementById('edit-letter-title').value.trim() || null,
      letter_subtitle: document.getElementById('edit-letter-subtitle').value.trim() || null,
      letter_body: document.getElementById('edit-letter-body').value.trim() || null,
      letter_video_youtube_id: videoId || null,
      letter_image_url: document.getElementById('edit-letter-image').value.trim() || null,
      letter_author_name: document.getElementById('edit-letter-author').value.trim() || null,
      letter_author_title: document.getElementById('edit-letter-author-title').value.trim() || null,
      website_url: document.getElementById('edit-website').value.trim() || null
    };
    statusEl.textContent = 'Saving...';
    const { data: updated, error } = await supabaseClient.from('churches').update(updates).eq('id', myChurch.id).select().maybeSingle();
    if(error || !updated){
      statusEl.textContent = '';
      alert('Could not save: ' + (error?.message || 'unknown error'));
      return;
    }
    myChurch = updated;
    statusEl.textContent = 'Saved ✓';
    setTimeout(() => { statusEl.textContent = ''; }, 2000);
  });

  const promoteBtn = document.getElementById('promote-admin-btn');
  if(promoteBtn) promoteBtn.addEventListener('click', async () => {
    const email = document.getElementById('promote-admin-email').value.trim();
    const statusEl = document.getElementById('promote-status');
    if(!email){ statusEl.textContent = 'Enter an email first.'; return; }
    statusEl.textContent = 'Promoting...';
    const { data: result, error } = await supabaseClient.rpc('promote_to_church_admin', { target_email: email, target_church_id: myChurch.id });
    if(error || result !== 'success'){
      statusEl.textContent = result === 'not_found'
        ? 'No account found with that email — they need to sign up first.'
        : 'Something went wrong. Please try again.';
      return;
    }
    statusEl.textContent = 'Promoted ✓';
    init();
  });

  document.querySelectorAll('[data-remove-admin]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Remove this person as church admin? They\'ll go back to being a regular student.')) return;
      await supabaseClient.from('profiles').update({ role: 'student' }).eq('id', btn.dataset.removeAdmin);
      init();
    });
  });

  const exportStudentsBtn = document.getElementById('export-students-btn');
  if(exportStudentsBtn) exportStudentsBtn.addEventListener('click', () => {
    const nameSlug = (myChurch?.name || 'church').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    exportStudentsCSV(rows, `${nameSlug}-students-${new Date().toISOString().slice(0,10)}.csv`);
  });

  const viewReportBtn = document.getElementById('view-report-btn');
  if(viewReportBtn) viewReportBtn.addEventListener('click', () => renderStudentReport(rows));

  const churchSendEmailBtn = document.getElementById('church-send-email-btn');
  if(churchSendEmailBtn) churchSendEmailBtn.addEventListener('click', renderBroadcastComposer);


  const createGroupBtn = document.getElementById('create-group-btn');
  if(createGroupBtn) createGroupBtn.addEventListener('click', async () => {
    const name = document.getElementById('new-group-name').value.trim();
    const leader = document.getElementById('new-group-leader').value.trim();
    if(!name) return;
    await supabaseClient.from('course_groups').insert({ church_id: myChurch.id, name, leader_name: leader || null });
    init();
  });

  document.querySelectorAll('[data-assign-group-leader]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const groupId = btn.dataset.assignGroupLeader;
      const input = document.querySelector(`[data-assign-leader-input="${groupId}"]`);
      const email = input.value.trim();
      if(!email){ alert('Enter an email first.'); return; }
      const { data: result, error } = await supabaseClient.rpc('assign_group_leader', { target_email: email, target_group_id: groupId });
      if(error || result !== 'success'){
        alert(result === 'not_found' ? 'No account found with that email — they need to sign up first.' : 'Something went wrong. Please try again.');
        return;
      }
      init();
    });
  });

  document.querySelectorAll('[data-remove-group-leader]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Remove this person as leader of this group?')) return;
      await supabaseClient.rpc('remove_group_leader', { target_group_id: btn.dataset.removeGroupLeader });
      init();
    });
  });

  const copyBtn = document.getElementById('copy-pending-emails-btn');
  if(copyBtn) copyBtn.addEventListener('click', async () => {
    const emailList = pendingStudents.map(p => p.email).join(', ');
    try {
      await navigator.clipboard.writeText(emailList);
      document.getElementById('copy-status').textContent = `Copied ${pendingStudents.length} emails ✓`;
    } catch (e) {
      document.getElementById('copy-status').textContent = 'Could not copy — check clipboard permissions.';
    }
  });

  document.querySelectorAll('td.clickable-cell').forEach(td => {
    td.addEventListener('click', () => renderStudentDetail(td.dataset.studentId, td.dataset.courseId));
  });

  document.querySelectorAll('[data-unenroll]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(!confirm(`Unenroll ${btn.dataset.name} from this course? Their progress and answers will be permanently deleted.`)) return;
      await supabaseClient.from('enrollments').delete().eq('id', btn.dataset.unenroll);
      allRows = allRows.filter(r => r.enrollment_id !== btn.dataset.unenroll);
      await renderDashboard(allRows);
    });
  });

  document.querySelectorAll('[data-view-cert]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const { data: cert } = await supabaseClient.from('certificates').select('certificate_code').eq('student_id', btn.dataset.viewCert).eq('course_id', btn.dataset.certCourse).maybeSingle();
      if(cert) window.open(`certificate.html?code=${cert.certificate_code}`, '_blank');
      else alert('No certificate found yet for this student.');
    });
  });
}

/* ---------- Student detail: real discussion answers + reply ---------- */
async function renderStudentDetail(studentId, courseId){
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Loading student answers...</div>';

  const row = allRows.find(r => r.student_id === studentId);

  const { data: sessions } = await supabaseClient
    .from('sessions').select('*, session_items(*)').eq('course_id', courseId).order('sort_order');

  const discussionItems = (sessions||[]).flatMap(s => (s.session_items||[]).filter(i=>i.type==='discussion').map(i=>({...i, sessionTitle: s.title})));
  const itemIds = discussionItems.map(i=>i.id);

  const { data: questions } = itemIds.length
    ? await supabaseClient.from('discussion_questions').select('*').in('item_id', itemIds).order('sort_order')
    : { data: [] };

  const questionIds = (questions||[]).map(q=>q.id);
  const { data: responses } = questionIds.length
    ? await supabaseClient.from('discussion_responses').select('*').eq('student_id', studentId).in('question_id', questionIds)
    : { data: [] };
  const responseByQ = {};
  (responses||[]).forEach(r => { responseByQ[r.question_id] = r; });

  const blocksHtml = discussionItems.map(item => {
    const itemQuestions = (questions||[]).filter(q=>q.item_id===item.id);
    return itemQuestions.map(q => {
      const r = responseByQ[q.id];
      return `
        <div class="qa-block">
          <div class="qa-session">${item.sessionTitle}</div>
          <div class="qa-question">${q.question_text}</div>
          <div class="qa-answer ${r?.response_text ? '' : 'empty'}">${r?.response_text || 'No answer yet'}</div>
          ${r?.admin_reply ? `<div class="qa-reply"><div class="label">Your reply</div>${r.admin_reply}</div>` : ''}
          ${r ? `
            <textarea class="reply-box" data-response-id="${r.id}" placeholder="Write a reply...">${r.admin_reply || ''}</textarea>
            <button class="reply-btn" data-response-id="${r.id}">Send Reply</button>` : ''}
        </div>`;
    }).join('');
  }).join('');

  content.innerHTML = `
    <div class="back-link" id="back-to-list">&larr; Back to all students</div>
    <h2 style="font-family:'Space Grotesk',sans-serif;margin-bottom:4px;">${row?.full_name || 'Student'}</h2>
    <p style="color:var(--ink-soft);font-size:13.5px;margin-top:0;margin-bottom:24px;">${row?.course_title || ''}</p>
    ${blocksHtml || '<p style="color:var(--ink-soft);">No discussion questions found for this course.</p>'}
  `;

  document.getElementById('back-to-list').addEventListener('click', async () => { await renderDashboard(allRows); });

  content.querySelectorAll('.reply-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const responseId = btn.dataset.responseId;
      const textarea = content.querySelector(`textarea[data-response-id="${responseId}"]`);
      btn.textContent = 'Sending...';
      await supabaseClient.from('discussion_responses').update({
        admin_reply: textarea.value,
        admin_reply_by: currentAdminId,
        admin_reply_at: new Date().toISOString()
      }).eq('id', responseId);
      btn.textContent = 'Sent ✓';
      setTimeout(() => { btn.textContent = 'Send Reply'; }, 1500);
    });
  });
}

init();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church Dashboard — Following Jesus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#17191D; --ink-soft:#6B7280; --blue:#3E82F7;
    --bg:#FFFFFF; --bg-soft:#F4F4F2; --line:#E4E3DD; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  header{padding:24px 24px 18px;border-bottom:1px solid var(--line);}
  .logo-badge{
    background:var(--ink);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;
    letter-spacing:0.14em;font-size:12px;padding:10px 14px;text-transform:uppercase;display:inline-block;margin-bottom:14px;
  }
  header h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;margin:0;}
  main{max-width:860px;margin:0 auto;padding:28px 24px 80px;}

  .summary-row{display:flex;gap:12px;margin-bottom:26px;flex-wrap:wrap;}
  .summary-card{background:var(--bg-soft);border-radius:var(--radius);padding:16px 18px;min-width:150px;flex:1;}
  .summary-card .num{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;}
  .summary-card .label{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

  table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  thead th{
    text-align:left;font-size:11.5px;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-soft);
    padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg-soft);
  }
  tbody td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:var(--bg-soft);}
  .student-name{font-weight:600;}
  .bar-wrap{display:flex;align-items:center;gap:10px;}
  .bar-track{flex:1;height:7px;background:var(--bg-soft);border-radius:4px;overflow:hidden;min-width:80px;}
  .bar-fill{height:100%;background:var(--ink);}
  .bar-text{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .loading{padding:60px 20px;text-align:center;color:var(--ink-soft);font-size:13px;}

  /* ---------- Student detail panel ---------- */
  .back-link{font-size:13px;color:var(--ink-soft);cursor:pointer;display:inline-block;margin-bottom:14px;}
  .qa-block{border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;}
  .qa-session{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:6px;}
  .qa-question{font-weight:600;font-size:14.5px;margin-bottom:6px;}
  .qa-answer{font-size:14px;color:var(--ink);margin-bottom:10px;white-space:pre-wrap;}
  .qa-answer.empty{color:var(--ink-soft);font-style:italic;}
  .qa-reply{background:var(--bg-soft);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:8px;}
  .qa-reply .label{font-size:11px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:3px;}
  .reply-box{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px;font-family:'Inter',sans-serif;font-size:13.5px;min-height:60px;}
  .reply-btn{margin-top:8px;background:var(--ink);color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .mini-btn{
    border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:6px 11px;
    font-size:12px;font-weight:600;cursor:pointer;color:var(--ink);white-space:nowrap;
  }
  .mini-btn.danger{border-color:#C0392B;color:#C0392B;}
  .mini-btn.gold{border-color:#B08D3E;color:#B08D3E;}
</style>
</head>
<body>

<header>
  <div class="logo-badge" id="church-name">Loading…</div>
  <h1>Student progress</h1>
</header>

<main><div id="content" class="loading">Loading your church's students…</div></main>

<script>
const SUPABASE_URL = 'https://onflrmiifjjjboeimnva.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uZmxybWlpZmpqamJvZWltbnZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNTQ3NDUsImV4cCI6MjEwMjkzMDc0NX0.CeHfkR5PIH1dLW6JUPAoHSwx_AcQkFg0HtFQXV9jk5A';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentAdminId = null;
let allRows = [];

async function init(){
  const { data: { user } } = await supabaseClient.auth.getUser();
  if(!user){ document.getElementById('content').textContent = 'Please sign in as a church admin to view this dashboard.'; return; }
  currentAdminId = user.id;

  const { data: profile } = await supabaseClient
    .from('profiles').select('role, church_id, churches(name)').eq('id', user.id).maybeSingle();

  if(!profile || profile.role !== 'church_admin'){
    document.getElementById('content').textContent = 'This dashboard is only available to church admins.';
    return;
  }

  document.getElementById('church-name').textContent = profile.churches?.name || 'Your church';

  const { data: rows, error } = await supabaseClient
    .from('church_student_progress')
    .select('*')
    .eq('church_id', profile.church_id)
    .order('full_name', { ascending: true });

  if(error || !rows){ document.getElementById('content').textContent = 'Could not load student progress.'; return; }
  allRows = rows;
  renderDashboard(rows);
}

function renderDashboard(rows){
  const totalStudents = rows.length;
  const completedCount = rows.filter(r => r.total_items > 0 && r.items_completed === r.total_items).length;
  const avgPct = totalStudents
    ? Math.round(rows.reduce((sum, r) => sum + (r.total_items ? r.items_completed / r.total_items : 0), 0) / totalStudents * 100)
    : 0;

  const rowsHtml = rows.map(r => {
    const pct = r.total_items ? Math.round((r.items_completed / r.total_items) * 100) : 0;
    const isComplete = r.total_items > 0 && r.items_completed === r.total_items;
    return `
      <tr>
        <td class="student-name clickable-cell" data-student-id="${r.student_id}" data-course-id="${r.course_id}">${r.full_name || 'Unnamed student'}</td>
        <td class="clickable-cell" data-student-id="${r.student_id}" data-course-id="${r.course_id}">${r.course_title}</td>
        <td class="clickable-cell" data-student-id="${r.student_id}" data-course-id="${r.course_id}">
          <div class="bar-wrap">
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <span class="bar-text">${r.items_completed}/${r.total_items}</span>
          </div>
        </td>
        <td>${new Date(r.enrolled_at).toLocaleDateString()}</td>
        <td>
          <div class="row-actions">
            ${isComplete ? `<button class="mini-btn gold" data-view-cert="${r.student_id}" data-cert-course="${r.course_id}">🏅 Certificate</button>` : ''}
            <button class="mini-btn danger" data-unenroll="${r.enrollment_id}" data-name="${(r.full_name||'this student').replace(/"/g,'')}">Unenroll</button>
          </div>
        </td>
      </tr>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="summary-row">
      <div class="summary-card"><div class="num">${totalStudents}</div><div class="label">Students enrolled</div></div>
      <div class="summary-card"><div class="num">${completedCount}</div><div class="label">Finished the course</div></div>
      <div class="summary-card"><div class="num">${avgPct}%</div><div class="label">Average progress</div></div>
    </div>
    <table>
      <thead><tr><th>Student</th><th>Course</th><th>Progress</th><th>Enrolled</th><th>Actions</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
  `;

  document.querySelectorAll('td.clickable-cell').forEach(td => {
    td.addEventListener('click', () => renderStudentDetail(td.dataset.studentId, td.dataset.courseId));
  });

  document.querySelectorAll('[data-unenroll]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(!confirm(`Unenroll ${btn.dataset.name} from this course? Their progress and answers will be permanently deleted.`)) return;
      await supabaseClient.from('enrollments').delete().eq('id', btn.dataset.unenroll);
      allRows = allRows.filter(r => r.enrollment_id !== btn.dataset.unenroll);
      renderDashboard(allRows);
    });
  });

  document.querySelectorAll('[data-view-cert]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const { data: cert } = await supabaseClient.from('certificates').select('certificate_code').eq('student_id', btn.dataset.viewCert).eq('course_id', btn.dataset.certCourse).maybeSingle();
      if(cert) window.open(`certificate.html?code=${cert.certificate_code}`, '_blank');
      else alert('No certificate found yet for this student.');
    });
  });
}

/* ---------- Student detail: real discussion answers + reply ---------- */
async function renderStudentDetail(studentId, courseId){
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Loading student answers...</div>';

  const row = allRows.find(r => r.student_id === studentId);

  const { data: sessions } = await supabaseClient
    .from('sessions').select('*, session_items(*)').eq('course_id', courseId).order('sort_order');

  const discussionItems = (sessions||[]).flatMap(s => (s.session_items||[]).filter(i=>i.type==='discussion').map(i=>({...i, sessionTitle: s.title})));
  const itemIds = discussionItems.map(i=>i.id);

  const { data: questions } = itemIds.length
    ? await supabaseClient.from('discussion_questions').select('*').in('item_id', itemIds).order('sort_order')
    : { data: [] };

  const questionIds = (questions||[]).map(q=>q.id);
  const { data: responses } = questionIds.length
    ? await supabaseClient.from('discussion_responses').select('*').eq('student_id', studentId).in('question_id', questionIds)
    : { data: [] };
  const responseByQ = {};
  (responses||[]).forEach(r => { responseByQ[r.question_id] = r; });

  const blocksHtml = discussionItems.map(item => {
    const itemQuestions = (questions||[]).filter(q=>q.item_id===item.id);
    return itemQuestions.map(q => {
      const r = responseByQ[q.id];
      return `
        <div class="qa-block">
          <div class="qa-session">${item.sessionTitle}</div>
          <div class="qa-question">${q.question_text}</div>
          <div class="qa-answer ${r?.response_text ? '' : 'empty'}">${r?.response_text || 'No answer yet'}</div>
          ${r?.admin_reply ? `<div class="qa-reply"><div class="label">Your reply</div>${r.admin_reply}</div>` : ''}
          ${r ? `
            <textarea class="reply-box" data-response-id="${r.id}" placeholder="Write a reply...">${r.admin_reply || ''}</textarea>
            <button class="reply-btn" data-response-id="${r.id}">Send Reply</button>` : ''}
        </div>`;
    }).join('');
  }).join('');

  content.innerHTML = `
    <div class="back-link" id="back-to-list">&larr; Back to all students</div>
    <h2 style="font-family:'Space Grotesk',sans-serif;margin-bottom:4px;">${row?.full_name || 'Student'}</h2>
    <p style="color:var(--ink-soft);font-size:13.5px;margin-top:0;margin-bottom:24px;">${row?.course_title || ''}</p>
    ${blocksHtml || '<p style="color:var(--ink-soft);">No discussion questions found for this course.</p>'}
  `;

  document.getElementById('back-to-list').addEventListener('click', () => renderDashboard(allRows));

  content.querySelectorAll('.reply-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const responseId = btn.dataset.responseId;
      const textarea = content.querySelector(`textarea[data-response-id="${responseId}"]`);
      btn.textContent = 'Sending...';
      await supabaseClient.from('discussion_responses').update({
        admin_reply: textarea.value,
        admin_reply_by: currentAdminId,
        admin_reply_at: new Date().toISOString()
      }).eq('id', responseId);
      btn.textContent = 'Sent ✓';
      setTimeout(() => { btn.textContent = 'Send Reply'; }, 1500);
    });
  });
}

init();
</script>
</body>
</html>

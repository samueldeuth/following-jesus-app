<script>
const SUPABASE_URL = 'https://onflrmiifjjjboeimnva.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uZmxybWlpZmpqamJvZWltbnZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNTQ3NDUsImV4cCI6MjEwMjkzMDc0NX0.CeHfkR5PIH1dLW6JUPAoHSwx_AcQkFg0HtFQXV9jk5A';

// Builds the OAuth redirect target WITHOUT any hash or query string --
// same fix as admin-dashboard.html. window.location.href can carry a
// leftover hash from a previous sign-in's own cleanup step, which then
// gets a second '#access_token=...' appended on top by Supabase's OAuth
// response, producing a malformed '##...' fragment that silently fails
// to parse into a real session.
function cleanRedirectUrl(){
  return window.location.origin + window.location.pathname;
}

// Defensive cleanup on every load: only strips a hash that's clearly
// NOT a real, still-pending OAuth response.
if(window.location.hash && !window.location.hash.includes('access_token')){
  history.replaceState(null, '', window.location.pathname + window.location.search);
}

// Pulls the video ID out of any common YouTube URL shape.
function extractYoutubeId(input){
  if(!input) return null;
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
    /^([a-zA-Z0-9_-]{11})$/
  ];
  for(const p of patterns){
    const match = input.match(p);
    if(match) return match[1];
  }
  return null;
}
let allPendingStudents = [];

function renderAccountInfo(email){
  const el = document.getElementById('admin-account-info');
  if(email){
    el.innerHTML = `
      <div class="account-email">Signed in as ${email}</div>

    `;

}

// Same escaping approach as the super admin's export — any name or
// value with a comma, quote, or line break gets properly quoted so it
// can't corrupt the columns after it.
// Same fix as send-broadcast-email.js's fetchAllRpcRows -- Supabase's
// default 1,000-row cap applies to supabase-js RPC calls too, not just
// raw fetch(). Unlikely to matter at a single church's scale today, but
// keeps this consistent and correct as a church's list grows.
// Polls a broadcast_send_jobs row every 2 seconds until the background
// function marks it done or failed, updating the composer's status line
// with live progress in the meantime.
function pollBroadcastJob(jobId, statusEl){
  const poll = async () => {
    const { data: rows } = await supabaseClient.rpc('get_broadcast_send_job', { p_job_id: jobId });
    const job = rows?.[0];
    if(!job){
      statusEl.textContent = 'Lost track of this send — check Resend\'s dashboard to confirm what went out.';
      return;
    }
    if(job.status === 'running'){
      statusEl.textContent = job.total > 0
        ? `Sending... ${job.sent + job.failed} of ${job.total} processed so far.`
        : 'Starting...';
      setTimeout(poll, 2000);
    } else if(job.status === 'done'){
      statusEl.textContent = `Done — sent to ${job.sent} of ${job.total}${job.failed ? `, ${job.failed} failed` : ''}.`;
      const cancelBtn = document.getElementById('broadcast-cancel-btn');
      if(cancelBtn) cancelBtn.textContent = 'Done';
    } else {
      statusEl.textContent = 'Something went wrong: ' + (job.error || 'unknown error');
    }
  };
  poll();
}

async function fetchAllRpcRowsClient(rpcName, rpcParams){
  const PAGE_SIZE = 1000;
  let allRows = [];
  let offset = 0;
  for(let page = 0; page < 100; page++){
    const { data, error } = await supabaseClient.rpc(rpcName, rpcParams).range(offset, offset + PAGE_SIZE - 1);
    if(error || !data || data.length === 0) break;
    allRows = allRows.concat(data);
    if(data.length < PAGE_SIZE) break;
    offset += PAGE_SIZE;
  }
  return allRows;
}

function csvEscape(value){
  const str = (value === null || value === undefined) ? '' : String(value);
  if(/[",\n]/.test(str)){
    return `"${str.replace(/"/g, '""')}"`;
  }
  return str;
}

function exportStudentsCSV(rows, filename){
  const headers = ['Name', 'Email', 'Course', 'Enrolled', 'Progress', 'Completed'];
  const lines = [headers.map(csvEscape).join(',')];

  rows.forEach(r => {
    const completed = r.total_items > 0 && r.items_completed === r.total_items;
    const progress = r.total_items > 0 ? `${r.items_completed}/${r.total_items}` : '0/0';
    const enrolledDate = r.enrolled_at ? new Date(r.enrolled_at).toLocaleDateString() : '';
    const fields = [
      r.full_name || 'Unnamed student',
      r.student_email || '',
      r.course_title || '',
      enrolledDate,
      progress,
      completed ? 'Yes' : 'No'
    ];
    lines.push(fields.map(csvEscape).join(','));
  });

  const csvContent = lines.join('\r\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

// ---------- Student progress report (beautiful, printable-to-PDF) ----------
// Same logic as the super admin's version, scoped to myChurch directly
// since a church admin only ever has one church to report on.

function computeReportStats(rows){
  const totalStudents = rows.length;
  const completedCount = rows.filter(r => r.total_items > 0 && r.items_completed === r.total_items).length;
  const avgPct = totalStudents
    ? Math.round(rows.reduce((sum, r) => sum + (r.total_items ? r.items_completed / r.total_items : 0), 0) / totalStudents * 100)
    : 0;

  const buckets = { completed: 0, wellUnderway: 0, justStarted: 0, notStarted: 0 };
  rows.forEach(r => {
    if(r.total_items > 0 && r.items_completed === r.total_items) buckets.completed++;
    else if(r.total_items > 0 && r.items_completed / r.total_items >= 0.5) buckets.wellUnderway++;
    else if(r.items_completed > 0) buckets.justStarted++;
    else buckets.notStarted++;
  });

  return { totalStudents, completedCount, avgPct, buckets };
}

function buildDonutSegments(segments, radius = 70){
  const circumference = 2 * Math.PI * radius;
  const total = segments.reduce((sum, s) => sum + s.count, 0);
  if(total === 0) return [];

  let cumulativeOffset = 0;
  return segments
    .filter(s => s.count > 0)
    .map(s => {
      const fraction = s.count / total;
      const arcLength = fraction * circumference;
      const dashArray = `${arcLength} ${circumference - arcLength}`;
      const dashOffset = -cumulativeOffset;
      cumulativeOffset += arcLength;
      return { ...s, dashArray, dashOffset, pct: Math.round(fraction * 100) };
    });
}

// Asks which time range the report should cover before building it. Range =
// the year a student ENROLLED (enrolled_at), so "2025" means everyone who
// started in 2025 and where they are now.
function chooseReportRange(rows, onPick){
  const byYear = {};
  rows.forEach(r => {
    const y = r.enrolled_at ? new Date(r.enrolled_at).getFullYear() : null;
    if(y && !isNaN(y)) byYear[y] = (byYear[y] || 0) + 1;
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);
  if(!years.length){ onPick(rows, 'All time'); return; }
  const thisYear = new Date().getFullYear();
  const opts = [{ label: 'All time', sub: `${rows.length} student${rows.length === 1 ? '' : 's'}`, year: null }]
    .concat(years.map(y => ({ label: String(y), sub: `${byYear[y]} student${byYear[y] === 1 ? '' : 's'}${y === thisYear ? ' · this year' : ''}`, year: y })));
  if(!byYear[thisYear]) opts.splice(1, 0, { label: String(thisYear), sub: 'this year · no students yet', year: thisYear, disabled: true });
  const modal = document.createElement('div');
  modal.className = 'rp-modal';
  modal.innerHTML = `
    <div class="rp-modal-card" role="dialog" aria-label="Choose report range">
      <div class="rp-label">Progress Report</div>
      <h3 class="rp-modal-title">Which students?</h3>
      <p class="rp-modal-sub">Choose a time range. A year includes everyone who started in that year.</p>
      <div class="rp-modal-opts">
        ${opts.map((o, i) => `<button type="button" class="rp-opt" data-i="${i}" ${o.disabled ? 'disabled' : ''}><span>${o.label}</span><small>${o.sub}</small></button>`).join('')}
      </div>
      <button type="button" class="mini-btn rp-modal-cancel">Cancel</button>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if(e.target === modal) modal.remove(); });
  modal.querySelector('.rp-modal-cancel').addEventListener('click', () => modal.remove());
  modal.querySelectorAll('.rp-opt').forEach(btn => btn.addEventListener('click', () => {
    const o = opts[Number(btn.dataset.i)];
    modal.remove();
    const picked = o.year === null ? rows : rows.filter(r => r.enrolled_at && new Date(r.enrolled_at).getFullYear() === o.year);
    onPick(picked, o.label);
  }));
}

function renderStudentReport(rows, church, courseTitle, showAggregateSections, capStudentListTo10, rangeLabel){
  courseTitle = courseTitle || 'Following Jesus';
  rangeLabel = rangeLabel || 'All time';
  const stats = computeReportStats(rows);
  const churchName = church ? church.name : courseTitle;
  const radius = 60;
  // Black / gold / grey palette -- the church accent color is no longer used
  // in the report (deliberate: consistent look, prints cleanly).
  const COLORS = { completed:'#B08D3E', wellUnderway:'#111111', justStarted:'#8C8A80', notStarted:'#DAD8CF' };
  const segments = buildDonutSegments([
    { label: 'Completed', count: stats.buckets.completed, color: COLORS.completed },
    { label: 'Well underway', count: stats.buckets.wellUnderway, color: COLORS.wellUnderway },
    { label: 'Just started', count: stats.buckets.justStarted, color: COLORS.justStarted },
    { label: 'Not started', count: stats.buckets.notStarted, color: COLORS.notStarted }
  ], radius);

  const ringSvg = segments.length ? `
    <svg viewBox="0 0 170 170" width="150" height="150" style="flex-shrink:0" role="img" aria-label="Progress breakdown">
      <g transform="rotate(-90 85 85)" fill="none" stroke-width="26">
        ${segments.map(s => `<circle cx="85" cy="85" r="${radius}" stroke="${s.color}" stroke-dasharray="${s.dashArray}" stroke-dashoffset="${s.dashOffset}" />`).join('')}
      </g>
      <text x="85" y="88" text-anchor="middle" font-family="Newsreader,Georgia,serif" font-size="30" font-weight="600" fill="#111">${stats.totalStudents}</text>
      <text x="85" y="106" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#55564F">${stats.totalStudents === 1 ? 'student' : 'students'}</text>
    </svg>` : '';

  const legendItems = [
    ['Completed', stats.buckets.completed, COLORS.completed],
    ['Well underway', stats.buckets.wellUnderway, COLORS.wellUnderway],
    ['Just started', stats.buckets.justStarted, COLORS.justStarted],
    ['Not started', stats.buckets.notStarted, COLORS.notStarted]
  ];
  const legendHtml = legendItems.map(([label, count, color]) => `
    <div><div class="rp-legend-name"><span class="rp-legend-dot" style="background:${color};"></span>${label}</div><div class="rp-legend-count">${count}</div></div>`).join('');
  const stackHtml = stats.totalStudents ? legendItems.filter(l => l[1] > 0).map(([label, count, color]) =>
    `<div style="width:${(count / stats.totalStudents) * 100}%;background:${color};"></div>`).join('') : '';

  const distCardHtml = stats.totalStudents ? `
    <div class="rp-card">
      <div class="rp-label">Where everyone is</div>
      <div class="rp-dist">
        ${ringSvg}
        <div class="rp-dist-side">
          <div class="rp-legend">${legendHtml}</div>
          <div class="rp-stack">${stackHtml}</div>
        </div>
      </div>
    </div>` : `
    <div class="rp-card">
      <div class="rp-label">Where everyone is</div>
      <p class="rp-empty">No students in this time range.</p>
    </div>`;

  const pctOf = r => r.total_items ? Math.round((r.items_completed / r.total_items) * 100) : 0;
  const stageOf = r => {
    if(r.total_items > 0 && r.items_completed === r.total_items) return { label:'Completed', color:COLORS.completed, done:true };
    if(r.total_items > 0 && r.items_completed / r.total_items >= 0.5) return { label:'Well underway', color:COLORS.wellUnderway };
    if(r.items_completed > 0) return { label:'Just started', color:COLORS.justStarted };
    return { label:'Not started', color:COLORS.justStarted };
  };
  const rowHtml = (r, i, showChurch) => {
    const pct = pctOf(r);
    const st = stageOf(r);
    const sub = (showChurch && r.church_name) ? `<small>${escapeHtmlReport(r.church_name)}</small>` : '';
    return `
      <div class="rp-row">
        <span class="rp-rank">${i + 1}</span>
        <span class="rp-name">${escapeHtmlReport(r.full_name || 'Unnamed student')}${sub}</span>
        <span class="rp-track"><span class="rp-fill" style="width:${pct}%;background:${st.color};"></span></span>
        <span class="rp-stage${st.done ? ' rp-done' : ''}">${st.label}</span>
        <span class="rp-pct">${pct}</span>
      </div>`;
  };
  const tableHead = `
      <div class="rp-row rp-row-head"><span>#</span><span>Name</span><span>Progress</span><span class="rp-stage">Stage</span><span style="text-align:right">%</span></div>`;

  // Metrics/donut are always computed from the FULL rows regardless of
  // capStudentListTo10 -- capping only affects the itemized list.
  const sortedRows = [...rows].sort((a,b) => (b.items_completed/Math.max(b.total_items,1)) - (a.items_completed/Math.max(a.total_items,1)));
  const rowsForList = capStudentListTo10 ? sortedRows.slice(0, 10) : sortedRows;
  const capped = capStudentListTo10 && sortedRows.length > 10;
  const studentsLabel = capped ? 'Top 10 students' : 'Student progress';
  const totalLabel = capped ? `Top 10 of ${sortedRows.length}` : `${sortedRows.length} ${sortedRows.length === 1 ? 'student' : 'students'}`;

  // ---- Build the pages. Page 1 = header + totals + chart + first rows;
  // later pages = the remaining people (15 per page). Online the pager shows
  // one page at a time; printing/PDF puts each page on its own sheet.
  const FIRST_PAGE_ROWS = 10, LATER_PAGE_ROWS = 15;
  const dateStr = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  const rangeText = rangeLabel === 'All time' ? 'All time' : rangeLabel;
  const headerHtml = `
      <div class="rp-header">
        <div class="rp-eyebrow">Progress Report &middot; ${escapeHtmlReport(rangeText)} &middot; ${dateStr}</div>
        <h1>${escapeHtmlReport(churchName)}</h1>
        ${church ? `<div class="rp-course">${escapeHtmlReport(courseTitle)}</div>` : ''}
      </div>`;
  const statsHtml = `
      <div class="rp-card rp-stats">
        <div class="rp-stat"><div class="rp-stat-num">${stats.totalStudents}</div><div class="rp-stat-label">Students enrolled</div></div>
        <div class="rp-stat"><div class="rp-stat-num">${stats.completedCount}</div><div class="rp-stat-label">Finished the course</div></div>
        <div class="rp-stat"><div class="rp-stat-num">${stats.avgPct}<span class="rp-pct">%</span></div><div class="rp-stat-label">Average progress</div></div>
      </div>`;
  const tableCard = (label, note, slice, startIndex, showChurch) => `
      <div class="rp-card">
        <div class="rp-table-head"><div class="rp-label">${label}</div><div class="rp-table-note">${note}</div></div>
        ${tableHead}
        ${slice.map((r, i) => rowHtml(r, startIndex + i, showChurch)).join('')}
      </div>`;

  const pages = [];
  let page1 = headerHtml + statsHtml + distCardHtml;

  if(showAggregateSections){
    const countsByCourse = {};
    rows.forEach(r => {
      const title = r.course_title || 'Untitled course';
      countsByCourse[title] = (countsByCourse[title] || 0) + 1;
    });
    const topCourses = Object.entries(countsByCourse).sort((a,b) => b[1] - a[1]).slice(0, 10);
    const maxCourseCount = topCourses.length ? topCourses[0][1] : 1;
    if(topCourses.length) page1 += `
      <div class="rp-card">
        <div class="rp-table-head"><div class="rp-label">Top courses by enrollment</div><div class="rp-table-note">Top ${topCourses.length}</div></div>
        ${topCourses.map(([title, count], i) => `
          <div class="rp-row">
            <span class="rp-rank">${i + 1}</span>
            <span class="rp-name">${escapeHtmlReport(title)}</span>
            <span class="rp-track"><span class="rp-fill" style="width:${Math.round((count/maxCourseCount)*100)}%;background:#111;"></span></span>
            <span class="rp-stage"></span>
            <span class="rp-pct">${count}</span>
          </div>`).join('')}
      </div>`;
    pages.push(page1);
    const topStudents = sortedRows.slice(0, 10);
    if(topStudents.length) pages.push(tableCard('Top students by progress', `Top ${topStudents.length}`, topStudents, 0, true));
  } else if(!rowsForList.length){
    pages.push(page1 + `<div class="rp-card"><div class="rp-label">${studentsLabel}</div><p class="rp-empty">No students enrolled${rangeLabel === 'All time' ? ' yet' : ' in this time range'}.</p></div>`);
  } else {
    pages.push(page1 + tableCard(studentsLabel, totalLabel, rowsForList.slice(0, FIRST_PAGE_ROWS), 0, false));
    for(let i = FIRST_PAGE_ROWS; i < rowsForList.length; i += LATER_PAGE_ROWS){
      pages.push('@@MINIHEAD@@' + tableCard(studentsLabel + ' (continued)', totalLabel, rowsForList.slice(i, i + LATER_PAGE_ROWS), i, false));
    }
  }

  const footerHtml = `
      <div class="rp-footer">
        <div class="rp-verse">&ldquo;He who began a good work in you will carry it on to completion.&rdquo; Philippians 1:6</div>
        <div class="rp-brand">Following Jesus</div>
      </div>`;
  const total = pages.length;
  const sheetsHtml = pages.map((p, i) => {
    const mini = `
      <div class="rp-minihead"><div class="rp-minihead-name">${escapeHtmlReport(churchName)}</div><div class="rp-minihead-meta">Progress Report &middot; ${escapeHtmlReport(rangeText)} &middot; Page ${i + 1} of ${total}</div></div>`;
    return `<div class="rp-sheet${i === 0 ? ' active' : ''}${i === total - 1 ? ' rp-last' : ''}" data-page="${i}">${p.replace('@@MINIHEAD@@', mini)}${i === total - 1 ? footerHtml : ''}</div>`;
  }).join('');
  const pagerHtml = total > 1 ? `
      <div class="rp-pager">
        <button type="button" class="mini-btn" id="rp-prev" disabled>&larr; Previous</button>
        <span id="rp-pager-label">Page 1 of ${total}</span>
        <button type="button" class="mini-btn" id="rp-next">Next &rarr;</button>
      </div>` : '';

  const overlay = document.createElement('div');
  overlay.id = 'report-overlay';
  overlay.innerHTML = `
    <div class="report-toolbar">
      <button class="mini-btn" id="report-close-btn">&larr; Close</button>
      <div style="display:flex;gap:8px;">
        <button class="mini-btn" id="report-csv-btn">Download CSV</button>
        <button class="mini-btn gold" id="report-pdf-btn">Download PDF</button>
      </div>
    </div>
    <div class="report-page">
      ${sheetsHtml}
      ${pagerHtml}
    </div>
  `;
  document.body.appendChild(overlay);

  let cur = 0;
  const showPage = n => {
    cur = Math.max(0, Math.min(total - 1, n));
    overlay.querySelectorAll('.rp-sheet').forEach((el, i) => el.classList.toggle('active', i === cur));
    const lbl = document.getElementById('rp-pager-label'); if(lbl) lbl.textContent = `Page ${cur + 1} of ${total}`;
    const pv = document.getElementById('rp-prev'); if(pv) pv.disabled = cur === 0;
    const nx = document.getElementById('rp-next'); if(nx) nx.disabled = cur === total - 1;
    overlay.scrollTop = 0;
  };
  document.getElementById('rp-prev')?.addEventListener('click', () => showPage(cur - 1));
  document.getElementById('rp-next')?.addEventListener('click', () => showPage(cur + 1));

  document.getElementById('report-close-btn').addEventListener('click', () => overlay.remove());
  document.getElementById('report-pdf-btn').addEventListener('click', () => window.print());
  document.getElementById('report-csv-btn').addEventListener('click', () => {
    const nameSlug = churchName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    const rangeSlug = rangeLabel === 'All time' ? '' : '-' + rangeLabel;
    exportStudentsCSV(rows, `${nameSlug}-students${rangeSlug}-${new Date().toISOString().slice(0,10)}.csv`);
  });
}

function escapeHtmlReport(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Send Email to My Students ---------- */
// Mirrors send-broadcast-email.js's formatting rules exactly (**bold**,
// [text](url), ![](image url), "# " heading lines) so the preview is
// byte-identical to what actually sends.
function applyInlineFormattingPreview(escapedLine){
  return escapedLine
    .replace(/!\[\]\((https?:\/\/[^\s)]+)\)/g, '<img src="$1" alt="" style="width:100%;display:block;border-radius:8px;margin:8px 0;" />')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" style="color:#17191D;text-decoration:underline;">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

function buildBroadcastPreviewHtml(bodyText, imageUrl, linkText, linkUrl){
  const source = bodyText || '(your message will appear here)';
  const paragraphs = source
    .split(/\n\s*\n/)
    .map(block => {
      if(/^#\s+/.test(block)){
        const headingText = applyInlineFormattingPreview(escapeHtmlReport(block.replace(/^#\s+/, '')));
        return `<p style="margin:0 0 16px;font-size:19px;font-weight:700;">${headingText}</p>`;
      }
      return `<p style="margin:0 0 16px;">${applyInlineFormattingPreview(escapeHtmlReport(block)).replace(/\n/g, '<br>')}</p>`;
    })
    .join('');
  const imageBlock = imageUrl ? `<img src="${imageUrl}" alt="" style="width:100%;display:block;" />` : '';
  const buttonBlock = (linkUrl && linkText)
    ? `<p style="text-align:center;margin:8px 0 24px;"><a href="${linkUrl}" style="background:#17191D;color:#ffffff;padding:12px 24px;text-decoration:none;border-radius:6px;display:inline-block;font-weight:600;">${escapeHtmlReport(linkText)}</a></p>`
    : '';
  return `
    <div style="background:#F4F4F2;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
      <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;">
        <div style="background:#17191D;padding:22px 24px;text-align:center;">
          <span style="color:#ffffff;font-weight:700;letter-spacing:0.14em;font-size:13px;text-transform:uppercase;">Following Jesus</span>
        </div>
        ${imageBlock}
        <div style="padding:32px 28px 8px;color:#17191D;font-size:15px;line-height:1.65;">
          ${paragraphs}
        </div>
        ${buttonBlock}
        <div style="padding:0 28px 28px;">
          <p style="color:#9CA3AF;font-size:11.5px;margin:0;border-top:1px solid #E4E3DD;padding-top:16px;">
            Don't want occasional emails like this? <a href="#">Unsubscribe</a>
          </p>
        </div>
      </div>
    </div>
  `;
}

// Only one possible audience here (this admin's own church, enforced
// server-side by get_my_church_broadcast_recipients deriving the church
// from the caller's own profile) -- no scope options needed, unlike the
// super admin's version.
// Reusable formatting-toolbar helpers -- same as admin-dashboard.html's
// version, insert the same markdown-lite syntax the server parses, via
// a button instead of requiring anyone to type it themselves.
function wrapTextareaSelection(textareaId, before, after, placeholder){
  const textarea = document.getElementById(textareaId);
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const selected = textarea.value.slice(start, end) || placeholder;
  textarea.setRangeText(before + selected + after, start, end, 'select');
  textarea.focus();
}
function insertHeadingLine(textareaId){
  const textarea = document.getElementById(textareaId);
  const value = textarea.value;
  const cursor = textarea.selectionStart;
  const lineStart = value.lastIndexOf('\n', cursor - 1) + 1;
  if(value.slice(lineStart, lineStart + 2) === '# ') return;
  textarea.setRangeText('# ', lineStart, lineStart, 'end');
  textarea.focus();
}
function insertLinkFormatting(textareaId){
  const url = prompt('Link URL:');
  if(!url) return;
  const textarea = document.getElementById(textareaId);
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const selected = textarea.value.slice(start, end) || 'link text';
  textarea.setRangeText(`[${selected}](${url})`, start, end, 'select');
  textarea.focus();
}
function wireFormattingToolbar(textareaId, boldBtnId, headingBtnId, linkBtnId){
  document.getElementById(boldBtnId).addEventListener('click', () => wrapTextareaSelection(textareaId, '**', '**', 'bold text'));
  document.getElementById(headingBtnId).addEventListener('click', () => insertHeadingLine(textareaId));
  document.getElementById(linkBtnId).addEventListener('click', () => insertLinkFormatting(textareaId));
}

  }

  const imageFileInput = document.getElementById('broadcast-image-file');
  imageFileInput.addEventListener('change', () => handleImageFile(imageFileInput.files[0]));

  const dropzone = document.getElementById('broadcast-image-dropzone');
  ['dragenter', 'dragover'].forEach(evt => dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.style.borderColor = 'var(--ink)';
  }));
  ['dragleave', 'drop'].forEach(evt => dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.style.borderColor = 'var(--line)';
  }));
  dropzone.addEventListener('drop', (e) => {
    const file = e.dataTransfer?.files?.[0];
    if(file && file.type.startsWith('image/')) handleImageFile(file);
  });

  const getFormValues = () => ({
    subject: document.getElementById('broadcast-subject').value.trim(),
    message: document.getElementById('broadcast-message').value.trim(),
    linkText: document.getElementById('broadcast-link-text').value.trim(),
    linkUrl: document.getElementById('broadcast-link-url').value.trim(),
  });

  if(session?.access_token){
    const { data: draftRows } = await supabaseClient.rpc('get_my_broadcast_draft', { p_draft_key: BROADCAST_DRAFT_KEY });
    const draft = draftRows?.[0];
    if(draft && (draft.subject || draft.message)){
      document.getElementById('broadcast-subject').value = draft.subject || '';
      document.getElementById('broadcast-message').value = draft.message || '';
      document.getElementById('broadcast-link-text').value = draft.link_text || '';
      document.getElementById('broadcast-link-url').value = draft.link_url || '';
      if(draft.image_url){
        uploadedImageUrl = draft.image_url;
        document.getElementById('broadcast-image-status').textContent = 'Image from draft ✓';
      }
      document.getElementById('broadcast-draft-notice').style.display = 'block';
    }
  }

  document.getElementById('broadcast-discard-draft-btn').addEventListener('click', async () => {
    await supabaseClient.rpc('delete_my_broadcast_draft', { p_draft_key: BROADCAST_DRAFT_KEY });
    document.getElementById('broadcast-subject').value = '';
    document.getElementById('broadcast-message').value = '';
    document.getElementById('broadcast-link-text').value = '';
    document.getElementById('broadcast-link-url').value = '';
    document.getElementById('broadcast-image-status').textContent = '';
    uploadedImageUrl = null;
    document.getElementById('broadcast-draft-notice').style.display = 'none';
  });

  document.getElementById('broadcast-save-draft-btn').addEventListener('click', async () => {
    const { subject, message, linkText, linkUrl } = getFormValues();
    const statusEl = document.getElementById('broadcast-status');
    await supabaseClient.rpc('save_broadcast_draft', {
      p_draft_key: BROADCAST_DRAFT_KEY, p_subject: subject, p_message: message, p_image_url: uploadedImageUrl, p_link_text: linkText, p_link_url: linkUrl
    });
    statusEl.textContent = 'Draft saved — come back anytime, this composer will load it automatically.';
  });

  document.getElementById('broadcast-preview-btn').addEventListener('click', () => {
    const { message, linkText, linkUrl } = getFormValues();
    const previewArea = document.getElementById('broadcast-preview-area');
    const html = buildBroadcastPreviewHtml(message, uploadedImageUrl, linkText, linkUrl);
    previewArea.innerHTML = `<iframe srcdoc="${html.replace(/"/g,'&quot;')}" style="width:100%;height:420px;border:none;display:block;"></iframe>`;
    previewArea.style.display = 'block';
  });

  document.getElementById('broadcast-test-btn').addEventListener('click', async () => {
    const { subject, message, linkText, linkUrl } = getFormValues();
    const statusEl = document.getElementById('broadcast-status');
    if(!subject || !message){ statusEl.textContent = 'Please fill in both the subject and message first.'; return; }
    statusEl.textContent = 'Sending a test to your own email...';
    try {
      const res = await fetch('/.netlify/functions/send-broadcast-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ subject, message, imageUrl: uploadedImageUrl, linkText, linkUrl, testOnly: true })
      });
      const result = await res.json();
      statusEl.textContent = res.ok ? `Test sent to ${result.to} — check your inbox.` : 'Something went wrong: ' + (result.error || 'unknown error');
    } catch (err) {
      statusEl.textContent = 'Something went wrong sending the test.';
    }
  });

  document.getElementById('broadcast-send-btn').addEventListener('click', async () => {
    const { subject, message, linkText, linkUrl } = getFormValues();
    const statusEl = document.getElementById('broadcast-status');
    const sendBtn = document.getElementById('broadcast-send-btn');
    if(!subject || !message){ statusEl.textContent = 'Please fill in both the subject and message.'; return; }
    if(!confirm(`Send this email to your students? This can't be undone once sent.`)) return;

    sendBtn.disabled = true;
    statusEl.textContent = 'Starting...';
    try {
      const res = await fetch('/.netlify/functions/send-broadcast-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ subject, message, imageUrl: uploadedImageUrl, linkText, linkUrl })
      });
      const result = await res.json();
      if(!res.ok || !result.jobId){
        statusEl.textContent = 'Something went wrong: ' + (result.error || 'unknown error');
        sendBtn.disabled = false;
        return;
      }
      await supabaseClient.rpc('delete_my_broadcast_draft', { p_draft_key: BROADCAST_DRAFT_KEY });
      pollBroadcastJob(result.jobId, statusEl);
    } catch (err) {
      statusEl.textContent = 'Something went wrong starting this. Please try again.';
      sendBtn.disabled = false;
    }
  });
}

          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.92c1.7-1.57 2.68-3.88 2.68-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.95H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.05l3.01-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
          Continue with Google
        </button>
        <p style="font-size:12px;color:var(--ink-soft);margin-top:12px;">Works with any email address you already use — not just Gmail.</p>
      </div>
    `;
    document.getElementById('admin-google-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: cleanRedirectUrl(), queryParams: { prompt: 'select_account' } }
      });
    });
    return;
  }
  currentAdminId = user.id;
  renderAccountInfo(user.email);

  const { data: profile } = await supabaseClient
    .from('profiles').select('role, church_id, churches(name)').eq('id', user.id).maybeSingle();

  if(!profile || profile.role !== 'church_admin'){
    document.getElementById('content').textContent = 'This dashboard is only available to church admins.';
    return;
  }

  document.getElementById('church-name').textContent = profile.churches?.name || 'Your church';

  const { data: churchRow } = await supabaseClient.from('churches').select('*').eq('id', profile.church_id).maybeSingle();
  myChurch = churchRow;

  const { data: rows, error } = await supabaseClient
    .from('church_student_progress')
    .select('*')
    .eq('church_id', profile.church_id)
    .order('full_name', { ascending: true });

  if(error || !rows){ document.getElementById('content').textContent = 'Could not load student progress.'; return; }
  allRows = rows;

  const { data: pending } = await supabaseClient.rpc('get_pending_legacy_students', { target_church_id: profile.church_id });
  allPendingStudents = pending || [];
  await renderDashboard(rows, allPendingStudents);
}

async function renderDashboard(rows, pendingStudents = allPendingStudents){
  const [{ data: currentAdminsData }, { data: myGroupsData }] = await Promise.all([
    supabaseClient.rpc('get_church_admins_with_email', { p_church_id: myChurch.id }),
    supabaseClient.from('course_groups').select('*').eq('church_id', myChurch.id).order('name')
  ]);
  const currentAdmins = currentAdminsData || [];
  const myGroups = myGroupsData || [];

  const leaderIds = myGroups.map(g => g.leader_id).filter(Boolean);
  let leaderNameById = {};
  if(leaderIds.length){
    const { data: leaderProfiles } = await supabaseClient.from('profiles').select('id, full_name').in('id', leaderIds);
    (leaderProfiles || []).forEach(p => { leaderNameById[p.id] = p.full_name || 'Unnamed'; });
  }

  const totalStudents = rows.length;
  const completedCount = rows.filter(r => r.total_items > 0 && r.items_completed === r.total_items).length;
  const avgPct = totalStudents
    ? Math.round(rows.reduce((sum, r) => sum + (r.total_items ? r.items_completed / r.total_items : 0), 0) / totalStudents * 100)
    : 0;

  const rowsHtml = rows.map(r => {
    const pct = r.total_items ? Math.round((r.items_completed / r.total_items) * 100) : 0;

    const statusEl = document.getElementById('upload-photo-status');
    statusEl.textContent = 'Uploading...';
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${myChurch.id}/${Date.now()}.${ext}`;
    const { error: uploadError } = await supabaseClient.storage.from('church-photos').upload(path, file);
    if(uploadError){
      statusEl.textContent = '';
      alert('Could not upload the photo: ' + uploadError.message);
      return;
    }
    const { data: urlData } = supabaseClient.storage.from('church-photos').getPublicUrl(path);
    document.getElementById('edit-letter-image').value = urlData.publicUrl;
    statusEl.textContent = 'Uploaded ✓';
    setTimeout(() => { statusEl.textContent = ''; }, 2000);
  }

  const photoFileInput = document.getElementById('edit-letter-image-file');
  if(photoFileInput) photoFileInput.addEventListener('change', () => handleChurchPhotoFile(photoFileInput.files[0]));

  const photoDropzone = document.getElementById('edit-letter-image-dropzone');
  if(photoDropzone){
    ['dragenter', 'dragover'].forEach(evt => photoDropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      photoDropzone.style.borderColor = 'var(--ink)';
    }));
    ['dragleave', 'drop'].forEach(evt => photoDropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      photoDropzone.style.borderColor = 'var(--line)';
    }));
    photoDropzone.addEventListener('drop', (e) => {
      const file = e.dataTransfer?.files?.[0];
      if(file && file.type.startsWith('image/')) handleChurchPhotoFile(file);
    });
  }

  const saveBtn = document.getElementById('save-church-settings-btn');
  if(saveBtn) saveBtn.addEventListener('click', async () => {
    const videoInput = document.getElementById('edit-letter-video').value.trim();
    const videoId = extractYoutubeId(videoInput);
    if(videoInput && !videoId){
      alert("That doesn't look like a valid YouTube link — please check it and try again.");
      return;
    }
    const statusEl = document.getElementById('save-status');
    const updates = {
      primary_color: document.getElementById('edit-church-color').value.trim() || null,
      letter_title: document.getElementById('edit-letter-title').value.trim() || null,
      letter_subtitle: document.getElementById('edit-letter-subtitle').value.trim() || null,
      letter_body: document.getElementById('edit-letter-body').value.trim() || null,
      letter_video_youtube_id: videoId || null,
      letter_image_url: document.getElementById('edit-letter-image').value.trim() || null,
      letter_author_name: document.getElementById('edit-letter-author').value.trim() || null,
      letter_author_title: document.getElementById('edit-letter-author-title').value.trim() || null,
      website_url: document.getElementById('edit-website').value.trim() || null
    };
    statusEl.textContent = 'Saving...';
    const { data: updated, error } = await supabaseClient.from('churches').update(updates).eq('id', myChurch.id).select().maybeSingle();
    if(error || !updated){
      statusEl.textContent = '';
      alert('Could not save: ' + (error?.message || 'unknown error'));
      return;
    }
    myChurch = updated;
    statusEl.textContent = 'Saved ✓';
    setTimeout(() => { statusEl.textContent = ''; }, 2000);
  });

  const promoteBtn = document.getElementById('promote-admin-btn');
  if(promoteBtn) promoteBtn.addEventListener('click', async () => {
    const email = document.getElementById('promote-admin-email').value.trim();
    const statusEl = document.getElementById('promote-status');
    if(!email){ statusEl.textContent = 'Enter an email first.'; return; }
    statusEl.textContent = 'Promoting...';
    const { data: result, error } = await supabaseClient.rpc('promote_to_church_admin', { target_email: email, target_church_id: myChurch.id });
    if(error || result !== 'success'){
      statusEl.textContent = result === 'not_found'
        ? 'No account found with that email — they need to sign up first.'
        : 'Something went wrong. Please try again.';
      return;
    }
    statusEl.textContent = 'Promoted ✓';
    init();
  });

  const pauseCourseBtn = document.getElementById('pause-course-btn');
  if(pauseCourseBtn) pauseCourseBtn.addEventListener('click', async () => {
    if(!confirm('Pause enrollment for your course? Your page stays up, but no one new will be able to enroll until the Following Jesus team turns it back on.')) return;
    const statusEl = document.getElementById('pause-course-status');
    pauseCourseBtn.disabled = true;
    statusEl.textContent = 'Pausing...';
    const { data: result, error } = await supabaseClient.rpc('church_admin_pause_own_course', { p_church_id: myChurch.id });
    if(error || result !== 'success'){
      statusEl.textContent = 'Something went wrong. Please try again.';
      pauseCourseBtn.disabled = false;
      return;
    }
    myChurch.course_status = 'draft';
    init();
  });

  // create_admin_invite_as_church_contact looks up the caller's own
  // church_id itself, server-side -- myChurch.id is never sent to it,
  // so there's no way this could ever be pointed at a different
  // church, no matter what the request claims.
  const inviteBtn = document.getElementById('invite-admin-btn');
  if(inviteBtn) inviteBtn.addEventListener('click', async () => {
    const email = document.getElementById('invite-admin-email').value.trim();
    const name = document.getElementById('invite-admin-name').value.trim();
    const statusEl = document.getElementById('invite-admin-status');
    if(!email){ statusEl.textContent = 'Enter an email first.'; return; }
    statusEl.textContent = 'Sending invite...';
    inviteBtn.disabled = true;
    const { data: result, error } = await supabaseClient.rpc('create_admin_invite_as_church_contact', { p_email: email, p_contact_name: name || null });
    if(error || result?.status !== 'success'){
      statusEl.textContent = 'Something went wrong. Please try again.';
      inviteBtn.disabled = false;
      return;
    }
    try {
      const res = await fetch('/.netlify/functions/send-single-admin-invite', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: result.email,
          contact_name: result.contact_name,
          church_name: result.church_name,
          church_slug: result.church_slug,
          invite_token: result.invite_token
        })
      });
      const sendResult = await res.json();
      statusEl.textContent = sendResult.sent ? 'Invite sent ✓' : 'Invite created, but the email failed to send.';
    } catch (e) {
      statusEl.textContent = 'Invite created, but the email failed to send.';
    }
    document.getElementById('invite-admin-email').value = '';
    document.getElementById('invite-admin-name').value = '';
    inviteBtn.disabled = false;
  });

  document.querySelectorAll('[data-remove-admin]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Remove this person as church admin? They\'ll go back to being a regular student.')) return;
      await supabaseClient.from('profiles').update({ role: 'student' }).eq('id', btn.dataset.removeAdmin);
      init();
    });
  });

  const exportStudentsBtn = document.getElementById('export-students-btn');
  if(exportStudentsBtn) exportStudentsBtn.addEventListener('click', () => {
    const nameSlug = (myChurch?.name || 'church').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    exportStudentsCSV(rows, `${nameSlug}-students-${new Date().toISOString().slice(0,10)}.csv`);
  });

  const viewReportBtn = document.getElementById('view-report-btn');
  if(viewReportBtn) viewReportBtn.addEventListener('click', () => chooseReportRange(rows, (picked, label) => renderStudentReport(picked, myChurch, 'Following Jesus Course', false, false, label)));

  const churchSendEmailBtn = document.getElementById('church-send-email-btn');
  if(churchSendEmailBtn) churchSendEmailBtn.addEventListener('click', renderBroadcastComposer);


  const createGroupBtn = document.getElementById('create-group-btn');
  if(createGroupBtn) createGroupBtn.addEventListener('click', async () => {
    const name = document.getElementById('new-group-name').value.trim();
    const leader = document.getElementById('new-group-leader').value.trim();
    if(!name) return;
    await supabaseClient.from('course_groups').insert({ church_id: myChurch.id, name, leader_name: leader || null });
    init();
  });

  document.querySelectorAll('[data-assign-group-leader]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const groupId = btn.dataset.assignGroupLeader;
      const input = document.querySelector(`[data-assign-leader-input="${groupId}"]`);
      const email = input.value.trim();
      if(!email){ alert('Enter an email first.'); return; }
      const { data: result, error } = await supabaseClient.rpc('assign_group_leader', { target_email: email, target_group_id: groupId });
      if(error || result !== 'success'){
        alert(result === 'not_found' ? 'No account found with that email — they need to sign up first.' : 'Something went wrong. Please try again.');
        return;
      }
      init();
    });
  });

  document.querySelectorAll('[data-remove-group-leader]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Remove this person as leader of this group?')) return;
      await supabaseClient.rpc('remove_group_leader', { target_group_id: btn.dataset.removeGroupLeader });
      init();
    });
  });

  const copyBtn = document.getElementById('copy-pending-emails-btn');
  if(copyBtn) copyBtn.addEventListener('click', async () => {
    const emailList = pendingStudents.map(p => p.email).join(', ');
    try {
      await navigator.clipboard.writeText(emailList);
      document.getElementById('copy-status').textContent = `Copied ${pendingStudents.length} emails ✓`;
    } catch (e) {
      document.getElementById('copy-status').textContent = 'Could not copy — check clipboard permissions.';
    }
  });

  document.querySelectorAll('td.clickable-cell').forEach(td => {
    td.addEventListener('click', () => renderStudentDetail(td.dataset.studentId, td.dataset.courseId));
  });

  document.querySelectorAll('[data-unenroll]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(!confirm(`Unenroll ${btn.dataset.name} from this course? Their progress and answers will be permanently deleted.`)) return;
      await supabaseClient.from('enrollments').delete().eq('id', btn.dataset.unenroll);
      allRows = allRows.filter(r => r.enrollment_id !== btn.dataset.unenroll);
      await renderDashboard(allRows);
    });
  });

  document.querySelectorAll('[data-view-cert]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const { data: cert } = await supabaseClient.from('certificates').select('certificate_code').eq('student_id', btn.dataset.viewCert).eq('course_id', btn.dataset.certCourse).maybeSingle();
      if(cert) window.open(`certificate.html?code=${cert.certificate_code}`, '_blank');
      else alert('No certificate found yet for this student.');
    });
  });

  // Both buttons below call the same church-scoped function, real
  // emails sent immediately on click -- not a preview. The single
  // per-student send skips the normal 6-day cooldown (it's a
  // deliberate one-off nudge, not the automated weekly sweep), but
  // still respects unsubscribe and "already finished" server-side
  // regardless of what this button shows.
  async function sendChurchReminders(enrollmentId){
    const { data: { session } } = await supabaseClient.auth.getSession();
    const res = await fetch('/.netlify/functions/admin-trigger-church-reminders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session?.access_token || ''}` },
      body: JSON.stringify({ church_id: myChurch.id, enrollment_id: enrollmentId || null })
    });
    return res.json().then(result => ({ ok: res.ok, result }));
  }

  document.querySelectorAll('[data-remind]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(!confirm(`Send a course reminder email to ${btn.dataset.name} right now?`)) return;
      btn.disabled = true;
      btn.textContent = 'Sending…';
      const { ok, result } = await sendChurchReminders(btn.dataset.remind);
      if(!ok || !result.sent){
        alert(result.error || 'Could not send — they may have unsubscribed or already finished.');
        btn.disabled = false;
        btn.textContent = 'Remind';
      } else {
        btn.textContent = 'Sent ✓';
      }
    });
  });

  const sendChurchRemindersBtn = document.getElementById('send-church-reminders-btn');
  if(sendChurchRemindersBtn) sendChurchRemindersBtn.addEventListener('click', async () => {
    if(!confirm('Send a reminder email right now to everyone in your church who\'s enrolled, hasn\'t finished, hasn\'t been reminded in the last 6 days, and hasn\'t unsubscribed?')) return;
    sendChurchRemindersBtn.disabled = true;
    sendChurchRemindersBtn.textContent = 'Sending…';
    const { ok, result } = await sendChurchReminders(null);
    if(!ok){
      alert('Could not send reminders: ' + (result.error || 'unknown error'));
    } else {
      alert(`Done. ${result.sent} reminder email(s) sent out of ${result.totalEligible} eligible.${result.failed ? ` ${result.failed} failed.` : ''}`);
    }
    sendChurchRemindersBtn.disabled = false;
    sendChurchRemindersBtn.textContent = 'Send Reminders to This Church';
  });
}

/* ---------- Student detail: real discussion answers + reply ---------- */
async function renderStudentDetail(studentId, courseId){
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Loading student answers...</div>';

  const row = allRows.find(r => r.student_id === studentId);

  const { data: sessions } = await supabaseClient
    .from('sessions').select('*, session_items(*)').eq('course_id', courseId).order('sort_order');

  const discussionItems = (sessions||[]).flatMap(s => (s.session_items||[]).filter(i=>i.type==='discussion').map(i=>({...i, sessionTitle: s.title})));
  const itemIds = discussionItems.map(i=>i.id);

  const { data: questions } = itemIds.length
    ? await supabaseClient.from('discussion_questions').select('*').in('item_id', itemIds).order('sort_order')
    : { data: [] };

  const questionIds = (questions||[]).map(q=>q.id);
  const { data: responses } = questionIds.length
    ? await supabaseClient.from('discussion_responses').select('*').eq('student_id', studentId).in('question_id', questionIds)
    : { data: [] };
  const responseByQ = {};
  (responses||[]).forEach(r => { responseByQ[r.question_id] = r; });

  const blocksHtml = discussionItems.map(item => {
    const itemQuestions = (questions||[]).filter(q=>q.item_id===item.id);
    return itemQuestions.map(q => {
      const r = responseByQ[q.id];
      return `
        <div class="qa-block">
          <div class="qa-session">${item.sessionTitle}</div>
          <div class="qa-question">${q.question_text}</div>
          <div class="qa-answer ${r?.response_text ? '' : 'empty'}">${r?.response_text || 'No answer yet'}</div>
          ${r?.admin_reply ? `<div class="qa-reply"><div class="label">Your reply</div>${r.admin_reply}</div>` : ''}
          ${r ? `
            <textarea class="reply-box" data-response-id="${r.id}" placeholder="Write a reply...">${r.admin_reply || ''}</textarea>
            <button class="reply-btn" data-response-id="${r.id}">Send Reply</button>` : ''}
        </div>`;
    }).join('');
  }).join('');

  content.innerHTML = `
    <div class="back-link" id="back-to-list">&larr; Back to all students</div>
    <h2 style="font-family:'Space Grotesk',sans-serif;margin-bottom:4px;">${row?.full_name || 'Student'}</h2>
    <p style="color:var(--ink-soft);font-size:13.5px;margin-top:0;margin-bottom:24px;">${row?.course_title || ''}</p>
    ${blocksHtml || '<p style="color:var(--ink-soft);">No discussion questions found for this course.</p>'}
  `;

  document.getElementById('back-to-list').addEventListener('click', async () => { await renderDashboard(allRows); });

  content.querySelectorAll('.reply-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const responseId = btn.dataset.responseId;
      const textarea = content.querySelector(`textarea[data-response-id="${responseId}"]`);
      btn.textContent = 'Sending...';
      await supabaseClient.from('discussion_responses').update({
        admin_reply: textarea.value,
        admin_reply_by: currentAdminId,
        admin_reply_at: new Date().toISOString()
      }).eq('id', responseId);
      btn.textContent = 'Sent ✓';
      setTimeout(() => { btn.textContent = 'Send Reply'; }, 1500);
    });
  });
}

// ============================================================
// Spiritual Gifts tab -- results from the free Spiritual Gifts and
// Five-Fold Office assessments for people connected to this church who
// are sharing them (on by default; each person can turn it off on their
// results page). Data comes from get_my_church_gift_results(), which works
// out the church on the server from the signed-in admin -- this page never
// sends a church id. Names come from assessment-data.js.
// ============================================================
let churchGiftsLoaded = false;
let churchGiftsType = 'gifts';
let churchGiftsRows = [];

function churchGiftName(type, key){
  const c = window.FJ_ASSESSMENT && window.FJ_ASSESSMENT.categoryByKey(type, key);
  return c ? c.name : key;
}

async function renderChurchGiftsTab(){
  const panel = document.getElementById('church-gifts-panel');
  if(!panel) return;
  if(!window.FJ_ASSESSMENT){ panel.innerHTML = '<p style="color:var(--ink-soft);font-size:13px;">Could not load the assessment details. Please refresh the page.</p>'; return; }
  if(!churchGiftsLoaded){
    panel.innerHTML = '<div class="loading">Loading…</div>';
    await supabaseClient.auth.getSession(); // refresh a stale token before an RLS-protected call
    const { data, error } = await supabaseClient.rpc('get_my_church_gift_results');
    if(error){ panel.innerHTML = `<p style="color:var(--ink-soft);font-size:13px;">Could not load results: ${escapeHtmlReport(error.message)}</p>`; return; }
    churchGiftsRows = data || [];
    churchGiftsLoaded = true;
  }
  drawChurchGiftsTab();
}

function drawChurchGiftsTab(){
  const FJ = window.FJ_ASSESSMENT;
  const panel = document.getElementById('church-gifts-panel');
  const type = churchGiftsType;
  const A = FJ.ASSESSMENTS[type];
  const max = FJ.maxScore(type);
  const rows = churchGiftsRows.filter(r => r.out_assessment_type === type)
    .sort((a, b) => (a.out_full_name || '').localeCompare(b.out_full_name || ''));
  const giftsCount = churchGiftsRows.filter(r => r.out_assessment_type === 'gifts').length;
  const ffCount = churchGiftsRows.filter(r => r.out_assessment_type === 'fivefold').length;

  const topCounts = {}, firstCounts = {};
  A.categories.forEach(c => { topCounts[c.key] = 0; firstCounts[c.key] = 0; });
  rows.forEach(r => {
    const ranked = r.out_ranked || [];
    if(ranked[0] in firstCounts) firstCounts[ranked[0]]++;
    ranked.slice(0, A.topCount).forEach(k => { if(k in topCounts) topCounts[k]++; });
  });
  const dist = A.categories.filter(c => topCounts[c.key] > 0)
    .sort((a, b) => (topCounts[b.key] - topCounts[a.key]) || (firstCounts[b.key] - firstCounts[a.key]));
  const maxTop = Math.max(1, ...dist.map(c => topCounts[c.key]));

  const link = window.location.origin + A.path;
  panel.innerHTML = `
    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 16px;max-width:680px;">
      Results from the free assessments for people connected to your church. Results are shared with you automatically; anyone can turn sharing off on their results page. Use these as a starting point for conversation — your voice matters more than any score.
    </p>
    <div class="summary-row">
      <div class="summary-card"><div class="num">${giftsCount}</div><div class="label">Spiritual Gifts results</div></div>
      <div class="summary-card"><div class="num">${ffCount}</div><div class="label">Five-Fold results</div></div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;">
      <button class="mini-btn" data-church-gifts-type="gifts" ${type === 'gifts' ? 'style="background:var(--ink);color:#fff;border-color:var(--ink);"' : ''}>Spiritual Gifts</button>
      <button class="mini-btn" data-church-gifts-type="fivefold" ${type === 'fivefold' ? 'style="background:var(--ink);color:#fff;border-color:var(--ink);"' : ''}>Five-Fold Office</button>
    </div>
    <div class="panel">
      <div style="font-weight:600;font-size:14px;margin-bottom:4px;">Invite your people to take the ${escapeHtmlReport(A.title)}</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <code style="font-size:12.5px;background:var(--bg-soft);padding:6px 10px;border-radius:6px;">${escapeHtmlReport(link)}</code>
        <button class="mini-btn" id="church-gifts-copy-link">Copy Link</button>
        <span id="church-gifts-copy-status" style="font-size:12.5px;color:var(--ink-soft);"></span>
      </div>
    </div>
    ${rows.length ? `
      <div style="font-weight:600;font-size:14px;margin:4px 0 10px;">Most common ${type === 'gifts' ? 'gifts' : 'offices'} in your church</div>
      <div class="panel" style="max-width:620px;">
        ${dist.map(c => `<div style="display:grid;grid-template-columns:190px 1fr 40px;gap:10px;align-items:center;font-size:13px;margin:5px 0;">
          <span>${escapeHtmlReport(c.name)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(topCounts[c.key] / maxTop * 100)}%"></div></div>
          <span class="bar-text">${topCounts[c.key]}</span></div>`).join('')}
        <p class="field-hint" style="margin-top:8px;">How many people have each one in their top ${A.topCount}.</p>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 10px;">
        <div style="font-weight:600;font-size:14px;">People (${rows.length})</div>
        <button class="mini-btn" id="church-gifts-export">Export (CSV)</button>
      </div>
      <div style="overflow-x:auto;"><table>
        <thead><tr><th>Person</th><th>Top ${type === 'gifts' ? 'gifts' : 'offices'}</th><th>Taken</th></tr></thead>
        <tbody>${rows.map((r, i) => `
          <tr data-church-gift-row="${i}">
            <td><div class="student-name">${escapeHtmlReport(r.out_full_name || 'Unnamed')}</div><div style="font-size:12px;color:var(--ink-soft);">${escapeHtmlReport(r.out_email || '')}</div></td>
            <td>${(r.out_ranked || []).slice(0, A.topCount).map(k => escapeHtmlReport(churchGiftName(type, k))).join(', ')}</td>
            <td style="font-size:12.5px;color:var(--ink-soft);white-space:nowrap;">${new Date(r.out_created_at).toLocaleDateString()}</td>
          </tr>
          <tr data-church-gift-detail="${i}" style="display:none;cursor:default;"><td colspan="3" style="background:var(--bg-soft);">
            <div style="display:grid;gap:6px;max-width:560px;">${(r.out_ranked || []).map((k, j) => {
              const sc = (r.out_scores || {})[k] || 0;
              return `<div style="display:grid;grid-template-columns:170px 1fr 120px;gap:10px;align-items:center;font-size:13px;">
                <span style="${j < A.topCount ? 'font-weight:700;' : ''}">${escapeHtmlReport(churchGiftName(type, k))}</span>
                <div class="bar-track"><div class="bar-fill" style="width:${Math.round(sc / max * 100)}%;${j < A.topCount ? '' : 'opacity:.35;'}"></div></div>
                <span class="bar-text">${sc}/${max} · ${escapeHtmlReport(FJ.bandFor(type, sc))}</span></div>`;
            }).join('')}</div>
          </td></tr>`).join('')}</tbody>
      </table></div>
    ` : `<p style="color:var(--ink-soft);font-size:13.5px;">No one connected to your church has shared ${type === 'gifts' ? 'Spiritual Gifts' : 'Five-Fold'} results yet. Share the link above to get started.</p>`}
  `;

  panel.querySelectorAll('[data-church-gifts-type]').forEach(btn => {
    btn.addEventListener('click', () => { churchGiftsType = btn.dataset.churchGiftsType; drawChurchGiftsTab(); });
  });
  panel.querySelectorAll('[data-church-gift-row]').forEach(tr => {
    tr.addEventListener('click', () => {
      const d = panel.querySelector(`[data-church-gift-detail="${tr.dataset.churchGiftRow}"]`);
      d.style.display = d.style.display === 'none' ? '' : 'none';
    });
  });
  document.getElementById('church-gifts-copy-link').addEventListener('click', async () => {
    const status = document.getElementById('church-gifts-copy-status');
    try { await navigator.clipboard.writeText(link); status.textContent = 'Copied!'; }
    catch(e){ status.textContent = 'Copy the link above.'; }
  });
  const exp = document.getElementById('church-gifts-export');
  if(exp) exp.addEventListener('click', () => {
    const keys = A.categories.map(c => c.key);
    const cell = v => { const t = String(v == null ? '' : v); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
    const lines = [['Name', 'Email', 'Taken', 'Top', ...keys.map(k => churchGiftName(type, k))].map(cell).join(',')];
    rows.forEach(r => lines.push([r.out_full_name || '', r.out_email || '', new Date(r.out_created_at).toLocaleDateString(),
      (r.out_ranked || []).slice(0, A.topCount).map(k => churchGiftName(type, k)).join('; '),
      ...keys.map(k => (r.out_scores || {})[k] ?? '')].map(cell).join(',')));
    const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${type === 'gifts' ? 'spiritual-gifts' : 'five-fold'}-results-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  });
}

init();
</script>
</body>
</html>

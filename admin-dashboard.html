      <div id="promote-admin-results"></div>
      <span id="promote-status" style="font-size:12.5px;color:var(--ink-soft);"></span>

      <h4 class="field-section-title">Church Contact <span style="font-weight:400;text-transform:none;letter-spacing:normal;color:var(--ink-soft);">(optional — for reference only, doesn't grant any access)</span></h4>
      <p class="field-hint" style="margin-bottom:8px;">Who to reach out to about this church — doesn't have to be the same person as the Church Admin above.</p>
      <label class="field-label">Contact Name</label>
      <input type="text" class="field-input" id="edit-contact-name" value="${(church?.contact_name||'').replace(/"/g,'&quot;')}" placeholder="e.g. Pastor John Smith" />
      <label class="field-label">Contact Email</label>
      <input type="text" class="field-input" id="edit-contact-email" value="${(church?.contact_email||'').replace(/"/g,'&quot;')}" placeholder="pastor@example.com" />

      <label class="field-label">Accent Color</label>
      <div class="color-field-row">
        <input type="color" class="color-swatch" id="edit-church-color-picker" value="${/^#[0-9a-fA-F]{6}$/.test(church?.primary_color||'') ? church.primary_color : '#3E82F7'}" />
        <input type="text" class="field-input" id="edit-church-color" value="${(church?.primary_color||'').replace(/"/g,'&quot;')}" placeholder="#3E82F7" />
      </div>

      <h4 class="field-section-title">Welcome Letter (shown on this church's course page instead of the default one)</h4>
      <label class="field-label">Title</label>
      <input type="text" class="field-input" id="edit-letter-title" value="${(church?.letter_title||'').replace(/"/g,'&quot;')}" placeholder="e.g. Welcome to Acacia Church" />
      <label class="field-label">Subtitle</label>
      <input type="text" class="field-input" id="edit-letter-subtitle" value="${(church?.letter_subtitle||'').replace(/"/g,'&quot;')}" placeholder="A short line under the title" />
      <label class="field-label">Letter Body</label>
      <textarea class="field-input field-textarea" id="edit-letter-body" placeholder="Separate paragraphs with a blank line">${church?.letter_body||''}</textarea>
      <label class="field-label">Welcome Video (YouTube link, optional)</label>
      <input type="text" class="field-input" id="edit-letter-video" value="${(church?.letter_video_youtube_id||'').replace(/"/g,'&quot;')}" placeholder="https://youtube.com/watch?v=..." />
      <p class="field-hint" style="margin-bottom:8px;">If set, this shows instead of the welcome photo below — paste the full YouTube link, any format works.</p>
      <label class="field-label">Welcome Photo</label>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
        <input type="file" accept="image/*" id="edit-letter-image-file" style="font-size:12.5px;flex:1;" />
        <span id="upload-photo-status" style="font-size:12px;color:var(--ink-soft);"></span>
      </div>
      <input type="text" class="field-input" id="edit-letter-image" value="${(church?.letter_image_url||'').replace(/"/g,'&quot;')}" placeholder="https://... (or upload a file above)" />
      <p class="field-hint" style="margin-bottom:8px;">Upload a photo, or paste a link to one already hosted somewhere.</p>
      <label class="field-label">Pastor's Name</label>
      <input type="text" class="field-input" id="edit-letter-author" value="${(church?.letter_author_name||'').replace(/"/g,'&quot;')}" placeholder="e.g. First & Spouse Last" />
      <label class="field-label">Pastor's Title</label>
      <input type="text" class="field-input" id="edit-letter-author-title" value="${(church?.letter_author_title||'').replace(/"/g,'&quot;')}" placeholder="e.g. Church Name | Lead Pastor" />
      <label class="field-label">Church Website</label>
      <input type="text" class="field-input" id="edit-website" value="${(church?.website_url||'').replace(/"/g,'&quot;')}" placeholder="https://..." />

      <button class="mini-btn" id="save-church-settings-btn" style="margin-top:14px;background:var(--ink);color:#fff;border-color:var(--ink);">Save Church Settings</button>
      <span id="save-status" style="font-size:12.5px;color:var(--ink-soft);margin-left:10px;"></span>
    </div>

    <div class="church-tab-panel" data-tab-panel="groups">
      <div id="groups-list">${groups.map(g => `
        <div class="group-row" style="flex-direction:column;align-items:stretch;gap:8px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span>${g.name}${g.leader_name ? ` (label: ${g.leader_name})` : ''}</span>
          </div>
          ${g.leader_id ? `
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;">
              <span>Real leader account: <strong>${leaderNameById[g.leader_id] || 'Unnamed'}</strong></span>
              <button class="mini-btn danger" data-remove-group-leader="${g.id}">Remove</button>
            </div>
          ` : `
            <div style="display:flex;gap:6px;">
              <input type="text" class="field-input" data-assign-leader-input="${g.id}" placeholder="Their email address" style="font-size:12.5px;padding:6px 10px;" />
              <button class="mini-btn" data-assign-group-leader="${g.id}">Assign as Leader</button>
            </div>
          `}
        </div>
      `).join('') || '<p style="color:var(--ink-soft);font-size:13px;margin:0;">No groups yet.</p>'}</div>
      <p class="field-hint" style="margin:10px 0 0;">A Group Leader can see everything about their group's students (progress, discussion answers) and reply to them, but can't unenroll anyone. They need to have signed up already before you can assign them.</p>
      <div class="new-group-form">
        <input type="text" id="new-group-name" placeholder="Group name (e.g. Wednesday Night)" />
        <input type="text" id="new-group-leader" placeholder="Leader's name" />
        <button id="create-group-btn">+ Add Group</button>
      </div>
    </div>` : ''}
  `;

  document.querySelectorAll('.church-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.church-tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.church-tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector(`.church-tab-panel[data-tab-panel="${btn.dataset.tab}"]`).classList.add('active');
    });
  });

  document.getElementById('back-to-churches').addEventListener('click', renderChurchesOverview);

  const exportChurchBtn = document.getElementById('export-church-btn');
  if(exportChurchBtn) exportChurchBtn.addEventListener('click', () => {
    const nameSlug = (church ? church.name : 'no-church').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    exportStudentsCSV(rows, `${nameSlug}-students-${new Date().toISOString().slice(0,10)}.csv`, false);
  });

  const viewReportBtn = document.getElementById('view-report-btn');
  if(viewReportBtn) viewReportBtn.addEventListener('click', () => renderStudentReport(rows, church));


  const colorPicker = document.getElementById('edit-church-color-picker');
  const colorText = document.getElementById('edit-church-color');
  if(colorPicker && colorText){
    colorPicker.addEventListener('input', () => { colorText.value = colorPicker.value; });
    colorText.addEventListener('input', () => {
      if(/^#[0-9a-fA-F]{6}$/.test(colorText.value)) colorPicker.value = colorText.value;
    });
  }

  const photoFileInput = document.getElementById('edit-letter-image-file');
  if(photoFileInput) photoFileInput.addEventListener('change', async () => {
    const file = photoFileInput.files[0];
    if(!file) return;
    const statusEl = document.getElementById('upload-photo-status');
    statusEl.textContent = 'Uploading...';
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${churchId}/${Date.now()}.${ext}`;
    const { error: uploadError } = await supabaseClient.storage.from('church-photos').upload(path, file);
    if(uploadError){
      statusEl.textContent = '';
      alert('Could not upload the photo: ' + uploadError.message);
      return;
    }
    const { data: urlData } = supabaseClient.storage.from('church-photos').getPublicUrl(path);
    document.getElementById('edit-letter-image').value = urlData.publicUrl;
    statusEl.textContent = 'Uploaded ✓';
    setTimeout(() => { statusEl.textContent = ''; }, 2000);
  });

  const saveSettingsBtn = document.getElementById('save-church-settings-btn');
  if(saveSettingsBtn) {
    const statusSelect = document.getElementById('edit-course-status');
    const statusBadge = document.getElementById('course-status-badge');
    const STATUS_STYLES = {
      live: { bg: '#dcf5e3', color: '#166534', label: 'Live' },
      draft: { bg: '#fef3c7', color: '#92400e', label: 'Draft' },
      archived: { bg: '#e5e7eb', color: '#4b5563', label: 'Archived' }
    };
    const updateStatusBadge = () => {
      const s = STATUS_STYLES[statusSelect.value] || STATUS_STYLES.live;
      statusBadge.textContent = s.label;
      statusBadge.style.background = s.bg;
      statusBadge.style.color = s.color;
    };
    if(statusSelect && statusBadge){
      updateStatusBadge();
      statusSelect.addEventListener('change', updateStatusBadge);
    }
  }
  if(saveSettingsBtn) saveSettingsBtn.addEventListener('click', async () => {
    const newSlug = document.getElementById('edit-church-slug').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    const statusEl = document.getElementById('save-status');
    if(!newSlug){ alert('The URL slug cannot be empty.'); return; }
    if(allChurches.some(c => c.id !== churchId && c.slug === newSlug)){
      alert('That slug is already used by another church — please choose a different one.');
      return;
    }

    const videoInput = document.getElementById('edit-letter-video').value.trim();
    const videoId = extractYoutubeId(videoInput);
    if(videoInput && !videoId){
      alert("That doesn't look like a valid YouTube link — please check it and try again.");
      return;
    }

    const updates = {
      name: document.getElementById('edit-church-name').value.trim(),
      slug: newSlug,
      primary_color: document.getElementById('edit-church-color').value.trim() || null,
      course_status: document.getElementById('edit-course-status').value,
      contact_name: document.getElementById('edit-contact-name').value.trim() || null,
      contact_email: document.getElementById('edit-contact-email').value.trim() || null,
      letter_title: document.getElementById('edit-letter-title').value.trim() || null,
      letter_subtitle: document.getElementById('edit-letter-subtitle').value.trim() || null,
      letter_body: document.getElementById('edit-letter-body').value.trim() || null,
      letter_video_youtube_id: videoId || null,
      letter_image_url: document.getElementById('edit-letter-image').value.trim() || null,
      letter_author_name: document.getElementById('edit-letter-author').value.trim() || null,
      letter_author_title: document.getElementById('edit-letter-author-title').value.trim() || null,
      website_url: document.getElementById('edit-website').value.trim() || null
    };

    statusEl.textContent = 'Saving...';
    const { data: updated, error } = await supabaseClient.from('churches').update(updates).eq('id', churchId).select().maybeSingle();
    if(error || !updated){
      statusEl.textContent = '';
      alert('Could not save: ' + (error?.message || 'unknown error'));
      return;
    }

    const idx = allChurches.findIndex(c => c.id === churchId);
    if(idx !== -1) allChurches[idx] = updated;
    statusEl.textContent = 'Saved ✓';
    setTimeout(() => { statusEl.textContent = ''; }, 2000);
  });

  document.querySelectorAll('td.clickable-cell').forEach(td => {
    td.style.cursor = 'pointer';
    td.addEventListener('click', () => {
      const tr = td.closest('tr');
      renderStudentDetail(tr.dataset.studentId, tr.dataset.courseId);
    });
  });

  document.getElementById('student-mode-active-btn')?.addEventListener('click', () => {
    studentViewMode = 'active';
    selectedEnrollmentIds.clear();
    renderChurchStudents(churchId);
  });
  document.getElementById('student-mode-archived-btn')?.addEventListener('click', () => {
    studentViewMode = 'archived';
    selectedEnrollmentIds.clear();
    renderChurchStudents(churchId);
  });

  const onChurchRowActionChange = (id, newStatus) => {
    if(newStatus === 'deleted'){
      allRows = allRows.filter(r => r.enrollment_id !== id);
    } else {
      const row = allRows.find(r => r.enrollment_id === id);
      if(row) row.status = newStatus;
    }
    renderChurchStudents(churchId); // full re-render so Active/Archived counts stay correct
  };
  wireStudentRowActions('#church-students-tbody', '#church-students-select-all', '#church-students-batch-bar', onChurchRowActionChange);
  wireBatchActionBar((ids, newStatus) => {
    if(newStatus === 'deleted'){
      allRows = allRows.filter(r => !ids.includes(r.enrollment_id));
    } else {
      ids.forEach(id => { const row = allRows.find(r => r.enrollment_id === id); if(row) row.status = newStatus; });
    }
    renderChurchStudents(churchId);
  });

  document.querySelectorAll('[data-view-cert]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const { data: cert } = await supabaseClient.from('certificates').select('certificate_code').eq('student_id', btn.dataset.viewCert).eq('course_id', btn.dataset.certCourse).maybeSingle();
      if(cert) window.open(`certificate.html?code=${cert.certificate_code}`, '_blank');
      else alert('No certificate found yet for this student.');
    });
  });

  document.querySelectorAll('.group-select').forEach(sel => {
    sel.addEventListener('click', (e) => e.stopPropagation());
    sel.addEventListener('change', async () => {
      await supabaseClient.from('enrollments').update({ group_id: sel.value || null }).eq('id', sel.dataset.enrollmentId);
      const row = allRows.find(r => r.enrollment_id === sel.dataset.enrollmentId);
      if(row){
        row.group_id = sel.value || null;
        const g = groups.find(g => g.id === sel.value);
        row.group_name = g ? g.name : null;
      }
    });
  });

  document.querySelectorAll('.church-assign-select').forEach(sel => {
    sel.addEventListener('click', (e) => e.stopPropagation());
    sel.addEventListener('change', async () => {
      if(!sel.value) return;
      const newChurchId = sel.value;
      // Update both the enrollment (what the dashboards actually filter
      // by) and the student's own profile (what the course page itself
      // uses to show that church's branding when they're logged in), so
      // the assignment is consistent everywhere.
      await Promise.all([
        supabaseClient.from('enrollments').update({ church_id: newChurchId }).eq('id', sel.dataset.enrollmentId),
        supabaseClient.from('profiles').update({ church_id: newChurchId }).eq('id', sel.dataset.studentId)
      ]);
      const row = allRows.find(r => r.enrollment_id === sel.dataset.enrollmentId);
      if(row){
        row.church_id = newChurchId;
        const ch = allChurches.find(c => c.id === newChurchId);
        row.church_name = ch ? ch.name : null;
      }
      renderChurchStudents(null);
    });
  });

  const createBtn = document.getElementById('create-group-btn');
  if(createBtn) createBtn.addEventListener('click', async () => {
    const name = document.getElementById('new-group-name').value.trim();
    const leader = document.getElementById('new-group-leader').value.trim();
    if(!name) return;
    await supabaseClient.from('course_groups').insert({ church_id: churchId, name, leader_name: leader || null });
    renderChurchStudents(churchId);
  });

  document.querySelectorAll('[data-assign-group-leader]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const groupId = btn.dataset.assignGroupLeader;
      const input = document.querySelector(`[data-assign-leader-input="${groupId}"]`);
      const email = input.value.trim();
      if(!email){ alert('Enter an email first.'); return; }
      const { data: result, error } = await supabaseClient.rpc('assign_group_leader', { target_email: email, target_group_id: groupId });
      if(error || result !== 'success'){
        alert(result === 'not_found' ? 'No account found with that email — they need to sign up first.' : 'Something went wrong. Please try again.');
        return;
      }
      renderChurchStudents(churchId);
    });
  });

  document.querySelectorAll('[data-remove-group-leader]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Remove this person as leader of this group?')) return;
      await supabaseClient.rpc('remove_group_leader', { target_group_id: btn.dataset.removeGroupLeader });
      renderChurchStudents(churchId);
    });
  });

  const copyBtn = document.getElementById('copy-pending-emails-btn');
  if(copyBtn) copyBtn.addEventListener('click', async () => {
    const emailList = pendingStudents.map(p => p.email).join(', ');
    try {
      await navigator.clipboard.writeText(emailList);
      document.getElementById('copy-status').textContent = `Copied ${pendingStudents.length} emails ✓`;
    } catch (e) {
      document.getElementById('copy-status').textContent = 'Could not copy — check clipboard permissions.';
    }
  });

  // The actual promote-plus-notify action, extracted so it can be
  // triggered from the "Make Admin" button inside a selected-student
  // card below, rather than reading a plain typed-in email.
  async function doPromoteToAdmin(targetEmail, targetName){
    const statusEl = document.getElementById('promote-status');
    statusEl.textContent = 'Promoting...';
    const { data: result, error } = await supabaseClient.rpc('promote_to_church_admin', { target_email: targetEmail, target_church_id: churchId });
    if(error || !result || result.status !== 'success'){
      statusEl.textContent = result?.status === 'not_found'
        ? 'No account found with that email — they need to sign up first.'
        : 'Something went wrong. Please try again.';
      return;
    }
    statusEl.textContent = 'Promoted ✓ Sending them an email…';
    // Best-effort: the promotion itself already succeeded above, so a
    // failed notification email shouldn't read as the whole action
    // having failed -- just surface it separately so it's not silently
    // missed.
    try {
      const emailRes = await fetch('/.netlify/functions/send-church-admin-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ adminName: result.full_name || targetName, adminEmail: result.email, churchName: church?.name || 'your church' })
      });
      statusEl.textContent = emailRes.ok ? 'Promoted ✓ Email sent ✓' : 'Promoted ✓ (their notification email failed to send)';
    } catch (e) {
      statusEl.textContent = 'Promoted ✓ (their notification email failed to send)';
    }
    // Brief pause so the status message above is actually readable
    // before the panel re-renders and replaces it.
    setTimeout(() => renderChurchStudents(churchId), 1400);
  }

  const promoteSearchInput = document.getElementById('promote-admin-search');
  const promoteResultsEl = document.getElementById('promote-admin-results');
  if(promoteSearchInput && promoteResultsEl){
    const currentAdminIds = new Set(currentAdmins.map(a => a.id));
    // Active only -- churchRows (not the toggle-filtered rows) so this
    // search always covers active students regardless of whether the
    // Students tab currently has Active or Archived selected.
    const eligibleStudents = churchRows.filter(r => r.status !== 'archived' && !currentAdminIds.has(r.student_id));

    const renderPromoteResults = (query) => {
      if(!query){ promoteResultsEl.innerHTML = ''; return; }
      const q = query.toLowerCase();
      const matches = eligibleStudents.filter(r =>
        (r.full_name || '').toLowerCase().includes(q) || (r.student_email || '').toLowerCase().includes(q)
      ).slice(0, 6);
      if(!matches.length){
        promoteResultsEl.innerHTML = `<p style="color:var(--ink-soft);font-size:12.5px;margin:4px 0;">No matching active students.</p>`;
        return;
      }
      promoteResultsEl.innerHTML = matches.map(r => `
        <div class="group-row clickable-cell" data-pick-admin="${r.student_id}" data-pick-email="${(r.student_email||'').replace(/"/g,'&quot;')}" data-pick-name="${(r.full_name||'').replace(/"/g,'&quot;')}" style="cursor:pointer;">
          <span>${r.full_name || 'Unnamed student'} <span style="color:var(--ink-soft);font-size:12px;">${r.student_email || ''}</span></span>
        </div>`).join('');
      promoteResultsEl.querySelectorAll('[data-pick-admin]').forEach(row => {
        row.addEventListener('click', () => {
          const name = row.dataset.pickName;
          const email = row.dataset.pickEmail;
          promoteSearchInput.style.display = 'none';
          promoteResultsEl.innerHTML = `
            <div class="row" style="border:1.5px solid var(--ink);border-radius:8px;padding:10px 12px;">
              <div class="info">
                <div class="name">${name || 'Unnamed student'}</div>
                <div class="sub">${email}</div>
              </div>
              <div style="display:flex;gap:6px;">
                <button type="button" class="mini-btn" id="promote-selected-change">Change</button>
                <button type="button" class="mini-btn" id="promote-selected-confirm" style="background:var(--ink);color:#fff;border-color:var(--ink);">Make Admin</button>
              </div>
            </div>`;
          document.getElementById('promote-selected-change').addEventListener('click', () => {
            promoteSearchInput.style.display = '';
            promoteSearchInput.value = '';
            promoteResultsEl.innerHTML = '';
            promoteSearchInput.focus();
          });
          document.getElementById('promote-selected-confirm').addEventListener('click', () => doPromoteToAdmin(email, name));
        });
      });
    };

    promoteSearchInput.addEventListener('input', () => renderPromoteResults(promoteSearchInput.value.trim()));
  }

  document.querySelectorAll('[data-remove-admin]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Remove this person as church admin? They\'ll go back to being a regular student.')) return;
      await supabaseClient.from('profiles').update({ role: 'student' }).eq('id', btn.dataset.removeAdmin);
      renderChurchStudents(churchId);
    });
  });
}

// Simplified sibling of renderChurchStudents for a NON_WHITE_LABEL_COURSES
// entry — same enrolled-students-plus-progress idea, but scoped by
// course_id across every church (or no church) instead of scoped to one
// church. No groups/settings/pending tabs here since those are
// church-specific concepts that don't apply to a course-wide view. Church
// is shown as a read-only info column (not an assignment control — group
// assignment happens on the church side, not here).
async function renderCourseStudents(courseId, courseTitle){
  activeCourseId = courseId;
  activeChurchId = null;
  viewingNoChurch = false;
  viewingAllStudents = false;
  selectedEnrollmentIds.clear();
  renderSidebar();

  const courseConfig = NON_WHITE_LABEL_COURSES.find(c => c.id === courseId);

  const courseRows = allRows.filter(r => r.course_id === courseId);
  const rows = courseRows.filter(r => studentViewMode === 'archived' ? r.status === 'archived' : r.status !== 'archived');
  const activeCount = courseRows.filter(r => r.status !== 'archived').length;
  const archivedCount = courseRows.filter(r => r.status === 'archived').length;

  const rowsHtml = rows.map(r => {
    const pct = r.total_items ? Math.round((r.items_completed / r.total_items) * 100) : 0;
    const isComplete = r.total_items > 0 && r.items_completed === r.total_items;
    return `
      <tr data-student-id="${r.student_id}" data-course-id="${r.course_id}" data-enrollment-id="${r.enrollment_id}">
        <td><input type="checkbox" data-row-select="${r.enrollment_id}" ${selectedEnrollmentIds.has(r.enrollment_id)?'checked':''} /></td>
        <td class="clickable-cell" data-open="true">
          <div class="student-name">${r.full_name || 'Unnamed student'}</div>
          <div class="student-email">${r.student_email || ''}</div>
        </td>
        <td>${r.church_name || 'No church'}</td>
        <td class="clickable-cell" data-open="true">
          <div class="bar-wrap"><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-text">${r.items_completed}/${r.total_items}</span></div>
        </td>
        <td>${startedCompletedCellHtml(r)}</td>
        <td>
          <div class="row-actions">
            ${studentActionButtonsHtml(r, isComplete)}
          </div>
        </td>
      </tr>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="back-link" id="back-to-churches">&larr; All Churches</div>
    <h2 style="font-family:'Space Grotesk',sans-serif;margin:0 0 4px;">${courseTitle}</h2>
    <p style="color:var(--ink-soft);font-size:13.5px;margin-top:0;margin-bottom:14px;">${rows.length} student${rows.length===1?'':'s'} across all churches</p>
    <div style="display:flex;gap:6px;margin-bottom:14px;">
      <button class="mini-btn ${studentViewMode==='active'?'active':''}" id="student-mode-active-btn">Active (${activeCount})</button>
      <button class="mini-btn ${studentViewMode==='archived'?'active':''}" id="student-mode-archived-btn">Archived (${archivedCount})</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <button class="mini-btn" id="export-course-btn">Export Students (CSV)</button>
      <button class="mini-btn gold" id="view-report-btn">View Progress Report</button>
    </div>
    ${courseConfig?.url ? `<p class="field-hint" style="margin-bottom:14px;">Link: <a href="${courseConfig.url}" target="_blank" rel="noopener">${courseConfig.url.replace(/^https?:\/\//, '')}</a></p>` : ''}
    ${courseConfig?.requiresPurchase ? `
    <div class="panel" style="margin-bottom:16px;">
      <h3>Grant Access</h3>
      <p class="field-hint" style="margin:0 0 10px;">For comps, reviewers, or anyone who paid outside Shopify -- this grants access the same as a real purchase, matched by email when they sign in.</p>
      <div class="new-group-form">
        <input type="text" id="grant-access-email" placeholder="Their email address" />
        <button id="grant-access-btn">Grant Access</button>
      </div>
      <span id="grant-access-status" style="font-size:12.5px;color:var(--ink-soft);"></span>
    </div>` : ''}

    <div id="course-students-batch-bar">${batchActionBarHtml()}</div>
    <table>
      <thead><tr><th style="width:34px;"><input type="checkbox" id="course-students-select-all" /></th><th>Student</th><th>Church</th><th>Progress</th><th>Dates</th><th>Actions</th></tr></thead>
      <tbody id="course-students-tbody">${rowsHtml || '<tr><td colspan="6" style="color:var(--ink-soft);">' + (studentViewMode==='archived' ? 'No archived students.' : 'No students enrolled yet.') + '</td></tr>'}</tbody>
    </table>
  `;

  document.getElementById('back-to-churches').addEventListener('click', renderChurchesOverview);

  const grantBtn = document.getElementById('grant-access-btn');
  if(grantBtn) grantBtn.addEventListener('click', async () => {
    const email = document.getElementById('grant-access-email').value.trim();
    const statusEl = document.getElementById('grant-access-status');
    if(!email){ statusEl.textContent = 'Enter an email first.'; return; }
    statusEl.textContent = 'Granting...';
    const { error } = await supabaseClient.rpc('grant_course_purchase', { p_course_id: courseId, p_email: email });
    if(error){
      statusEl.textContent = 'Something went wrong. Please try again.';
      return;
    }
    statusEl.textContent = 'Access granted ✓';
    document.getElementById('grant-access-email').value = '';
  });

  document.getElementById('student-mode-active-btn').addEventListener('click', () => {
    studentViewMode = 'active';
    selectedEnrollmentIds.clear();
    renderCourseStudents(courseId, courseTitle);
  });
  document.getElementById('student-mode-archived-btn').addEventListener('click', () => {
    studentViewMode = 'archived';
    selectedEnrollmentIds.clear();
    renderCourseStudents(courseId, courseTitle);
  });

  document.getElementById('export-course-btn').addEventListener('click', () => {
    const nameSlug = courseTitle.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    exportStudentsCSV(rows, `${nameSlug}-students-${new Date().toISOString().slice(0,10)}.csv`, true);
  });

  document.getElementById('view-report-btn').addEventListener('click', () => renderStudentReport(rows, null, courseTitle));

  document.querySelectorAll('#course-students-tbody td.clickable-cell').forEach(td => {
    td.style.cursor = 'pointer';
    td.addEventListener('click', () => {
      const tr = td.closest('tr');
      renderStudentDetail(tr.dataset.studentId, tr.dataset.courseId);
    });
  });

  document.querySelectorAll('#course-students-tbody [data-view-cert]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const { data: cert } = await supabaseClient.from('certificates').select('certificate_code').eq('student_id', btn.dataset.viewCert).eq('course_id', btn.dataset.certCourse).maybeSingle();
      if(cert) window.open(`certificate.html?code=${cert.certificate_code}`, '_blank');
    });
  });

  const onCourseRowActionChange = (id, newStatus) => {
    if(newStatus === 'deleted'){
      allRows = allRows.filter(r => r.enrollment_id !== id);
    } else {
      const row = allRows.find(r => r.enrollment_id === id);
      if(row) row.status = newStatus;
    }
    renderCourseStudents(courseId, courseTitle); // full re-render so Active/Archived counts stay correct
  };
  wireStudentRowActions('#course-students-tbody', '#course-students-select-all', '#course-students-batch-bar', onCourseRowActionChange);
  wireBatchActionBar((ids, newStatus) => {
    if(newStatus === 'deleted'){
      allRows = allRows.filter(r => !ids.includes(r.enrollment_id));
    } else {
      ids.forEach(id => {
        const row = allRows.find(r => r.enrollment_id === id);
        if(row){ row.status = newStatus; row.archived_at = newStatus === 'archived' ? new Date().toISOString() : null; }
      });
    }
    selectedEnrollmentIds.clear();
    renderCourseStudents(courseId, courseTitle);
  });
}

async function fetchGroups(churchId){
  const { data } = await supabaseClient.from('course_groups').select('*').eq('church_id', churchId).order('name');
  return data || [];
}

async function fetchPendingStudents(churchId){
  const { data, error } = await supabaseClient.rpc('get_pending_legacy_students', { target_church_id: churchId });
  if(error) return [];
  return data || [];
}

async function fetchChurchAdmins(churchId){
  const { data } = await supabaseClient.from('profiles').select('id, full_name').eq('church_id', churchId).eq('role', 'church_admin');
  return data || [];
}

/* ---------- Level 3: student detail — Q&A + reply ---------- */
async function renderStudentDetail(studentId, courseId){
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Loading student answers...</div>';

  const row = allRows.find(r => r.student_id === studentId && r.course_id === courseId);

  const { data: sessions } = await supabaseClient
    .from('sessions').select('*, session_items(*)').eq('course_id', courseId).order('sort_order');

  const discussionItems = (sessions||[]).flatMap(s => (s.session_items||[]).filter(i=>i.type==='discussion').map(i=>({...i, sessionTitle: s.title})));
  const itemIds = discussionItems.map(i=>i.id);

  const { data: questions } = itemIds.length
    ? await supabaseClient.from('discussion_questions').select('*').in('item_id', itemIds).order('sort_order')
    : { data: [] };

  const questionIds = (questions||[]).map(q=>q.id);
  const { data: responses } = questionIds.length
    ? await supabaseClient.from('discussion_responses').select('*').eq('student_id', studentId).in('question_id', questionIds)
    : { data: [] };
  const responseByQ = {};
  (responses||[]).forEach(r => { responseByQ[r.question_id] = r; });

  // Group questions by session (in session order) instead of one long
  // flat list — each session becomes its own expand/collapse block, so
  // reviewing one session's answers doesn't mean scrolling past every
  // other session's too.
  const questionsByItem = {};
  (questions||[]).forEach(q => { (questionsByItem[q.item_id] = questionsByItem[q.item_id] || []).push(q); });

  const sessionGroups = (sessions||[])
    .map(s => {
      const items = (s.session_items||[]).filter(i => i.type === 'discussion');
      const sessionQuestions = items.flatMap(i => questionsByItem[i.id] || []);
      return { session: s, questions: sessionQuestions };
    })
    .filter(g => g.questions.length > 0);

  const sessionsHtml = sessionGroups.map((g, idx) => {
    const answeredCount = g.questions.filter(q => responseByQ[q.id]?.response_text).length;
    const qaHtml = g.questions.map(q => {
      const r = responseByQ[q.id];
      return `
        <div class="qa-block">
          <div class="qa-question">${q.question_text}</div>
          <div class="qa-answer ${r?.response_text ? '' : 'empty'}">${r?.response_text || 'No answer yet'}</div>
          ${r?.admin_reply ? `<div class="qa-reply"><div class="label">Reply</div>${r.admin_reply}</div>` : ''}
          ${r ? `
            <textarea class="reply-box" data-response-id="${r.id}" placeholder="Write a reply...">${r.admin_reply || ''}</textarea>
            <button class="reply-btn" data-response-id="${r.id}">Send Reply</button>` : ''}
        </div>`;
    }).join('');
    // First session starts expanded as a preview; the rest start
    // collapsed so a student with many sessions doesn't load into a
    // wall of answers.
    return `
      <details class="session-group" ${idx===0 ? 'open' : ''}>
        <summary>
          <span>${g.session.title}</span>
          <span class="session-progress">${answeredCount}/${g.questions.length} answered <span class="chevron">›</span></span>
        </summary>
        <div class="session-group-body">${qaHtml}</div>
      </details>`;
  }).join('');

  content.innerHTML = `
    <div class="back-link" id="back-to-list">&larr; Back to ${viewingAllStudents ? 'All Students' : (activeCourseId ? (NON_WHITE_LABEL_COURSES.find(c => c.id === activeCourseId)?.title || 'course') : (row?.church_name || 'students'))}</div>
    <h2 style="font-family:'Space Grotesk',sans-serif;margin-bottom:4px;">${row?.full_name || 'Student'}</h2>
    <p style="color:var(--ink-soft);font-size:13.5px;margin-top:0;margin-bottom:16px;">${row?.course_title || ''} · ${row?.student_email || ''}</p>
    ${sessionGroups.length ? `<div style="margin-bottom:14px;"><button class="mini-btn" id="expand-all-btn">Expand All</button> <button class="mini-btn" id="collapse-all-btn">Collapse All</button></div>` : ''}
    ${sessionsHtml || '<p style="color:var(--ink-soft);">No discussion questions found for this course.</p>'}
  `;

  document.getElementById('back-to-list').addEventListener('click', () => {
    if(viewingAllStudents) renderAllStudents();
    else if(activeCourseId){
      const course = NON_WHITE_LABEL_COURSES.find(c => c.id === activeCourseId);
      renderCourseStudents(activeCourseId, course ? course.title : '');
    }
    else renderChurchStudents(activeChurchId);
  });

  document.getElementById('expand-all-btn')?.addEventListener('click', () => {
    content.querySelectorAll('.session-group').forEach(el => { el.open = true; });
  });
  document.getElementById('collapse-all-btn')?.addEventListener('click', () => {
    content.querySelectorAll('.session-group').forEach(el => { el.open = false; });
  });

  content.querySelectorAll('.reply-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const responseId = btn.dataset.responseId;
      const textarea = content.querySelector(`textarea[data-response-id="${responseId}"]`);
      btn.textContent = 'Sending...';
      await supabaseClient.from('discussion_responses').update({
        admin_reply: textarea.value,
        admin_reply_by: currentAdminId,
        admin_reply_at: new Date().toISOString()
      }).eq('id', responseId);
      btn.textContent = 'Sent ✓';
      setTimeout(() => { btn.textContent = 'Send Reply'; }, 1500);
    });
  });
}

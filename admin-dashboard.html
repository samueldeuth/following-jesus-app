<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Following Jesus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#17191D; --ink-soft:#6B7280; --blue:#3E82F7; --red:#C0392B;
    --bg:#FFFFFF; --bg-soft:#F4F4F2; --line:#E4E3DD; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .admin-shell{display:flex;min-height:100vh;position:relative;}

  .sidebar-toggle-btn{
    position:fixed;top:16px;left:16px;z-index:50;
    background:var(--ink);color:#fff;border:none;border-radius:8px;
    width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .admin-shell.sidebar-collapsed .admin-sidebar{
    width:0;padding-left:0;padding-right:0;border-right:none;overflow:hidden;
  }
  .admin-shell.sidebar-collapsed main{padding-left:64px;}

  .admin-sidebar{
    width:270px;flex-shrink:0;border-right:1px solid var(--line);
    padding:24px 18px;overflow-y:auto;height:100vh;position:sticky;top:0;
    display:flex;flex-direction:column;transition:width 0.15s ease,padding 0.15s ease;
    background:var(--bg);
  }
  .logo-badge{
    background:var(--ink);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;
    letter-spacing:0.14em;font-size:12px;padding:10px 14px;text-transform:uppercase;display:inline-block;margin-bottom:16px;
  }
  .account-email{font-size:12px;color:var(--ink-soft);margin-bottom:2px;}
  .signout-link{font-size:12px;color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;font-family:'Inter',sans-serif;}
  #admin-account-info{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line);}

  .sidebar-link{
    display:block;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14.5px;
    color:var(--ink);text-decoration:none;cursor:pointer;padding:9px 10px;border-radius:7px;margin-bottom:4px;
  }
  .sidebar-link:hover, .sidebar-link.active{background:var(--bg-soft);}
  .sidebar-section-title{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin:18px 10px 8px;}
  .sidebar-search{
    width:100%;border:1.5px solid var(--line);border-radius:7px;padding:7px 10px;font-size:12.5px;
    font-family:'Inter',sans-serif;margin-bottom:8px;box-sizing:border-box;
  }
  #sidebar-church-list{overflow-y:auto;flex:1;}
  .sidebar-add-church{border-top:1px solid var(--line);padding-top:14px;margin-top:10px;flex-shrink:0;}
  .sidebar-add-church-btn{
    width:100%;margin-top:8px;background:var(--ink);color:#fff;border:none;border-radius:7px;
    padding:9px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .sidebar-add-church-hint{font-size:10.5px;color:var(--ink-soft);margin:8px 0 0;line-height:1.4;}
  .sidebar-church-item{
    display:flex;justify-content:space-between;align-items:center;gap:6px;
    padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;margin-bottom:2px;
  }
  .sidebar-church-item:hover, .sidebar-church-item.active{background:var(--bg-soft);}
  .sidebar-church-item .count{font-size:11px;color:var(--ink-soft);flex-shrink:0;}
  .sidebar-church-item.active{font-weight:600;}

  @media(max-width:820px){
    main{padding-left:64px !important;padding-top:70px;}
    .admin-sidebar{
      position:fixed;inset:0;z-index:45;width:85%;max-width:320px;
      transform:translateX(-100%);transition:transform 0.2s ease;
    }
    .admin-shell:not(.sidebar-collapsed) .admin-sidebar{transform:translateX(0);}
    .admin-shell.sidebar-collapsed .admin-sidebar{width:85%;max-width:320px;padding:24px 18px;border-right:1px solid var(--line);}
    .sidebar-overlay{
      display:none;position:fixed;inset:0;z-index:40;background:rgba(10,12,16,0.4);
    }
    .admin-shell:not(.sidebar-collapsed) .sidebar-overlay{display:block;}
  }

  main{flex:1;max-width:960px;padding:28px 24px 80px;overflow-y:auto;}

  .summary-row{display:flex;gap:12px;margin-bottom:26px;flex-wrap:wrap;}
  .summary-card{background:var(--bg-soft);border-radius:var(--radius);padding:16px 18px;min-width:150px;flex:1;}
  .summary-card .num{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;}
  .summary-card .label{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

  table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:24px;}
  thead th{
    text-align:left;font-size:11.5px;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-soft);
    padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg-soft);
  }
  tbody td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.clickable{cursor:pointer;}
  tbody tr.clickable:hover{background:var(--bg-soft);}
  .student-name{font-weight:600;}
  .student-email{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .bar-wrap{display:flex;align-items:center;gap:10px;}
  .bar-track{flex:1;height:7px;background:var(--bg-soft);border-radius:4px;overflow:hidden;min-width:70px;}
  .bar-fill{height:100%;background:var(--ink);}
  .bar-text{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .loading{padding:60px 20px;text-align:center;color:var(--ink-soft);font-size:13px;}
  .group-tag{font-size:11.5px;background:var(--bg-soft);border-radius:5px;padding:3px 8px;display:inline-block;}
  .no-group{font-size:12px;color:var(--ink-soft);font-style:italic;}

  .back-link{font-size:13px;color:var(--ink-soft);cursor:pointer;display:inline-block;margin-bottom:14px;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .mini-btn{
    border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:6px 11px;
    font-size:12px;font-weight:600;cursor:pointer;color:var(--ink);white-space:nowrap;
  }
  .mini-btn.danger{border-color:var(--red);color:var(--red);}
  .mini-btn.gold{border-color:#B08D3E;color:#B08D3E;}

  .qa-block{border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;}
  .qa-session{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:6px;}
  .qa-question{text-align:left;font-weight:600;font-size:14.5px;margin-bottom:6px;}
  .qa-answer{text-align:left;font-size:14px;color:var(--ink);margin-bottom:10px;white-space:pre-wrap;}
  .qa-answer.empty{color:var(--ink-soft);font-style:italic;}
  .qa-reply{background:var(--bg-soft);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:8px;}
  .qa-reply .label{font-size:11px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:3px;}
  .reply-box{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px;font-family:'Inter',sans-serif;font-size:13.5px;min-height:60px;}
  .reply-btn{margin-top:8px;background:var(--ink);color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;}

  .panel{border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px;}
  .panel h3{text-align:left;font-family:'Space Grotesk',sans-serif;font-size:15px;margin:0 0 12px;}
  .group-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .group-row:last-child{border-bottom:none;}
  .new-group-form{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .new-group-form input{flex:1;min-width:140px;border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;font-family:'Inter',sans-serif;}
  .new-group-form button{background:var(--ink);color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;}

  select.group-select{border:1.5px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12.5px;font-family:'Inter',sans-serif;}

  .field-label{display:block;text-align:left;font-size:12px;font-weight:600;color:var(--ink-soft);margin:14px 0 5px;}
  .field-input{width:100%;border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13.5px;font-family:'Inter',sans-serif;}
  .field-textarea{min-height:90px;resize:vertical;font-family:'Inter',sans-serif;}
  .field-hint{font-size:11.5px;color:var(--ink-soft);margin:5px 0 0;}
  .field-section-title{text-align:left;font-family:'Space Grotesk',sans-serif;font-size:13.5px;margin:22px 0 2px;padding-top:16px;border-top:1px solid var(--line);}
  .color-field-row{display:flex;gap:8px;align-items:stretch;}
  .color-field-row .field-input{flex:1;}
  .color-swatch{
    width:44px;height:auto;border:1.5px solid var(--line);border-radius:6px;padding:2px;
    cursor:pointer;background:#fff;flex-shrink:0;
  }

  .church-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;}
  .church-tab-btn{
    background:none;border:none;font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;
    color:var(--ink-soft);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .church-tab-btn.active{color:var(--ink);border-bottom-color:var(--ink);}
  .church-tab-panel{display:none;}
  .church-tab-panel.active{display:block;}
</style>
</head>
<body>

<div class="admin-shell" id="admin-shell">
  <button type="button" class="sidebar-toggle-btn" id="sidebar-toggle-btn" aria-label="Toggle menu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="admin-sidebar">
    <div class="logo-badge">Following Jesus</div>
    <div id="admin-account-info"></div>
    <a class="sidebar-link" id="sidebar-overview-link">Overview</a>
    <div class="sidebar-section-title">Churches (<span id="sidebar-church-count">0</span>)</div>
    <input type="text" class="sidebar-search" id="sidebar-church-search" placeholder="Search churches…" />
    <div id="sidebar-church-list"></div>
    <div class="sidebar-add-church">
      <div class="sidebar-section-title" style="margin-top:0;">Add a New Church</div>
      <input type="text" class="sidebar-search" id="new-church-name" placeholder="Church name (e.g. Acacia Church)" />
      <input type="text" class="sidebar-search" id="new-church-slug" placeholder="URL slug (e.g. acaciachurch)" style="margin-top:6px;" />
      <button id="create-church-btn" class="sidebar-add-church-btn">+ Add Church</button>
      <p class="sidebar-add-church-hint">Becomes: /courses/{slug} — auto-filled from the name, editable.</p>
    </div>
  </div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <main><div id="content" class="loading">Loading…</div></main>
</div>

<script>
const SUPABASE_URL = 'https://onflrmiifjjjboeimnva.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uZmxybWlpZmpqamJvZWltbnZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNTQ3NDUsImV4cCI6MjEwMjkzMDc0NX0.CeHfkR5PIH1dLW6JUPAoHSwx_AcQkFg0HtFQXV9jk5A';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentAdminId = null;

// Sidebar starts collapsed on narrow screens (mobile) so the content is
// visible right away, but stays open by default on wider screens
// (desktop) — matching the original behavior there. Works the same way
// via the toggle button either way.
const adminShell = document.getElementById('admin-shell');
if (window.innerWidth <= 820) adminShell.classList.add('sidebar-collapsed');

function toggleSidebar(){ adminShell.classList.toggle('sidebar-collapsed'); }
document.getElementById('sidebar-toggle-btn').addEventListener('click', toggleSidebar);
document.getElementById('sidebar-overlay').addEventListener('click', toggleSidebar);

// Pulls the video ID out of any common YouTube URL shape (watch?v=,
// youtu.be/, embed/, or a bare 11-character ID typed directly).
function extractYoutubeId(input){
  if(!input) return null;
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
    /^([a-zA-Z0-9_-]{11})$/
  ];
  for(const p of patterns){
    const match = input.match(p);
    if(match) return match[1];
  }
  return null;
}
let allRows = [];
let allChurches = [];
let activeChurchId = null; // null = "all churches" overview

function renderAccountInfo(email){
  const el = document.getElementById('admin-account-info');
  if(email){
    el.innerHTML = `
      <div class="account-email">Signed in as ${email}</div>
      <button class="signout-link" id="admin-signout-btn">Sign Out</button>
    `;
    document.getElementById('admin-signout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.reload();
    });
  } else {
    el.innerHTML = '';
  }
}

async function init(){
  const content = document.getElementById('content');
  const { data: { user } } = await supabaseClient.auth.getUser();
  if(!user){
    renderAccountInfo(null);
    content.innerHTML = `
      <div style="max-width:340px;">
        <p style="color:var(--ink-soft);margin-bottom:16px;">Please sign in as an admin to view this dashboard.</p>
        <div id="admin-signin-error"></div>
        <button id="admin-google-btn" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.92c1.7-1.57 2.68-3.88 2.68-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.95H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.05l3.01-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
          Continue with Google
        </button>
        <p style="font-size:12px;color:var(--ink-soft);margin-top:12px;">Works with any email address you already use — not just Gmail.</p>
      </div>
    `;
    document.getElementById('admin-google-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.href, queryParams: { prompt: 'select_account' } }
      });
    });
    return;
  }
  currentAdminId = user.id;
  renderAccountInfo(user.email);

  const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', user.id).maybeSingle();
  if(!profile || profile.role !== 'super_admin'){
    content.textContent = 'This dashboard is only available to Following Jesus admins.';
    return;
  }

  const [{ data: rows, error: rowsErr }, { data: churches }] = await Promise.all([
    supabaseClient.from('all_student_progress').select('*').order('full_name', { ascending: true }),
    supabaseClient.from('churches').select('*').order('name', { ascending: true })
  ]);

  if(rowsErr || !rows){ content.textContent = 'Could not load student data.'; return; }
  allRows = rows;
  allChurches = churches || [];
  renderSidebar();
  document.getElementById('sidebar-overview-link').addEventListener('click', renderChurchesOverview);
  document.getElementById('sidebar-church-search').addEventListener('input', renderSidebar);
  wireAddChurchForm();
  renderChurchesOverview();
}

// Set up once here, rather than inside renderSidebar/renderChurchesOverview
// — those get re-run often (every search keystroke, every navigation),
// and re-wiring this each time would either duplicate event listeners or
// wipe out whatever someone's already mid-typing in these two fields.
function wireAddChurchForm(){
  const nameInput = document.getElementById('new-church-name');
  const slugInput = document.getElementById('new-church-slug');
  let slugManuallyEdited = false;
  slugInput.addEventListener('input', () => { slugManuallyEdited = true; });
  nameInput.addEventListener('input', () => {
    if(slugManuallyEdited) return;
    slugInput.value = nameInput.value.toLowerCase().replace(/[^a-z0-9]/g, '');
  });

  document.getElementById('create-church-btn').addEventListener('click', async () => {
    const name = nameInput.value.trim();
    const slug = slugInput.value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    if(!name || !slug){ alert('Please enter both a name and a slug.'); return; }
    if(allChurches.some(c => c.slug === slug)){ alert('That slug is already in use by another church — please choose a different one.'); return; }

    const { data: newChurch, error } = await supabaseClient.from('churches').insert({ name, slug }).select().maybeSingle();
    if(error || !newChurch){ alert('Could not create the church: ' + (error?.message || 'unknown error')); return; }

    allChurches.push(newChurch);
    nameInput.value = '';
    slugInput.value = '';
    slugManuallyEdited = false;
    renderChurchStudents(newChurch.id);
  });
}

function renderSidebar(){
  const searchInput = document.getElementById('sidebar-church-search');
  const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
  const listEl = document.getElementById('sidebar-church-list');
  document.getElementById('sidebar-church-count').textContent = allChurches.length;

  const filtered = query ? allChurches.filter(c => c.name.toLowerCase().includes(query)) : allChurches;
  listEl.innerHTML = filtered.map(ch => {
    const count = allRows.filter(r => r.church_id === ch.id).length;
    return `<div class="sidebar-church-item ${ch.id === activeChurchId ? 'active' : ''}" data-church-id="${ch.id}"><span>${ch.name}</span><span class="count">${count}</span></div>`;
  }).join('') || '<p style="font-size:12px;color:var(--ink-soft);padding:8px 10px;">No matches.</p>';

  listEl.querySelectorAll('.sidebar-church-item').forEach(el => {
    el.addEventListener('click', () => renderChurchStudents(el.dataset.churchId));
  });

  document.getElementById('sidebar-overview-link').classList.toggle('active', activeChurchId === null);
}

/* ---------- Level 1: all churches ---------- */
function renderChurchesOverview(){
  activeChurchId = null;
  renderSidebar();
  const totalChurches = allChurches.length;
  const totalStudents = allRows.length;
  const totalCompleted = allRows.filter(r => r.total_items > 0 && r.items_completed === r.total_items).length;

  const churchRowsHtml = allChurches.map(ch => {
    const churchRows = allRows.filter(r => r.church_id === ch.id);
    const pct = churchRows.length
      ? Math.round(churchRows.reduce((sum,r) => sum + (r.total_items ? r.items_completed/r.total_items : 0), 0) / churchRows.length * 100)
      : 0;
    return `
      <tr class="clickable" data-church-id="${ch.id}">
        <td class="student-name">${ch.name}</td>
        <td>${churchRows.length}</td>
        <td>
          <div class="bar-wrap"><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-text">${pct}%</span></div>
        </td>
      </tr>`;
  }).join('');

  const noChurchRows = allRows.filter(r => !r.church_id);

  document.getElementById('content').innerHTML = `
    <div class="summary-row">
      <div class="summary-card"><div class="num">${totalChurches}</div><div class="label">Churches</div></div>
      <div class="summary-card"><div class="num">${totalStudents}</div><div class="label">Total students</div></div>
      <div class="summary-card"><div class="num">${totalCompleted}</div><div class="label">Finished a course</div></div>
    </div>
    <table>
      <thead><tr><th>Church</th><th>Students</th><th>Avg. Progress</th></tr></thead>
      <tbody>${churchRowsHtml || '<tr><td colspan="3" style="color:var(--ink-soft);">No churches yet.</td></tr>'}</tbody>
    </table>
    ${noChurchRows.length ? `<button class="mini-btn" id="view-no-church" style="margin-bottom:20px;">View ${noChurchRows.length} student${noChurchRows.length===1?'':'s'} with no church assigned →</button>` : ''}
  `;

  document.querySelectorAll('tbody tr.clickable').forEach(tr => {
    tr.addEventListener('click', () => renderChurchStudents(tr.dataset.churchId));
  });
  const noChurchBtn = document.getElementById('view-no-church');
  if(noChurchBtn) noChurchBtn.addEventListener('click', () => renderChurchStudents(null));
}

/* ---------- Level 2: students within a church ---------- */
async function renderChurchStudents(churchId){
  activeChurchId = churchId;
  renderSidebar();
  const church = allChurches.find(c => c.id === churchId);
  const rows = allRows.filter(r => churchId ? r.church_id === churchId : !r.church_id);
  const groups = churchId ? await fetchGroups(churchId) : [];
  const currentAdmins = churchId ? await fetchChurchAdmins(churchId) : [];
  const pendingStudents = churchId ? await fetchPendingStudents(churchId) : [];

  const leaderIds = groups.map(g => g.leader_id).filter(Boolean);
  let leaderNameById = {};
  if(leaderIds.length){
    const { data: leaderProfiles } = await supabaseClient.from('profiles').select('id, full_name').in('id', leaderIds);
    (leaderProfiles || []).forEach(p => { leaderNameById[p.id] = p.full_name || 'Unnamed'; });
  }

  const rowsHtml = rows.map(r => {
    const pct = r.total_items ? Math.round((r.items_completed / r.total_items) * 100) : 0;
    const isComplete = r.total_items > 0 && r.items_completed === r.total_items;
    const groupOptions = groups.map(g => `<option value="${g.id}" ${r.group_id===g.id?'selected':''}>${g.name}</option>`).join('');
    const churchOptions = allChurches.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    const assignmentCell = churchId
      ? (groups.length ? `<select class="group-select" data-enrollment-id="${r.enrollment_id}"><option value="">No group</option>${groupOptions}</select>` : `<span class="no-group">${r.group_name || '—'}</span>`)
      : `<select class="church-assign-select" data-enrollment-id="${r.enrollment_id}" data-student-id="${r.student_id}"><option value="">Assign a church…</option>${churchOptions}</select>`;
    return `
      <tr data-student-id="${r.student_id}" data-course-id="${r.course_id}" data-enrollment-id="${r.enrollment_id}">
        <td class="clickable-cell" data-open="true">
          <div class="student-name">${r.full_name || 'Unnamed student'}</div>
          <div class="student-email">${r.student_email || ''}</div>
        </td>
        <td class="clickable-cell" data-open="true">
          <div class="bar-wrap"><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-text">${r.items_completed}/${r.total_items}</span></div>
        </td>
        <td>
          ${assignmentCell}
        </td>
        <td>
          <div class="row-actions">
            ${isComplete ? `<button class="mini-btn gold" data-view-cert="${r.student_id}" data-cert-course="${r.course_id}">🏅 Certificate</button>` : ''}
            <button class="mini-btn danger" data-unenroll="${r.enrollment_id}" data-name="${(r.full_name||'this student').replace(/"/g,'')}">Unenroll</button>
          </div>
        </td>
      </tr>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="back-link" id="back-to-churches">&larr; All Churches</div>
    <h2 style="font-family:'Space Grotesk',sans-serif;margin:0 0 4px;">${church ? church.name : 'No Church Assigned'}</h2>
    <p style="color:var(--ink-soft);font-size:13.5px;margin-top:0;margin-bottom:22px;">${rows.length} student${rows.length===1?'':'s'}</p>

    ${churchId ? `
    <div class="church-tabs">
      <button class="church-tab-btn active" data-tab="students">Students</button>
      ${pendingStudents.length ? `<button class="church-tab-btn" data-tab="pending">Not Yet Signed Up (${pendingStudents.length})</button>` : ''}
      <button class="church-tab-btn" data-tab="settings">Settings</button>
      <button class="church-tab-btn" data-tab="groups">Groups</button>
    </div>` : ''}

    <div class="church-tab-panel active" data-tab-panel="students">
      <table>
        <thead><tr><th>Student</th><th>Progress</th><th>Group</th><th>Actions</th></tr></thead>
        <tbody>${rowsHtml || '<tr><td colspan="4" style="color:var(--ink-soft);">No students here yet.</td></tr>'}</tbody>
      </table>
    </div>

    ${churchId && pendingStudents.length ? `
    <div class="church-tab-panel" data-tab-panel="pending">
      <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;">People who took this church's course on the old platform but haven't created an account here yet. Once they sign up with the same email, they'll move into the Students tab automatically.</p>
      <div id="pending-list" style="max-height:320px;overflow-y:auto;">
        ${pendingStudents.map(p => `<div class="group-row"><span>${(p.first_name||'')} ${(p.last_name||'')}</span><span style="color:var(--ink-soft);font-size:12px;">${p.email}</span></div>`).join('')}
      </div>
      <button class="mini-btn" id="copy-pending-emails-btn" style="margin-top:12px;">Copy All Emails</button>
      <span id="copy-status" style="font-size:12.5px;color:var(--ink-soft);margin-left:8px;"></span>
    </div>` : ''}

    ${churchId ? `
    <div class="church-tab-panel" data-tab-panel="settings">
      <label class="field-label">Church Name</label>
      <input type="text" class="field-input" id="edit-church-name" value="${(church?.name||'').replace(/"/g,'&quot;')}" />

      <label class="field-label">Custom URL</label>
      <input type="text" class="field-input" id="edit-church-slug" value="${(church?.slug||'').replace(/"/g,'&quot;')}" />
      <p class="field-hint">Link: <a href="https://followingjesusapp.netlify.app/courses/${church?.slug || ''}" target="_blank" rel="noopener" id="church-link-preview">followingjesusapp.netlify.app/courses/${church?.slug || '...'}</a></p>

      <h4 class="field-section-title">Church Admin</h4>
      <div id="current-admins-list">
        ${currentAdmins.length ? currentAdmins.map(a => `
          <div class="group-row">
            <span>${a.full_name || 'Unnamed'}</span>
            <button class="mini-btn danger" data-remove-admin="${a.id}">Remove Admin</button>
          </div>`).join('') : '<p style="color:var(--ink-soft);font-size:13px;margin:0 0 12px;">No church admin assigned yet.</p>'}
      </div>
      <label class="field-label">Promote a Student to Admin</label>
      <p class="field-hint" style="margin-bottom:8px;">They must already have an account (signed up at least once) before you can promote them.</p>
      <div class="new-group-form">
        <input type="text" id="promote-admin-email" placeholder="Their email address" />
        <button id="promote-admin-btn">Make Admin</button>
      </div>
      <span id="promote-status" style="font-size:12.5px;color:var(--ink-soft);"></span>

      <label class="field-label">Accent Color</label>
      <div class="color-field-row">
        <input type="color" class="color-swatch" id="edit-church-color-picker" value="${/^#[0-9a-fA-F]{6}$/.test(church?.primary_color||'') ? church.primary_color : '#3E82F7'}" />
        <input type="text" class="field-input" id="edit-church-color" value="${(church?.primary_color||'').replace(/"/g,'&quot;')}" placeholder="#3E82F7" />
      </div>

      <h4 class="field-section-title">Welcome Letter (shown on this church's course page instead of the default one)</h4>
      <label class="field-label">Title</label>
      <input type="text" class="field-input" id="edit-letter-title" value="${(church?.letter_title||'').replace(/"/g,'&quot;')}" placeholder="e.g. Welcome to Acacia Church" />
      <label class="field-label">Subtitle</label>
      <input type="text" class="field-input" id="edit-letter-subtitle" value="${(church?.letter_subtitle||'').replace(/"/g,'&quot;')}" placeholder="A short line under the title" />
      <label class="field-label">Letter Body</label>
      <textarea class="field-input field-textarea" id="edit-letter-body" placeholder="Separate paragraphs with a blank line">${church?.letter_body||''}</textarea>
      <label class="field-label">Welcome Video (YouTube link, optional)</label>
      <input type="text" class="field-input" id="edit-letter-video" value="${(church?.letter_video_youtube_id||'').replace(/"/g,'&quot;')}" placeholder="https://youtube.com/watch?v=..." />
      <p class="field-hint" style="margin-bottom:8px;">If set, this shows instead of the welcome photo below — paste the full YouTube link, any format works.</p>
      <label class="field-label">Welcome Photo</label>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
        <input type="file" accept="image/*" id="edit-letter-image-file" style="font-size:12.5px;flex:1;" />
        <span id="upload-photo-status" style="font-size:12px;color:var(--ink-soft);"></span>
      </div>
      <input type="text" class="field-input" id="edit-letter-image" value="${(church?.letter_image_url||'').replace(/"/g,'&quot;')}" placeholder="https://... (or upload a file above)" />
      <p class="field-hint" style="margin-bottom:8px;">Upload a photo, or paste a link to one already hosted somewhere.</p>
      <label class="field-label">Pastor's Name</label>
      <input type="text" class="field-input" id="edit-letter-author" value="${(church?.letter_author_name||'').replace(/"/g,'&quot;')}" placeholder="e.g. First & Spouse Last" />
      <label class="field-label">Pastor's Title</label>
      <input type="text" class="field-input" id="edit-letter-author-title" value="${(church?.letter_author_title||'').replace(/"/g,'&quot;')}" placeholder="e.g. Church Name | Lead Pastor" />
      <label class="field-label">Church Website</label>
      <input type="text" class="field-input" id="edit-website" value="${(church?.website_url||'').replace(/"/g,'&quot;')}" placeholder="https://..." />

      <button class="mini-btn" id="save-church-settings-btn" style="margin-top:14px;background:var(--ink);color:#fff;border-color:var(--ink);">Save Church Settings</button>
      <span id="save-status" style="font-size:12.5px;color:var(--ink-soft);margin-left:10px;"></span>
    </div>

    <div class="church-tab-panel" data-tab-panel="groups">
      <div id="groups-list">${groups.map(g => `
        <div class="group-row" style="flex-direction:column;align-items:stretch;gap:8px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span>${g.name}${g.leader_name ? ` (label: ${g.leader_name})` : ''}</span>
          </div>
          ${g.leader_id ? `
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;">
              <span>Real leader account: <strong>${leaderNameById[g.leader_id] || 'Unnamed'}</strong></span>
              <button class="mini-btn danger" data-remove-group-leader="${g.id}">Remove</button>
            </div>
          ` : `
            <div style="display:flex;gap:6px;">
              <input type="text" class="field-input" data-assign-leader-input="${g.id}" placeholder="Their email address" style="font-size:12.5px;padding:6px 10px;" />
              <button class="mini-btn" data-assign-group-leader="${g.id}">Assign as Leader</button>
            </div>
          `}
        </div>
      `).join('') || '<p style="color:var(--ink-soft);font-size:13px;margin:0;">No groups yet.</p>'}</div>
      <p class="field-hint" style="margin:10px 0 0;">A Group Leader can see everything about their group's students (progress, discussion answers) and reply to them, but can't unenroll anyone. They need to have signed up already before you can assign them.</p>
      <div class="new-group-form">
        <input type="text" id="new-group-name" placeholder="Group name (e.g. Wednesday Night)" />
        <input type="text" id="new-group-leader" placeholder="Leader's name" />
        <button id="create-group-btn">+ Add Group</button>
      </div>
    </div>` : ''}
  `;

  document.querySelectorAll('.church-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.church-tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.church-tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector(`.church-tab-panel[data-tab-panel="${btn.dataset.tab}"]`).classList.add('active');
    });
  });

  document.getElementById('back-to-churches').addEventListener('click', renderChurchesOverview);

  const colorPicker = document.getElementById('edit-church-color-picker');
  const colorText = document.getElementById('edit-church-color');
  if(colorPicker && colorText){
    colorPicker.addEventListener('input', () => { colorText.value = colorPicker.value; });
    colorText.addEventListener('input', () => {
      if(/^#[0-9a-fA-F]{6}$/.test(colorText.value)) colorPicker.value = colorText.value;
    });
  }

  const photoFileInput = document.getElementById('edit-letter-image-file');
  if(photoFileInput) photoFileInput.addEventListener('change', async () => {
    const file = photoFileInput.files[0];
    if(!file) return;
    const statusEl = document.getElementById('upload-photo-status');
    statusEl.textContent = 'Uploading...';
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${churchId}/${Date.now()}.${ext}`;
    const { error: uploadError } = await supabaseClient.storage.from('church-photos').upload(path, file);
    if(uploadError){
      statusEl.textContent = '';
      alert('Could not upload the photo: ' + uploadError.message);
      return;
    }
    const { data: urlData } = supabaseClient.storage.from('church-photos').getPublicUrl(path);
    document.getElementById('edit-letter-image').value = urlData.publicUrl;
    statusEl.textContent = 'Uploaded ✓';
    setTimeout(() => { statusEl.textContent = ''; }, 2000);
  });

  const saveSettingsBtn = document.getElementById('save-church-settings-btn');
  if(saveSettingsBtn) saveSettingsBtn.addEventListener('click', async () => {
    const newSlug = document.getElementById('edit-church-slug').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    const statusEl = document.getElementById('save-status');
    if(!newSlug){ alert('The URL slug cannot be empty.'); return; }
    if(allChurches.some(c => c.id !== churchId && c.slug === newSlug)){
      alert('That slug is already used by another church — please choose a different one.');
      return;
    }

    const videoInput = document.getElementById('edit-letter-video').value.trim();
    const videoId = extractYoutubeId(videoInput);
    if(videoInput && !videoId){
      alert("That doesn't look like a valid YouTube link — please check it and try again.");
      return;
    }

    const updates = {
      name: document.getElementById('edit-church-name').value.trim(),
      slug: newSlug,
      primary_color: document.getElementById('edit-church-color').value.trim() || null,
      letter_title: document.getElementById('edit-letter-title').value.trim() || null,
      letter_subtitle: document.getElementById('edit-letter-subtitle').value.trim() || null,
      letter_body: document.getElementById('edit-letter-body').value.trim() || null,
      letter_video_youtube_id: videoId || null,
      letter_image_url: document.getElementById('edit-letter-image').value.trim() || null,
      letter_author_name: document.getElementById('edit-letter-author').value.trim() || null,
      letter_author_title: document.getElementById('edit-letter-author-title').value.trim() || null,
      website_url: document.getElementById('edit-website').value.trim() || null
    };

    statusEl.textContent = 'Saving...';
    const { data: updated, error } = await supabaseClient.from('churches').update(updates).eq('id', churchId).select().maybeSingle();
    if(error || !updated){
      statusEl.textContent = '';
      alert('Could not save: ' + (error?.message || 'unknown error'));
      return;
    }

    const idx = allChurches.findIndex(c => c.id === churchId);
    if(idx !== -1) allChurches[idx] = updated;
    statusEl.textContent = 'Saved ✓';
    setTimeout(() => { statusEl.textContent = ''; }, 2000);
  });

  document.querySelectorAll('td.clickable-cell').forEach(td => {
    td.style.cursor = 'pointer';
    td.addEventListener('click', () => {
      const tr = td.closest('tr');
      renderStudentDetail(tr.dataset.studentId, tr.dataset.courseId);
    });
  });

  document.querySelectorAll('[data-unenroll]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(!confirm(`Unenroll ${btn.dataset.name} from this course? Their progress and answers will be permanently deleted.`)) return;
      await supabaseClient.from('enrollments').delete().eq('id', btn.dataset.unenroll);
      allRows = allRows.filter(r => r.enrollment_id !== btn.dataset.unenroll);
      renderChurchStudents(churchId);
    });
  });

  document.querySelectorAll('[data-view-cert]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const { data: cert } = await supabaseClient.from('certificates').select('certificate_code').eq('student_id', btn.dataset.viewCert).eq('course_id', btn.dataset.certCourse).maybeSingle();
      if(cert) window.open(`certificate.html?code=${cert.certificate_code}`, '_blank');
      else alert('No certificate found yet for this student.');
    });
  });

  document.querySelectorAll('.group-select').forEach(sel => {
    sel.addEventListener('click', (e) => e.stopPropagation());
    sel.addEventListener('change', async () => {
      await supabaseClient.from('enrollments').update({ group_id: sel.value || null }).eq('id', sel.dataset.enrollmentId);
      const row = allRows.find(r => r.enrollment_id === sel.dataset.enrollmentId);
      if(row){
        row.group_id = sel.value || null;
        const g = groups.find(g => g.id === sel.value);
        row.group_name = g ? g.name : null;
      }
    });
  });

  document.querySelectorAll('.church-assign-select').forEach(sel => {
    sel.addEventListener('click', (e) => e.stopPropagation());
    sel.addEventListener('change', async () => {
      if(!sel.value) return;
      const newChurchId = sel.value;
      // Update both the enrollment (what the dashboards actually filter
      // by) and the student's own profile (what the course page itself
      // uses to show that church's branding when they're logged in), so
      // the assignment is consistent everywhere.
      await Promise.all([
        supabaseClient.from('enrollments').update({ church_id: newChurchId }).eq('id', sel.dataset.enrollmentId),
        supabaseClient.from('profiles').update({ church_id: newChurchId }).eq('id', sel.dataset.studentId)
      ]);
      const row = allRows.find(r => r.enrollment_id === sel.dataset.enrollmentId);
      if(row){
        row.church_id = newChurchId;
        const ch = allChurches.find(c => c.id === newChurchId);
        row.church_name = ch ? ch.name : null;
      }
      renderChurchStudents(null);
    });
  });

  const createBtn = document.getElementById('create-group-btn');
  if(createBtn) createBtn.addEventListener('click', async () => {
    const name = document.getElementById('new-group-name').value.trim();
    const leader = document.getElementById('new-group-leader').value.trim();
    if(!name) return;
    await supabaseClient.from('course_groups').insert({ church_id: churchId, name, leader_name: leader || null });
    renderChurchStudents(churchId);
  });

  document.querySelectorAll('[data-assign-group-leader]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const groupId = btn.dataset.assignGroupLeader;
      const input = document.querySelector(`[data-assign-leader-input="${groupId}"]`);
      const email = input.value.trim();
      if(!email){ alert('Enter an email first.'); return; }
      const { data: result, error } = await supabaseClient.rpc('assign_group_leader', { target_email: email, target_group_id: groupId });
      if(error || result !== 'success'){
        alert(result === 'not_found' ? 'No account found with that email — they need to sign up first.' : 'Something went wrong. Please try again.');
        return;
      }
      renderChurchStudents(churchId);
    });
  });

  document.querySelectorAll('[data-remove-group-leader]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Remove this person as leader of this group?')) return;
      await supabaseClient.rpc('remove_group_leader', { target_group_id: btn.dataset.removeGroupLeader });
      renderChurchStudents(churchId);
    });
  });

  const copyBtn = document.getElementById('copy-pending-emails-btn');
  if(copyBtn) copyBtn.addEventListener('click', async () => {
    const emailList = pendingStudents.map(p => p.email).join(', ');
    try {
      await navigator.clipboard.writeText(emailList);
      document.getElementById('copy-status').textContent = `Copied ${pendingStudents.length} emails ✓`;
    } catch (e) {
      document.getElementById('copy-status').textContent = 'Could not copy — check clipboard permissions.';
    }
  });

  const promoteBtn = document.getElementById('promote-admin-btn');
  if(promoteBtn) promoteBtn.addEventListener('click', async () => {
    const email = document.getElementById('promote-admin-email').value.trim();
    const statusEl = document.getElementById('promote-status');
    if(!email){ statusEl.textContent = 'Enter an email first.'; return; }
    statusEl.textContent = 'Promoting...';
    const { data: result, error } = await supabaseClient.rpc('promote_to_church_admin', { target_email: email, target_church_id: churchId });
    if(error || result !== 'success'){
      statusEl.textContent = result === 'not_found'
        ? 'No account found with that email — they need to sign up first.'
        : 'Something went wrong. Please try again.';
      return;
    }
    statusEl.textContent = 'Promoted ✓';
    renderChurchStudents(churchId);
  });

  document.querySelectorAll('[data-remove-admin]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Remove this person as church admin? They\'ll go back to being a regular student.')) return;
      await supabaseClient.from('profiles').update({ role: 'student' }).eq('id', btn.dataset.removeAdmin);
      renderChurchStudents(churchId);
    });
  });
}

async function fetchGroups(churchId){
  const { data } = await supabaseClient.from('course_groups').select('*').eq('church_id', churchId).order('name');
  return data || [];
}

async function fetchPendingStudents(churchId){
  const { data, error } = await supabaseClient.rpc('get_pending_legacy_students', { target_church_id: churchId });
  if(error) return [];
  return data || [];
}

async function fetchChurchAdmins(churchId){
  const { data } = await supabaseClient.from('profiles').select('id, full_name').eq('church_id', churchId).eq('role', 'church_admin');
  return data || [];
}

/* ---------- Level 3: student detail — Q&A + reply ---------- */
async function renderStudentDetail(studentId, courseId){
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Loading student answers...</div>';

  const row = allRows.find(r => r.student_id === studentId && r.course_id === courseId);

  const { data: sessions } = await supabaseClient
    .from('sessions').select('*, session_items(*)').eq('course_id', courseId).order('sort_order');

  const discussionItems = (sessions||[]).flatMap(s => (s.session_items||[]).filter(i=>i.type==='discussion').map(i=>({...i, sessionTitle: s.title})));
  const itemIds = discussionItems.map(i=>i.id);

  const { data: questions } = itemIds.length
    ? await supabaseClient.from('discussion_questions').select('*').in('item_id', itemIds).order('sort_order')
    : { data: [] };

  const questionIds = (questions||[]).map(q=>q.id);
  const { data: responses } = questionIds.length
    ? await supabaseClient.from('discussion_responses').select('*').eq('student_id', studentId).in('question_id', questionIds)
    : { data: [] };
  const responseByQ = {};
  (responses||[]).forEach(r => { responseByQ[r.question_id] = r; });

  const blocksHtml = discussionItems.map(item => {
    const itemQuestions = (questions||[]).filter(q=>q.item_id===item.id);
    return itemQuestions.map(q => {
      const r = responseByQ[q.id];
      return `
        <div class="qa-block">
          <div class="qa-session">${item.sessionTitle}</div>
          <div class="qa-question">${q.question_text}</div>
          <div class="qa-answer ${r?.response_text ? '' : 'empty'}">${r?.response_text || 'No answer yet'}</div>
          ${r?.admin_reply ? `<div class="qa-reply"><div class="label">Reply</div>${r.admin_reply}</div>` : ''}
          ${r ? `
            <textarea class="reply-box" data-response-id="${r.id}" placeholder="Write a reply...">${r.admin_reply || ''}</textarea>
            <button class="reply-btn" data-response-id="${r.id}">Send Reply</button>` : ''}
        </div>`;
    }).join('');
  }).join('');

  content.innerHTML = `
    <div class="back-link" id="back-to-list">&larr; Back to ${row?.church_name || 'students'}</div>
    <h2 style="font-family:'Space Grotesk',sans-serif;margin-bottom:4px;">${row?.full_name || 'Student'}</h2>
    <p style="color:var(--ink-soft);font-size:13.5px;margin-top:0;margin-bottom:24px;">${row?.course_title || ''} · ${row?.student_email || ''}</p>
    ${blocksHtml || '<p style="color:var(--ink-soft);">No discussion questions found for this course.</p>'}
  `;

  document.getElementById('back-to-list').addEventListener('click', () => renderChurchStudents(activeChurchId));

  content.querySelectorAll('.reply-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const responseId = btn.dataset.responseId;
      const textarea = content.querySelector(`textarea[data-response-id="${responseId}"]`);
      btn.textContent = 'Sending...';
      await supabaseClient.from('discussion_responses').update({
        admin_reply: textarea.value,
        admin_reply_by: currentAdminId,
        admin_reply_at: new Date().toISOString()
      }).eq('id', responseId);
      btn.textContent = 'Sent ✓';
      setTimeout(() => { btn.textContent = 'Send Reply'; }, 1500);
    });
  });
}

init();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Complete Your Church Setup — Following Jesus</title>
<style>
  :root {
    --ink: #0a0a0a;
    --ink-soft: #6b6b6b;
    --paper: #fdfcfa;
    --accent: #5b21b6;
    --accent-soft: #f5f3ff;
    --border: #e5e1da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 28px;
    line-height: 1.25;
    margin: 0 0 12px;
  }
  .intro {
    color: var(--ink-soft);
    font-size: 15px;
    margin-bottom: 32px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
  }
  .field-group { margin-bottom: 20px; }
  .field-group:last-child { margin-bottom: 0; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .optional {
    font-weight: 400;
    color: var(--ink-soft);
    font-size: 12px;
  }
  input[type="text"], input[type="email"], input[type="url"], textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 110px; }
  .section-title {
    font-size: 15px;
    font-weight: 700;
    margin: 32px 0 4px;
  }
  .section-hint {
    color: var(--ink-soft);
    font-size: 13px;
    margin: 0 0 16px;
  }
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 28px 0;
  }
  button[type="submit"] {
    width: 100%;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  button[type="submit"]:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .status-msg {
    text-align: center;
    font-size: 14px;
    margin-top: 14px;
    min-height: 20px;
  }
  .status-msg.error { color: #b91c1c; }
  .status-msg.success { color: #15803d; }
  .success-screen {
    text-align: center;
    padding: 40px 20px;
  }
  .success-screen h2 {
    font-family: Georgia, serif;
    font-size: 22px;
    margin-bottom: 10px;
  }
  .loading-screen, .error-screen {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .already-note {
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13.5px;
    color: var(--accent);
    margin-bottom: 24px;
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading-screen" id="loading-screen">Loading your church's setup form…</div>
</div>

<script>
const SUPABASE_URL = 'https://onflrmiifjjjboeimnva.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uZmxybWlpZmpqamJvZWltbnZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNTQ3NDUsImV4cCI6MjEwMjkzMDc0NX0.CeHfkR5PIH1dLW6JUPAoHSwx_AcQkFg0HtFQXV9jk5A';

const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const app = document.getElementById('app');

function escapeAttr(s) {
  return String(s || '').replace(/"/g, '&quot;');
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

async function rpc(fnName, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fnName}`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`Request failed (${res.status})`);
  return res.json();
}

function renderError(message) {
  app.innerHTML = `
    <div class="error-screen">
      <h1 style="font-size:20px;">Something's not right</h1>
      <p>${escapeHtml(message)}</p>
      <p style="font-size:13px;">If you believe this is a mistake, reply to your confirmation email and we'll help sort it out.</p>
    </div>`;
}

function renderForm(church) {
  const alreadyCompleted = !!church.signup_completed_at;
  app.innerHTML = `
    <div class="eyebrow">Following Jesus</div>
    <h1>Let's set up your church's page</h1>
    <p class="intro">Thanks for getting your church started with the Following Jesus course! Fill in the details below so we can get your custom page ready for review.</p>
    ${alreadyCompleted ? `<div class="already-note">You've already submitted this form once — you can update anything below and resubmit.</div>` : ''}

    <div class="card">
      <form id="signup-form">

        <div class="field-group">
          <label for="church-name">Church Name</label>
          <input type="text" id="church-name" value="${escapeAttr(church.name)}" required />
        </div>

        <div class="field-group">
          <label for="church-website">Church Website <span class="optional">(optional)</span></label>
          <input type="url" id="church-website" value="${escapeAttr(church.website_url)}" placeholder="https://" />
        </div>

        <hr class="divider" />

        <div class="field-group">
          <label for="pastor-name">Pastor's Name <span class="optional">(optional)</span></label>
          <input type="text" id="pastor-name" value="${escapeAttr(church.letter_author_name)}" />
        </div>

        <div class="field-group">
          <label for="pastor-title">Pastor's Title <span class="optional">(optional)</span></label>
          <input type="text" id="pastor-title" value="${escapeAttr(church.letter_author_title)}" placeholder="e.g. Lead Pastor" />
        </div>

        <hr class="divider" />

        <div class="field-group">
          <label for="contact-name">Point of Contact Name</label>
          <input type="text" id="contact-name" value="${escapeAttr(church.contact_name)}" required />
        </div>

        <div class="field-group">
          <label for="contact-email">Point of Contact Email</label>
          <input type="email" id="contact-email" value="${escapeAttr(church.contact_email)}" required />
        </div>

        <div class="section-title">Welcome Message <span class="optional">(optional)</span></div>
        <p class="section-hint">This is what your students see first. Leave any of this blank and we'll use a warm default welcome for you — you can always add your own later.</p>

        <div class="field-group">
          <label for="letter-title">Welcome Title</label>
          <input type="text" id="letter-title" value="${escapeAttr(church.letter_title)}" />
        </div>

        <div class="field-group">
          <label for="letter-subtitle">Welcome Subtitle</label>
          <input type="text" id="letter-subtitle" value="${escapeAttr(church.letter_subtitle)}" />
        </div>

        <div class="field-group">
          <label for="letter-body">Welcome Message</label>
          <textarea id="letter-body">${escapeHtml(church.letter_body)}</textarea>
        </div>

        <button type="submit" id="submit-btn">Submit for Review</button>
        <div class="status-msg" id="status-msg"></div>
      </form>
    </div>
  `;

  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-msg');
    btn.disabled = true;
    statusMsg.textContent = '';
    statusMsg.className = 'status-msg';

    try {
      const result = await rpc('submit_church_signup_details', {
        p_token: token,
        p_church_name: document.getElementById('church-name').value,
        p_contact_name: document.getElementById('contact-name').value,
        p_contact_email: document.getElementById('contact-email').value,
        p_website_url: document.getElementById('church-website').value,
        p_pastor_name: document.getElementById('pastor-name').value,
        p_pastor_title: document.getElementById('pastor-title').value,
        p_letter_title: document.getElementById('letter-title').value,
        p_letter_subtitle: document.getElementById('letter-subtitle').value,
        p_letter_body: document.getElementById('letter-body').value,
      });

      if (!result || !result.success) {
        throw new Error('That link seems to be invalid. Please use the link from your confirmation email.');
      }

      app.innerHTML = `
        <div class="success-screen">
          <h2>Thanks — you're all set!</h2>
          <p>We've saved your church's details. Our team will review everything and get your page live soon. You'll get an email once it's approved.</p>
        </div>`;
    } catch (err) {
      statusMsg.textContent = err.message || 'Something went wrong. Please try again.';
      statusMsg.className = 'status-msg error';
      btn.disabled = false;
    }
  });
}

(async function init() {
  if (!token) {
    renderError('This link is missing some information. Please use the full link from your confirmation email.');
    return;
  }
  try {
    const church = await rpc('get_church_signup_by_token', { p_token: token });
    if (!church) {
      renderError("We couldn't find a church matching this link. Please use the link from your confirmation email, or reply to it if you need help.");
      return;
    }
    renderForm(church);
  } catch (err) {
    renderError('We had trouble loading this page. Please try again in a moment.');
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Following Jesus Course — A Guided Discipleship Course for Churches</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<meta name="description" content="A free, video-based course walking through the 7 essentials of following Jesus — built for churches to use with their people, with progress tracking and a certificate on completion.">
<meta property="og:title" content="Following Jesus Course">
<meta property="og:description" content="A free, video-based course walking through the 7 essentials of following Jesus — built for churches to use with their people.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Lora:ital@1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#17191D;
    --ink-soft:#6B7280;
    --blue:#3E82F7;
    --bg:#FFFFFF;
    --bg-soft:#F4F4F2;
    --line:#E4E3DD;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}

  /* ---------- Top bar (shared) ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;
  }
  .topbar.on-hero{position:absolute;top:0;left:0;right:0;z-index:2;}
  .logo-badge{
    background:var(--ink);color:#fff;
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    letter-spacing:0.18em;font-size:13px;
    padding:12px 16px;text-transform:uppercase;
    display:inline-block;
  }
  .logo-badge-full{display:block;width:100%;text-align:center;padding:22px 16px;box-sizing:border-box;}
  .logo-badge-img{height:30px;display:inline-block;vertical-align:middle;}
  .logo-badge-img.logo-badge-full{display:block;width:auto;height:36px;margin:20px auto;padding:0;}
  .topbar nav{display:flex;align-items:center;gap:22px;font-size:12.5px;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;}
  .topbar.on-hero nav{color:#fff;}

  /* ---------- Hero / landing ---------- */
  .hero{
    position:relative;
    min-height:520px;
    background:linear-gradient(180deg, rgba(10,12,16,0.78), rgba(10,12,16,0.84)), url('/assets/fj-hero-pattern.jpg') center/cover;
    display:flex;align-items:center;justify-content:center;
    text-align:center;color:#fff;padding:100px 20px 60px;
  }
  .hero h1{
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:clamp(32px,6vw,54px);letter-spacing:0.04em;
    margin:0 0 14px;
  }
  .hero p{max-width:560px;margin:0 auto 26px;font-size:16px;line-height:1.6;opacity:0.92;}
  /* Light-shaded hero variant: a course whose own hero image is bright
     (yellow, here) needs a light wash rather than the default dark one
     -- dark text stays readable on top, and the image's own colors show
     through more than a heavy dark overlay would allow. */
  .hero-light{
    background:var(--hero-bg-color);
    color:var(--ink);
  }
  .hero-light h1, .hero-light p{color:var(--ink);}
  .hero-light .btn-blue{background:var(--ink);}
  .hero-light .topbar.on-hero nav{color:var(--ink);}
  .purchase-required-body{
    max-width:480px;margin:0 auto;padding:80px 24px;text-align:center;
  }
  .purchase-required-body h1{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(24px,4vw,32px);margin:0 0 16px;
  }
  .purchase-required-body p{font-size:15px;line-height:1.6;color:var(--ink-soft);margin:0 0 28px;}
  .purchase-required-body .btn-blue{display:inline-block;text-decoration:none;}
  .purchase-required-back{display:block;margin-top:20px;font-size:13px;color:var(--ink-soft);text-decoration:none;}
  .purchase-required-back:hover{color:var(--ink);}
  .btn-blue{
    background:var(--blue);color:#fff;border:none;
    font-weight:600;font-size:15px;
    padding:14px 30px;border-radius:999px;
    cursor:pointer;
  }
  .below-hero{max-width:640px;margin:56px auto;padding:0 20px;text-align:center;}
  .below-hero h2{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:26px;line-height:1.3;}

  /* ---------- Letter section ---------- */
  .letter-section{max-width:680px;margin:0 auto;padding:0 20px 56px;text-align:center;}
  .letter-section h2{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(22px,4vw,30px);line-height:1.35;margin-bottom:32px;}
  .letter-section p{font-size:16px;line-height:1.75;color:var(--ink);text-align:left;margin:0 0 20px;}
  .letter-section ul{font-size:16px;line-height:1.9;color:var(--ink);text-align:left;margin:0 0 20px;padding-left:22px;}
  .letter-section li{margin-bottom:4px;}
  .letter-sig-name{font-family:'Lora',serif;font-style:italic;font-size:24px;margin-top:28px;text-align:left;}
  .letter-sig-title{font-size:13px;color:var(--ink-soft);margin-top:4px;text-align:left;}
  .letter-section p.letter-subtitle{font-size:18px;color:var(--ink-soft);text-align:center;margin:-16px 0 32px;}
  .letter-image{width:100%;border-radius:var(--radius);display:block;margin-bottom:28px;}
  .letter-website{font-size:14.5px;margin-top:6px;text-align:left;}
  .letter-website a{color:var(--blue);font-weight:600;}

  /* ---------- Checklist section ---------- */
  .checklist-section{background:var(--bg-soft);padding:60px 20px;}
  .checklist-inner{max-width:900px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;}
  .checklist-inner h2{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(26px,4vw,36px);line-height:1.25;margin:0;}
  .checklist-items{display:flex;flex-direction:column;gap:20px;}
  .checklist-item{display:flex;align-items:flex-start;gap:14px;}
  .checklist-check{
    flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;margin-top:1px;
  }
  .checklist-item span{font-size:16.5px;font-weight:500;}
  @media(max-width:720px){ .checklist-inner{grid-template-columns:1fr;} }

  /* ---------- Preview video section ---------- */
  .preview-section{max-width:900px;margin:0 auto;padding:56px 20px;text-align:center;}
  .preview-section h2{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(24px,4vw,32px);margin-bottom:26px;}
  .preview-frame{position:relative;border-radius:var(--radius);overflow:hidden;background:#000;aspect-ratio:16/9;cursor:pointer;}
  .preview-frame img{width:100%;height:100%;object-fit:cover;display:block;opacity:0.85;}
  .preview-play{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,0.92);
    display:flex;align-items:center;justify-content:center;
  }
  .preview-play svg{width:26px;height:26px;margin-left:4px;}
  .preview-frame iframe{width:100%;height:100%;border:none;display:block;}

  /* ---------- Course overview widget (reusable) ---------- */
  .overview-section{max-width:760px;margin:0 auto;padding:0 20px 80px;}
  .overview-section h2{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(26px,4vw,34px);margin-bottom:26px;}
  .overview-row{
    background:var(--bg-soft);border-radius:var(--radius);padding:20px 22px;margin-bottom:10px;
    display:flex;align-items:center;gap:18px;cursor:pointer;
  }
  .overview-num{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;color:var(--ink-soft);flex-shrink:0;width:20px;}
  .overview-title{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:19px;flex:1;}
  .overview-chev{color:var(--ink-soft);transition:transform 0.15s;flex-shrink:0;}
  .overview-row[data-open="true"] .overview-chev{transform:rotate(180deg);}
  .overview-items{max-height:0;overflow:hidden;transition:max-height 0.2s ease;}
  .overview-items.open{max-height:600px;}
  .overview-item-row{padding:12px 22px 12px 58px;font-size:14.5px;color:var(--ink-soft);border-bottom:1px solid var(--line);}
  .overview-item-row:last-child{border-bottom:none;}
  .overview-item-title{color:var(--ink);font-weight:500;}

  .site-footer{text-align:center;padding:40px 20px 56px;border-top:1px solid var(--line);margin-top:20px;}
  .site-footer p{font-size:12.5px;color:var(--ink-soft);margin:0 0 8px;}
  .site-footer p:last-child{margin-bottom:0;}
  .site-footer a{color:var(--ink-soft);font-weight:600;text-decoration:underline;}

  /* ---------- Additional resources section (opt-in per course via
     COURSE_RESOURCES_MAP -- most courses won't set this and the section
     just won't render) ---------- */
  .resources-section{max-width:900px;margin:0 auto;padding:0 20px 60px;}
  .resources-section h2{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(24px,4vw,32px);margin-bottom:26px;text-align:center;}
  .resources-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;}
  .resource-card{background:var(--bg-soft);border-radius:var(--radius);padding:24px;text-decoration:none;color:inherit;display:block;}
  .resource-card .resource-kicker{font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;opacity:0.6;}
  .resource-card h3{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600;margin:8px 0 8px;}
  .resource-card p{font-size:14px;opacity:0.75;margin:0 0 12px;}
  .resource-card .resource-link{font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:0.02em;}
  @media(max-width:720px){ .resources-grid{grid-template-columns:1fr;} }

  /* ---------- Player layout ---------- */
  .player-shell{display:flex;min-height:100vh;}
  .sidebar{
    width:340px;flex-shrink:0;border-right:1px solid var(--line);
    display:flex;flex-direction:column;
  }
  .sidebar-header{padding:0;}
  .sidebar-body{padding:20px;overflow-y:auto;}
  .back-link{font-size:13px;color:var(--ink-soft);text-decoration:none;display:block;margin-bottom:14px;}
  .course-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;margin:0 0 14px;}
  .church-name-heading{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;margin:0 0 4px;}
  .church-name-heading + .course-name{font-size:14px;font-weight:500;color:var(--ink-soft);margin-bottom:14px;}
  .progress-track{height:6px;background:var(--bg-soft);border-radius:3px;overflow:hidden;margin-bottom:8px;}
  .progress-fill{height:100%;background:var(--ink);}
  .progress-pct{font-size:13px;color:var(--ink-soft);margin-bottom:18px;}
  .cert-btn{
    width:100%;background:var(--ink);color:#fff;border:none;border-radius:8px;
    padding:13px;font-size:13.5px;font-weight:600;letter-spacing:0.03em;
    text-transform:uppercase;cursor:pointer;margin-bottom:22px;
  }

  .session{margin-bottom:6px;}
  .session-head{
    display:flex;align-items:center;gap:10px;padding:12px 4px;
    cursor:pointer;border-bottom:1px solid var(--line);
  }
  .session-head .check{
    width:22px;height:22px;border-radius:50%;flex-shrink:0;
    background:var(--bg-soft);border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#fff;
  }
  .session-head[data-complete="true"] .check{background:var(--ink);border-color:var(--ink);}
  .session-head .title{font-weight:600;font-size:14.5px;flex:1;}
  .session-head .frac{font-size:12.5px;color:var(--ink-soft);}
  .session-head .chev{color:var(--ink-soft);font-size:11px;transition:transform 0.15s;}
  .session-head[data-open="true"] .chev{transform:rotate(180deg);}

  .item-list{position:relative;padding-left:26px;margin:4px 0 10px;}
  .item-list::before{
    content:"";position:absolute;left:10px;top:2px;bottom:14px;width:1.5px;background:var(--line);
  }
  .item-row{
    position:relative;padding:10px 8px;border-radius:8px;cursor:pointer;
  }
  .item-row:hover{background:var(--bg-soft);}
  .item-row .dot{
    position:absolute;left:-19px;top:14px;width:12px;height:12px;border-radius:50%;
    background:#fff;border:2px solid var(--line);
  }
  .item-row[data-done="true"] .dot{background:var(--ink);border-color:var(--ink);}
  .item-row[data-active="true"]{background:var(--bg-soft);}
  .item-title{font-size:14px;font-weight:500;}
  .item-meta{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;margin-top:2px;}

  /* ---------- Content pane ---------- */
  .content-pane{flex:1;padding:32px 40px;max-width:900px;}
  .content-title{font-size:20px;font-weight:600;margin:0 0 18px;}
  .video-wrap{width:100%;aspect-ratio:16/9;background:#111;border-radius:var(--radius);overflow:hidden;}
  .video-wrap iframe{width:100%;height:100%;border:0;}
  .verse-block{text-align:center;margin:30px auto;max-width:520px;}
  .verse-label{font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px;}
  .verse-text{font-family:'Lora',serif;font-style:italic;font-size:19px;line-height:1.5;}
  .text-body{font-size:15px;line-height:1.8;}
  .text-body ul{padding-left:20px;}
  .action-row{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;}
  .btn-outline{
    border:1.5px solid var(--ink);background:#fff;color:var(--ink);
    padding:12px 22px;border-radius:8px;font-weight:600;font-size:13.5px;
    text-transform:uppercase;letter-spacing:0.03em;cursor:pointer;
  }
  .btn-dark{
    border:none;background:var(--ink);color:#fff;
    padding:12px 22px;border-radius:8px;font-weight:600;font-size:13.5px;
    text-transform:uppercase;letter-spacing:0.03em;cursor:pointer;
  }

  /* ---------- Discussion questions ---------- */
  .question-block{margin-bottom:22px;}
  .question-text{font-weight:600;font-size:14.5px;margin-bottom:8px;}
  .answer-box{
    width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:8px;
    padding:12px;font-family:'Inter',sans-serif;font-size:14px;resize:vertical;
  }
  .answer-box:focus{outline:none;border-color:var(--ink);}
  .save-note{font-size:12px;color:var(--ink-soft);margin-top:4px;height:14px;}
  .admin-reply{
    background:var(--bg-soft);border-left:3px solid var(--blue);
    border-radius:0 8px 8px 0;padding:10px 14px;margin-top:10px;font-size:13.5px;
  }
  .admin-reply .label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:3px;}

  /* ---------- Survey ---------- */
  .survey-intro{color:var(--ink-soft);font-size:14px;margin-bottom:24px;}
  .survey-q{margin-bottom:22px;}
  .rating-row{display:flex;gap:8px;}
  .rating-opt{
    width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);
    background:#fff;display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-weight:600;font-size:14px;
  }
  .rating-opt[data-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink);}
  .choice-row{display:flex;gap:10px;flex-wrap:wrap;}
  .choice-opt{
    padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);
    background:#fff;cursor:pointer;font-size:13.5px;
  }
  .choice-opt[data-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink);}
  .skip-link{display:block;text-align:center;color:var(--ink-soft);font-size:13px;margin-top:20px;cursor:pointer;}

  /* ---------- Auth ---------- */
  .auth-link{cursor:pointer;}

  /* ---------- Profile chip (top nav) ---------- */
  .profile-chip{display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;letter-spacing:normal;font-weight:600;}
  .profile-chip-avatar{
    width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;
    background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;
  }

  /* ---------- Profile page ---------- */
  .profile-page{max-width:640px;margin:0 auto;padding:40px 20px 80px;}
  .profile-back{font-size:13px;color:var(--ink-soft);cursor:pointer;display:inline-block;margin-bottom:24px;}
  .profile-header{display:flex;align-items:center;gap:18px;margin-bottom:34px;}
  .profile-avatar-lg{
    width:72px;height:72px;border-radius:50%;object-fit:cover;flex-shrink:0;
    background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;
  }
  .profile-email{font-size:13.5px;color:var(--ink-soft);margin-top:2px;}
  .profile-field-label{font-size:11.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:6px;display:block;}
  .profile-input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;font-family:'Inter',sans-serif;font-size:15px;margin-bottom:18px;}
  .profile-save-btn{background:var(--ink);color:#fff;border:none;border-radius:999px;padding:11px 26px;font-size:14px;font-weight:600;cursor:pointer;}
  .profile-signout-btn{background:none;border:none;color:var(--ink-soft);font-size:13.5px;cursor:pointer;margin-left:16px;}
  .profile-admin-link{
    display:block;margin-top:18px;padding:12px 16px;background:var(--bg-soft);border-radius:8px;
    font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none;
  }
  .profile-courses-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:19px;margin:40px 0 14px;}
  .profile-course-row{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    background:var(--bg-soft);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;cursor:pointer;
  }
  .profile-course-name{font-weight:600;font-size:15px;}
  .profile-course-status{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .profile-course-status.enrolled{color:var(--blue);}
  .profile-cert-link{
    background:var(--ink);color:#fff;border:none;border-radius:999px;
    padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0;
  }
  .auth-overlay{
    position:fixed;inset:0;background:rgba(10,12,16,0.55);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .auth-modal{
    background:#fff;border-radius:14px;width:100%;max-width:380px;
    padding:28px;position:relative;
  }
  .auth-close{position:absolute;top:16px;right:18px;cursor:pointer;color:var(--ink-soft);font-size:18px;background:none;border:none;}
  .auth-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;margin:0 0 4px;}
  .auth-subtitle{font-size:13.5px;color:var(--ink-soft);margin-bottom:20px;}
  .auth-google{
    width:100%;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:11px;
    font-weight:600;font-size:13.5px;cursor:pointer;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .auth-error{background:#FDECEC;color:#B3261E;font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:12px;}
  .auth-note{font-size:12px;color:var(--ink-soft);margin-top:10px;text-align:center;}

  .loading{padding:60px 20px;text-align:center;color:var(--ink-soft);font-size:13px;}

  /* ---------- Mobile drawer for the lesson sidebar ---------- */
  .menu-toggle-btn{display:none;}
  .sidebar-overlay{display:none;}
  @media(max-width:820px){
    .player-shell{position:relative;flex-direction:column;}
    .menu-toggle-btn{
      display:flex;align-items:center;gap:8px;width:100%;
      background:var(--bg-soft);border:none;border-radius:0;
      padding:16px 20px;font-size:14px;font-weight:600;cursor:pointer;text-align:left;
    }
    .menu-toggle-btn svg{width:18px;height:18px;flex-shrink:0;}
    .sidebar{
      position:fixed;inset:0;z-index:30;background:#fff;
      width:85%;max-width:360px;
      transform:translateX(-100%);transition:transform 0.2s ease;
      border-right:1px solid var(--line);
    }
    .sidebar.mobile-open{transform:translateX(0);}
    .sidebar-overlay{
      display:block;position:fixed;inset:0;z-index:25;
      background:rgba(10,12,16,0.4);opacity:0;pointer-events:none;transition:opacity 0.2s ease;
    }
    .sidebar-overlay.mobile-open{opacity:1;pointer-events:auto;}
    .content-pane{padding:20px 16px;}
  }
</style>
</head>
<body>

<div id="app">
  <div class="loading">Loading course…</div>
</div>

<script>
/* ============================================================
   CONFIG — reuse your app's existing Supabase client if you have
   one; otherwise fill these in. Renamed to supabaseClient to avoid
   colliding with an existing `supabase` variable in your app.

function getChurchSlug(){
  const pathMatch = window.location.pathname.match(/\/courses\/([^\/]+)/);
  if(pathMatch) return pathMatch[1];
  const params = new URLSearchParams(window.location.search);
  return params.get('church') || 'default';

// SEO: a church-specific page (/courses/{slug}) shouldn't compete with
// the generic /course page in search results — dozens of near-identical
// church pages could otherwise read as thin/duplicate content and drag
// down the whole site's quality signal. noindex (not a robots.txt block)
// is the right tool here: it still lets the page be crawled, shared, and
// linked directly — a church can still send their own link to their own
// people — it just asks Google not to list it in search results. This
// has to be injected in JS, not hardcoded in <head>, since this same
// file serves both the generic page (which SHOULD be indexed) and every
// church-specific one (which shouldn't), depending purely on the URL.
// Runs immediately, before any data fetching, so it's in the DOM as
// early as possible.
(function applySeoIndexing(){
  if(getChurchSlug() !== 'default'){
    const meta = document.createElement('meta');
    meta.name = 'robots';
    meta.content = 'noindex, follow';
    document.head.appendChild(meta);
  }
})();

function getCourseIdParam(){

  const explicit = params.get('course');
  if(explicit) return explicit; // an explicit ?course= (e.g. switching courses from the profile list) always wins over the pathname slug below
  const slugMatch = window.location.pathname.match(/^\/([^\/]+)\/?$/);
  if(slugMatch && COURSE_SLUG_MAP[slugMatch[1]]) return COURSE_SLUG_MAP[slugMatch[1]];

function getItemIdParam(){

}

// Keeps the URL's ?item= in sync with whatever's actually on screen, so
// a refresh keeps your place and the back button steps through lessons
// one at a time instead of skipping past the whole course. Callers that
// are just restoring state FROM the URL (popstate, initial page load)
// pass skipHistoryPush=true so they don't create a redundant or
// conflicting history entry.
function updateItemUrlParam(item, skipHistoryPush){
  if(skipHistoryPush) return;
  const params = new URLSearchParams(window.location.search);
  if(item) params.set('item', item.id); else params.delete('item');
  const query = params.toString();
  history.pushState({ itemId: item ? item.id : null }, '', `${window.location.pathname}${query ? '?' + query : ''}`);
}

let church = null;
let course = null;
// null = not checked yet this session, true/false = the actual result.
// Only relevant for a course with requires_purchase set -- cached so
// clicking between lessons doesn't re-hit the database on every single
// click, just the first time someone tries to view lesson content.
let hasPurchaseAccess = null;
let sessions = [];       // each with .items[]
let currentUser = null;
let doneItemIds = new Set();
let activeItem = null;
let openSessionId = null;
let questionsByItem = {};      // item_id -> [{id, question_text}]
let responsesByQuestion = {};  // question_id -> {response_text, admin_reply}
let surveyQuestions = [];
let surveyResponses = {};      // question_id -> response_text
let viewingSurvey = false;

async function init(){
  const slug = getChurchSlug();

  const { data: churchRow } = await supabaseClient.from('churches').select('*').eq('slug', slug).maybeSingle();
  church = churchRow;
  if(church?.primary_color){
    document.documentElement.style.setProperty('--blue', church.primary_color);
  }

  // Archived means the page itself is gone, not just enrollment — stop
  // here entirely rather than loading and rendering any course content.
  if(church?.course_status === 'archived'){
    document.getElementById('app').innerHTML = `
      <div class="loading" style="text-align:center; padding:60px 24px;">
        <h2 style="margin-bottom:12px;">This course is no longer available</h2>
        <p>Please reach out to your church for more information.</p>
      </div>`;
    return;
  }

  const { data: { user } } = await supabaseClient.auth.getUser();
  currentUser = user;

  // If we were sent here specifically to sign in before reaching an admin
  // page (via ?return_to=/admin or /dashboard), and signing in just
  // succeeded, go straight there instead of showing the course landing
  // page first.
  const returnTo = new URLSearchParams(window.location.search).get('return_to');
  if(returnTo && currentUser){
    window.location.href = returnTo;
    return;
  }

  const courseIdParam = getCourseIdParam();
  let courseQuery = supabaseClient.from('courses').select('*, sessions(*, session_items(*))');
  courseQuery = courseIdParam ? courseQuery.eq('id', courseIdParam) : courseQuery.eq('is_free', true).limit(1);
  const { data: courseRow } = await courseQuery.maybeSingle();

  if(!courseRow){
    document.getElementById('app').innerHTML = '<div class="loading">No course found.</div>';
    return;
  }

  course = courseRow;
  sessions = (courseRow.sessions || [])
    .sort((a,b)=>a.sort_order-b.sort_order)
    .map(s => ({...s, session_items: (s.session_items||[]).sort((a,b)=>a.sort_order-b.sort_order)}));

  // Discussion questions for every discussion-type item in the course
  const discussionItemIds = sessions.flatMap(s=>s.session_items).filter(i=>i.type==='discussion').map(i=>i.id);
  if(discussionItemIds.length){
    const { data: questions } = await supabaseClient
      .from('discussion_questions').select('*').in('item_id', discussionItemIds).order('sort_order');
    (questions||[]).forEach(q => {
      if(!questionsByItem[q.item_id]) questionsByItem[q.item_id] = [];
      questionsByItem[q.item_id].push(q);
    });
  }

  const { data: surveyQ } = await supabaseClient
    .from('course_survey_questions').select('*').eq('course_id', course.id).order('sort_order');
  surveyQuestions = surveyQ || [];

  if(currentUser){
    await ensureProfileAndEnrollment();
    await loadUserProgress();
  }

  if(currentUser && sessionStorage.getItem('fj_pending_start') === '1'){
    sessionStorage.removeItem('fj_pending_start');
    goToFirstLesson();
    return;
  }

  // A bookmarked or refreshed URL with ?item= should land you back on
  // that exact lesson, not the course landing page.
  const itemIdParam = getItemIdParam();
  const restoredItem = itemIdParam ? sessions.flatMap(s => s.session_items).find(i => i.id === itemIdParam) : null;
  if(restoredItem){
    const owningSession = sessions.find(s => s.session_items.some(i => i.id === restoredItem.id));
    openSessionId = owningSession?.id || null;
    renderPlayer(restoredItem, true);
  } else {
    renderHero(true);
  }

  // If we were sent here specifically to sign in before reaching an admin
  // page, and we're NOT already signed in, open the sign-in modal
  // immediately instead of making them find and click "Sign In" again.
  if(returnTo && !currentUser){
    renderAuthModal('signin');
  }
}

/* ---------- Auth-dependent data loading ---------- */
async function ensureProfileAndEnrollment(){
  if(!currentUser) return;

  // If someone arrived without a church-specific URL, check whether
  // their email matches a historical Thinkific student — if so, connect
  // them to the same church automatically rather than leaving them
  // unassigned. A URL-based church (someone who came through an actual
  // /courses/theirchurch link) always takes priority over this.
  let resolvedChurchId = church?.id || null;
  if(!resolvedChurchId && currentUser.email){
    const { data: legacyChurchId } = await supabaseClient.rpc('get_legacy_church_id', { lookup_email: currentUser.email });
    if(legacyChurchId) resolvedChurchId = legacyChurchId;
  }

  // Create their profile row if this is their first time (won't overwrite an existing one)
  const { data: existingProfile } = await supabaseClient
    .from('profiles').select('id').eq('id', currentUser.id).maybeSingle();

  if(!existingProfile){
    await supabaseClient.from('profiles').insert({
      id: currentUser.id,
      church_id: resolvedChurchId,
      full_name: currentUser.user_metadata?.full_name || currentUser.email,
      role: 'student'
    });
  }

  // Enroll them in this course if they aren't already — skipped
  // entirely for draft/archived churches, as a backstop beyond just
  // disabling the button (e.g. someone already signed in from a
  // previous visit landing here directly).
  if(course && church?.course_status !== 'draft' && church?.course_status !== 'archived'){
    const { data: existingEnrollment } = await supabaseClient
      .from('enrollments').select('id').eq('student_id', currentUser.id).eq('course_id', course.id).maybeSingle();

    if(!existingEnrollment){
      await supabaseClient.from('enrollments').insert({
        student_id: currentUser.id,
        church_id: resolvedChurchId,
        course_id: course.id
      });
    }
  }
}

async function loadUserProgress(){
  if(!currentUser) return;

  const { data: progress } = await supabaseClient
    .from('item_progress')
    .select('item_id, completed_at')
    .eq('student_id', currentUser.id);
  (progress||[]).forEach(p => { if(p.completed_at) doneItemIds.add(p.item_id); });

  const allQuestionIds = Object.values(questionsByItem).flat().map(q=>q.id);
  if(allQuestionIds.length){
    const { data: responses } = await supabaseClient
      .from('discussion_responses').select('*').eq('student_id', currentUser.id).in('question_id', allQuestionIds);
    (responses||[]).forEach(r => { responsesByQuestion[r.question_id] = r; });
  }

  if(surveyQuestions.length){
    const { data: sResponses } = await supabaseClient
      .from('course_survey_responses').select('*').eq('student_id', currentUser.id)
      .in('question_id', surveyQuestions.map(q=>q.id));
    (sResponses||[]).forEach(r => { surveyResponses[r.question_id] = r.response_text; });
  }
}

function renderAuthModal(mode){
  const existing = document.getElementById('auth-overlay');
  if(existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.id = 'auth-overlay';
  overlay.className = 'auth-overlay';
  overlay.innerHTML = `
    <div class="auth-modal">
      <button class="auth-close" id="auth-close">&times;</button>
      <div class="auth-title">${mode === 'signup' ? 'Create your account' : 'Sign in'}</div>
      <div class="auth-subtitle">${mode === 'signup' ? 'Start tracking your progress through the course.' : 'Welcome back — pick up where you left off.'}</div>
      <div id="auth-error"></div>
      <button class="auth-google" id="google-btn">Continue with Google</button>

      <p style="text-align:center;font-size:11.5px;color:var(--ink-soft);margin-top:10px;">By continuing, you agree to our <a href="/terms" target="_blank" style="color:var(--ink-soft);text-decoration:underline;">Terms</a> and <a href="/privacy" target="_blank" style="color:var(--ink-soft);text-decoration:underline;">Privacy Policy</a>.</p>
    </div>

  document.body.appendChild(overlay);

  document.getElementById('auth-close').addEventListener('click', closeAuthModal);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeAuthModal(); });
  document.getElementById('google-btn').addEventListener('click', handleGoogleAuth);
}

function closeAuthModal(){
  const existing = document.getElementById('auth-overlay');
  if(existing) existing.remove();
}

function showAuthError(message){
  const el = document.getElementById('auth-error');
  if(el) el.innerHTML = `<div class="auth-error">${message}</div>`;
}

async function handleGoogleAuth(){
  // Preserve whatever intent was already set (e.g. by the Start Course button)
  // without forcing "start course" on someone who just clicked plain Sign In.
  await supabaseClient.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: window.location.href,
      // Forces Google's account picker to show every time, instead of
      // silently auto-selecting whichever Google account was used most
      // recently in this browser — important here since one browser is
      // often used to test multiple different accounts/roles.
      queryParams: { prompt: 'select_account' }
    }
  });
  // Page redirects to Google, then back here — init() below picks up the
  // logged-in session and the pending-start flag (if any) after reload.
}

  doneItemIds = new Set();

async function renderProfile(){
  const { data: allCourses } = await supabaseClient.from('courses').select('id, title, subtitle, sessions(session_items(id))').order('created_at');
  const { data: myEnrollments } = await supabaseClient.from('enrollments').select('course_id').eq('student_id', currentUser.id);
  const enrolledIds = new Set((myEnrollments || []).map(e => e.course_id));
  const { data: myProgress } = await supabaseClient.from('item_progress').select('item_id').eq('student_id', currentUser.id);
  const doneItemIdSet = new Set((myProgress || []).map(p => p.item_id));
  const { data: myProfile } = await supabaseClient.from('profiles').select('role').eq('id', currentUser.id).maybeSingle();

  let adminLinkHtml = '';
  if(myProfile?.role === 'super_admin'){
    adminLinkHtml = `<a class="profile-admin-link" href="/admin">⚙️ Admin Dashboard</a>`;
  } else if(myProfile?.role === 'church_admin'){
    adminLinkHtml = `<a class="profile-admin-link" href="/dashboard">⚙️ Church Admin Dashboard</a>`;
  } else if(myProfile?.role === 'group_leader'){
    adminLinkHtml = `<a class="profile-admin-link" href="/leader">⚙️ Group Leader Dashboard</a>`;
  }

  const coursesHtml = (allCourses || []).map(c => {
    const allItemIds = (c.sessions || []).flatMap(s => (s.session_items || []).map(i => i.id));
    const totalCount = allItemIds.length;
    const doneCount = allItemIds.filter(id => doneItemIdSet.has(id)).length;
    const isComplete = totalCount > 0 && doneCount === totalCount;
    const isEnrolled = enrolledIds.has(c.id);
    const statusText = isComplete
      ? 'Completed'
      : (isEnrolled ? 'Enrolled — continue where you left off' : 'Not started yet');
    return `
      <div class="profile-course-row" data-course-id="${c.id}">
        <div>
          <div class="profile-course-name">${c.title}</div>
          <div class="profile-course-status ${isEnrolled || isComplete ? 'enrolled' : ''}">${statusText}</div>
        </div>
        ${isComplete ? `<button class="profile-cert-link" data-cert-course="${c.id}">🏅 Certificate</button>` : '<span>&rarr;</span>'}
      </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="profile-page">
      <a class="profile-back" id="profile-back">&larr; Back to course</a>
      <div class="profile-header">
        ${avatarHtml('profile-avatar-lg')}
        <div>
          <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:22px;">${profileDisplayName()}</div>
          <div class="profile-email">${currentUser.email}</div>
        </div>
      </div>

      <label class="profile-field-label">Your Name</label>
      <input type="text" class="profile-input" id="profile-name-input" value="${profileDisplayName()}" />
      <button class="profile-save-btn" id="profile-save-btn">Save Changes</button>
      <button class="profile-signout-btn" id="profile-signout-btn">Sign Out</button>
      ${adminLinkHtml}

      <div class="profile-courses-title">Your Courses</div>
      ${coursesHtml || '<p style="color:var(--ink-soft);font-size:14px;">No courses available yet.</p>'}
    </div>
  `;

  document.getElementById('profile-back').addEventListener('click', () => {
    if(activeItem || viewingSurvey){ renderPlayer(activeItem); } else { renderHero(); }
  });
  document.getElementById('profile-save-btn').addEventListener('click', async () => {
    const newName = document.getElementById('profile-name-input').value.trim();
    if(!newName) return;
    await supabaseClient.from('profiles').update({ full_name: newName }).eq('id', currentUser.id);
    // Keep auth user_metadata in sync too, since profileDisplayName() and
    // avatarHtml() read from the session, not the database, elsewhere.
    await supabaseClient.auth.updateUser({ data: { full_name: newName } });
    const { data: { user } } = await supabaseClient.auth.getUser();
    currentUser = user;
    renderProfile();
  });
  document.getElementById('profile-signout-btn').addEventListener('click', handleSignOut);

  // Certificate buttons are their own click target — stop the click from
  // also bubbling to the row's own "go to this course" handler below.
  document.querySelectorAll('.profile-cert-link').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const courseId = btn.dataset.certCourse;
      const { data: cert } = await supabaseClient.from('certificates').select('certificate_code').eq('student_id', currentUser.id).eq('course_id', courseId).maybeSingle();
      if(cert) window.location.href = `certificate.html?code=${cert.certificate_code}`;
      else alert("Your certificate is still being issued — try again in a moment.");
    });
  });

  document.querySelectorAll('.profile-course-row').forEach(row => {
    row.addEventListener('click', () => {
      window.location.href = `${window.location.pathname}?course=${row.dataset.courseId}`;
    });
  });
}

/* ---------- Hero / landing ---------- */
// If the church viewing this course has its own custom letter (a pastor's
// welcome instead of the author's), that takes priority — otherwise falls
// back to the course's own default letter. Same field names on both
// tables, so this is just "which row has content, church or course."
//
// Checks every letter field here, not just letter_body — a church that's
// set a custom title, photo, or video but left the body paragraph blank
// still counts as having their own letter. The earlier version only
// checked letter_body, so setting anything else without also writing a
// body paragraph silently fell all the way back to the generic course's
// letter instead — a real bug, not intentional.
// Falls back to this whenever whichever source got picked (church or
// course) doesn't have its own body text written — so a church that's
// customized a title or photo but hasn't written their own welcome
// paragraph still shows something warm and complete, not a gap.
const DEFAULT_LETTER_BODY = `We couldn't be more excited to welcome you to the family of God and to our church family! This Following Jesus course will help you walk through the 7 essentials of Following Jesus! Our prayer is that you would know Jesus in a personal and powerful way and that you would experience the fresh, real, and powerful life of a follower of Jesus!

God bless you as you begin your new journey of following Jesus!`;

function letterSectionHtml(course, churchObj){
  const hasAnyLetterContent = (obj) => !!(obj && (obj.letter_title || obj.letter_body || obj.letter_image_url || obj.letter_video_youtube_id));
  const source = hasAnyLetterContent(churchObj) ? churchObj : course;
  if(!hasAnyLetterContent(source)) return '';
  const bodyText = source.letter_body || DEFAULT_LETTER_BODY;
  const paragraphs = bodyText.split(/\n\s*\n/).map(p => `<p>${p.trim()}</p>`).join('');
  const mediaHtml = source.letter_video_youtube_id
    ? `<div class="preview-frame letter-image" id="letter-video-frame" data-video-id="${source.letter_video_youtube_id}">
         <img src="https://img.youtube.com/vi/${source.letter_video_youtube_id}/maxresdefault.jpg" alt="Welcome video" />
         <div class="preview-play"><svg viewBox="0 0 24 24" fill="var(--ink)"><path d="M8 5v14l11-7z"/></svg></div>
       </div>`
    : (source.letter_image_url ? `<img class="letter-image" src="${source.letter_image_url}" alt="" />` : '');
  return `
    <div class="letter-section">
      ${source.letter_title ? `<h2>${source.letter_title}</h2>` : ''}
      ${source.letter_subtitle ? `<p class="letter-subtitle">${source.letter_subtitle}</p>` : ''}
      ${mediaHtml}
      ${paragraphs}
      ${source.letter_author_name ? `
        <div class="letter-sig-name">${source.letter_author_name}</div>
        ${source.letter_author_title ? `<div class="letter-sig-title">${source.letter_author_title}</div>` : ''}
      ` : ''}
      ${source.website_url ? `<p class="letter-website"><a href="${source.website_url}" target="_blank" rel="noopener">${source.website_url.replace(/^https?:\/\//, '')}</a></p>` : ''}
    </div>`;
}

function checklistSectionHtml(course){
  if(!course.checklist_items || !course.checklist_items.length) return '';
  const itemsHtml = course.checklist_items.map(item => `
    <div class="checklist-item">
      <div class="checklist-check">✓</div>
      <span>${item}</span>
    </div>`).join('');
  return `
    <div class="checklist-section">
      <div class="checklist-inner">
        <h2>${course.checklist_title || "You'll Want To Take This Course If..."}</h2>
        <div class="checklist-items">${itemsHtml}</div>
      </div>
    </div>`;
}

function previewSectionHtml(course){
  if(!course.hero_video_youtube_id) return '';
  return `
    <div class="preview-section">
      <h2>Watch A Preview!</h2>
      <div class="preview-frame" id="preview-frame" data-video-id="${course.hero_video_youtube_id}">
        <img src="https://img.youtube.com/vi/${course.hero_video_youtube_id}/maxresdefault.jpg" alt="Preview video" />
        <div class="preview-play"><svg viewBox="0 0 24 24" fill="var(--ink)"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
    </div>`;
}

// The reusable course overview widget — takes just a sessions array (each
// with its session_items already attached), so this works for any course,
// not just this one. Drop it into any landing page with
// courseOverviewWidgetHtml(sessions) and wire it with
// wireCourseOverviewWidget() after it's in the DOM.
function courseOverviewWidgetHtml(sessionsList){
  const rowsHtml = sessionsList.map((s, i) => {
    const itemsHtml = (s.session_items || []).map(item => `
      <div class="overview-item-row">
        <span class="overview-item-title">${item.title}</span>${item.duration_minutes ? ` — ${item.type === 'video' ? 'Watch' : item.type === 'download' ? 'Download' : 'Read'} · ${item.duration_minutes} min` : ''}
      </div>`).join('');
    return `
      <div class="overview-row" data-session-index="${i}">
        <div class="overview-num">${i + 1}</div>
        <div class="overview-title">${s.title}</div>
        <svg class="overview-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="overview-items" id="overview-items-${i}">${itemsHtml}</div>`;
  }).join('');
  return `
    <div class="overview-section">
      <h2>Course Overview</h2>
      ${rowsHtml}
    </div>`;
}

function footerHtml(){
  const year = new Date().getFullYear();
  return `
    <footer class="site-footer">
      <p>&copy; ${year} Following Jesus. All rights reserved.</p>
      <p><a href="https://followingjesusbook.com/" target="_blank" rel="noopener">For Church Discipleship Resources</a></p>
    </footer>`;
}

function resourcesSectionHtml(courseObj){
  const resources = courseObj?.id ? COURSE_RESOURCES_MAP[courseObj.id] : null;
  if(!resources || !resources.length) return '';
  const cardsHtml = resources.map(r => `
    <a class="resource-card" href="${r.url}" target="_blank" rel="noopener">
      <div class="resource-kicker">${r.kicker}</div>
      <h3>${r.title}</h3>
      <p>${r.desc}</p>
      <span class="resource-link">${r.linkText} &rarr;</span>
    </a>`).join('');
  return `
    <div class="resources-section">
      <h2>Additional Church Leader Resources</h2>
      <div class="resources-grid">${cardsHtml}</div>
    </div>`;
}

function wireCourseOverviewWidget(){
  document.querySelectorAll('.overview-row').forEach(row => {
    row.addEventListener('click', () => {
      const i = row.dataset.sessionIndex;
      const isOpen = row.dataset.open === 'true';
      row.dataset.open = isOpen ? 'false' : 'true';
      document.getElementById(`overview-items-${i}`).classList.toggle('open', !isOpen);
    });
  });
}

function wirePreviewVideo(){
  const frame = document.getElementById('preview-frame');
  if(!frame) return;
  frame.addEventListener('click', () => {
    const videoId = frame.dataset.videoId;
    frame.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  }, { once: true });
}

function wireLetterVideo(){
  const frame = document.getElementById('letter-video-frame');
  if(!frame) return;
  frame.addEventListener('click', () => {
    const videoId = frame.dataset.videoId;
    frame.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  }, { once: true });
}

function renderHero(skipHistoryPush){
  activeItem = null;
  viewingSurvey = false;
  updateItemUrlParam(null, skipHistoryPush);
  // The <title> tag in the HTML head is just a static placeholder for
  // whichever course happens to load first -- without this, every
  // course's browser tab (and any bookmark/history entry) would
  // permanently say "Following Jesus Course" regardless of which course
  // is actually being viewed.
  if(course?.title) document.title = `${course.title} — A Guided Discipleship Course`;
  const isDraft = church?.course_status === 'draft';
  const startButtonHtml = isDraft
    ? `<p class="draft-notice" style="opacity:0.75; font-size:14px; margin-top:8px;">This course isn't currently open for enrollment. Please check back later or reach out to your church.</p>`
    : `<button class="btn-blue" id="start-btn">Start Course Today!</button>`;
  const customHero = course?.id ? COURSE_CUSTOM_HERO_MAP[course.id] : null;
  const heroHtml = customHero ? `
    <div class="hero hero-light" style="--hero-bg-color:${customHero.bgColor};">
      <div class="topbar on-hero">
        ${logoBadgeHtml()}
        <nav><a href="https://qrco.de/fjapp">App</a>${authStatusHtml()}</nav>
      </div>
      <div>
        <h1>${customHero.title}</h1>
        <p>${customHero.subtitle}</p>
        ${startButtonHtml}
      </div>
    </div>
  ` : `
    <div class="hero">
      <div class="topbar on-hero">
        ${logoBadgeHtml()}
        <nav><a href="https://qrco.de/fjapp">App</a>${authStatusHtml()}</nav>
      </div>
      <div>
        <h1>${course.title}</h1>
        <p>${course.subtitle || ''}</p>
        ${startButtonHtml}
      </div>
    </div>
  `;
  document.getElementById('app').innerHTML = `
    ${heroHtml}
    ${letterSectionHtml(course, church)}
    ${checklistSectionHtml(course)}
    ${previewSectionHtml(course)}
    ${courseOverviewWidgetHtml(sessions)}
    ${resourcesSectionHtml(course)}
    ${footerHtml()}
  `;
  bindAuthStatusLinks();
  if(!isDraft){
    document.getElementById('start-btn').addEventListener('click', () => {
      if(!currentUser){
        sessionStorage.setItem('fj_pending_start', '1');
        renderAuthModal('signup');
        return;
      }
      goToFirstLesson();
    });
  }
  wirePreviewVideo();
  wireLetterVideo();
  wireCourseOverviewWidget();
}

function goToFirstLesson(){
  const firstSession = sessions[0];
  const firstItem = firstSession?.session_items?.[0];
  openSessionId = firstSession?.id || null;
  renderPlayer(firstItem || null);
}

// Shown instead of lesson content when someone is signed in but hasn't
// purchased a course with requires_purchase set. Their Google account
// itself isn't the problem -- access is matched by email against a
// Shopify order, so the message is specifically about that email
// needing a completed purchase, not about signing in again.
function renderPurchaseRequired(){
  const customHero = course?.id ? COURSE_CUSTOM_HERO_MAP[course.id] : null;
  const buyUrl = customHero?.shopifyProductUrl || (course?.id ? COURSE_PURCHASE_URL_MAP[course.id] : null);
  document.getElementById('app').innerHTML = `
    <div class="purchase-required">
      <div class="topbar">
        ${logoBadgeHtml()}
        <nav><a href="https://qrco.de/fjapp">App</a>${authStatusHtml()}</nav>
      </div>
      <div class="purchase-required-body">
        <h1>This course requires purchase</h1>
        <p>${course.title} isn't included with your account yet. If you've already bought it, make sure you're signed in with the same email you used at checkout${currentUser?.email ? ` (you're currently signed in as ${escapeHtmlPlayer(currentUser.email)})` : ''}.</p>
        ${buyUrl ? `<a class="btn-blue" href="${buyUrl}">Purchase ${escapeHtmlPlayer(course.title)} →</a>` : ''}
        <a class="purchase-required-back" href="#" id="purchase-required-back-link">← Back to the course overview</a>
      </div>
    </div>
  `;
  bindAuthStatusLinks();
  document.getElementById('purchase-required-back-link').addEventListener('click', (e) => {
    e.preventDefault();
    renderHero();
  });
}

function escapeHtmlPlayer(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Player shell ---------- */
async function renderPlayer(item, skipHistoryPush){
  // Paywall gate -- this is the one function every path into lesson
  // content goes through (the Start button, resuming after sign-up, and
  // a bookmarked ?item= URL all end up here), so it's the single place
  // this needs to be checked rather than guarding each entry point
  // separately.
  if(course?.requires_purchase && hasPurchaseAccess !== true){
    if(hasPurchaseAccess === null){
      const { data } = await supabaseClient.rpc('has_purchased_course', { p_course_id: course.id });
      hasPurchaseAccess = !!data;
    }
    if(!hasPurchaseAccess){
      renderPurchaseRequired();
      return;
    }
  }

  activeItem = item;
  const totalItems = sessions.reduce((n,s)=>n+s.session_items.length,0);
  const completedCount = sessions.reduce((n,s)=>n+s.session_items.filter(i=>doneItemIds.has(i.id)).length,0);
  const pct = totalItems ? Math.round((completedCount/totalItems)*100) : 0;

  document.getElementById('app').innerHTML = `
    <div class="player-shell">
      <button class="menu-toggle-btn" id="menu-toggle-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <span>${course.title} — Lessons</span>
      </button>
      <div class="sidebar" id="sidebar">
        ${logoBadgeHtml('logo-badge-full')}
        <div class="sidebar-body">
          <a class="back-link" id="back-link">&larr; Go to Dashboard</a>
          ${church?.name ? `<div class="church-name-heading">${church.name}</div>` : ''}
          <div class="course-name">${course.title}</div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-pct">${pct}% complete</div>
          ${pct === 100 ? `<button class="cert-btn" id="cert-btn">🏅 Go to Certificate</button>` : ''}
          <div id="session-list"></div>
          <div class="session" style="margin-top:6px;">
            <div class="session-head" id="survey-link" data-complete="false" data-open="false" style="cursor:pointer;">
              <div class="check">${Object.keys(surveyResponses).length >= surveyQuestions.length && surveyQuestions.length ? '✓' : ''}</div>
              <div class="title">End of Course Survey</div>
              <div class="frac" style="text-transform:uppercase;font-size:11px;">Optional</div>
            </div>
          </div>
        </div>
      </div>
      <div class="sidebar-overlay" id="sidebar-overlay"></div>
      <div class="content-pane" id="content-pane"></div>
    </div>
  `;

  document.getElementById('back-link').addEventListener('click', renderHero);
  const certBtn = document.getElementById('cert-btn');
  if(certBtn) certBtn.addEventListener('click', async () => {
    const { data: cert } = await supabaseClient.from('certificates').select('certificate_code').eq('student_id', currentUser.id).eq('course_id', course.id).maybeSingle();
    if(cert) window.location.href = `certificate.html?code=${cert.certificate_code}`;
    else alert("Your certificate is still being issued — try again in a moment, or finish any remaining items first.");
  });
  document.getElementById('survey-link').addEventListener('click', () => { renderSurvey(); closeMobileDrawer(); });
  bindAuthStatusLinks();

  document.getElementById('menu-toggle-btn').addEventListener('click', openMobileDrawer);
  document.getElementById('sidebar-overlay').addEventListener('click', closeMobileDrawer);

  renderSessionList();
  if(item) renderContent(item, skipHistoryPush); else if(!viewingSurvey) renderContent(null, skipHistoryPush);
}

function openMobileDrawer(){
  document.getElementById('sidebar').classList.add('mobile-open');
  document.getElementById('sidebar-overlay').classList.add('mobile-open');
}

function closeMobileDrawer(){
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  if(sidebar) sidebar.classList.remove('mobile-open');
  if(overlay) overlay.classList.remove('mobile-open');
}

function renderSessionList(){
  const list = document.getElementById('session-list');
  list.innerHTML = sessions.map(s => {
    const done = s.session_items.filter(i=>doneItemIds.has(i.id)).length;
    const total = s.session_items.length;
    const isOpen = openSessionId === s.id;
    return `
      <div class="session">
        <div class="session-head" data-complete="${done===total && total>0}" data-open="${isOpen}" data-session-id="${s.id}">
          <div class="check">${done===total && total>0 ? '✓' : ''}</div>
          <div class="title">${s.title}</div>
          <div class="frac">${done}/${total}</div>
          <div class="chev">▾</div>
        </div>
        ${isOpen ? `<div class="item-list">${s.session_items.map(i => renderItemRow(i)).join('')}</div>` : ''}
      </div>`;
  }).join('');

  list.querySelectorAll('.session-head').forEach(el => {
    el.addEventListener('click', () => {
      const sid = el.dataset.sessionId;
      openSessionId = openSessionId === sid ? null : sid;
      renderSessionList();
    });
  });
  list.querySelectorAll('.item-row').forEach(el => {
    el.addEventListener('click', () => {
      const item = sessions.flatMap(s=>s.session_items).find(i => i.id === el.dataset.itemId);
      renderContent(item);
      renderSessionList();
      closeMobileDrawer();
    });
  });
}

function renderItemRow(item){
  const metaMap = {
    video: `WATCH · ${item.duration_minutes || '—'} MIN`,
    download: 'DOWNLOAD',
    discussion: 'SHARE · DISCUSSION',
    text: 'ACT'
  };
  return `
    <div class="item-row" data-item-id="${item.id}" data-done="${doneItemIds.has(item.id)}" data-active="${activeItem?.id===item.id}">
      <div class="dot"></div>
      <div class="item-title">${item.title}</div>
      <div class="item-meta">${metaMap[item.type] || ''}</div>
    </div>`;
}

// Shared by the Previous/Continue buttons and the auto-advance after
// Mark Complete, so the "flatten sessions, find this item's index"
// logic exists in exactly one place.
function getAdjacentItem(item, direction){
  const flat = sessions.flatMap(s=>s.session_items);
  const idx = flat.findIndex(i=>i.id===item.id);
  if(idx === -1) return null;
  return direction === 'next' ? (flat[idx+1] || null) : (flat[idx-1] || null);
}

/* ---------- Content pane ---------- */
function renderContent(item, skipHistoryPush){
  viewingSurvey = false;
  activeItem = item;
  updateItemUrlParam(item, skipHistoryPush);
  const pane = document.getElementById('content-pane');
  if(!item){ pane.innerHTML = '<div class="loading">Select a lesson to begin.</div>'; return; }

  const isDone = doneItemIds.has(item.id);
  let body = '';

  if(item.type === 'video'){
    body = `
      <div class="video-wrap">
        <iframe src="https://www.youtube.com/embed/${item.youtube_video_id}"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
      </div>
      ${item.memory_verse ? `
        <div class="verse-block">
          <div class="verse-label">Memory Verse</div>
          <div class="verse-text">${item.memory_verse}</div>
          ${item.memory_verse_reference ? `<div style="font-size:13px;color:var(--ink-soft);margin-top:6px;">${item.memory_verse_reference}</div>` : ''}
        </div>` : ''}
    `;
  } else if(item.type === 'download'){
    body = `<div class="text-body"><p>${item.body || 'Download the resource below.'}</p>
      <p><a class="btn-dark" href="${item.download_url || '#'}" target="_blank" style="display:inline-block;text-decoration:none;">Download</a></p></div>`;
  } else if(item.type === 'discussion'){
    const questions = questionsByItem[item.id] || [];
    body = questions.map((q, i) => {
      const existing = responsesByQuestion[q.id];
      return `
        <div class="question-block">
          <div class="question-text">${i+1}. ${q.question_text}</div>
          <textarea class="answer-box" data-question-id="${q.id}" placeholder="${currentUser ? 'Type your answer...' : 'Sign in to save your answer'}" ${currentUser ? '' : 'readonly'}>${existing?.response_text || ''}</textarea>
          <div class="save-note" data-note-for="${q.id}"></div>
          ${existing?.admin_reply ? `
            <div class="admin-reply">
              <div class="label">Reply from your church leader</div>
              ${existing.admin_reply}
            </div>` : ''}
        </div>`;
    }).join('');
  } else {
    body = `<div class="text-body">${item.body || ''}</div>`;
  }

  const prevItem = getAdjacentItem(item, 'prev');

  pane.innerHTML = `
    <div class="content-title">${item.title}</div>
    ${body}
    <div class="action-row">
      ${prevItem ? `<button class="btn-outline" id="prev-btn">&larr; Previous</button>` : ''}
      <button class="btn-outline" id="toggle-complete">${isDone ? 'Mark Incomplete' : 'Mark Complete'}</button>
      <button class="btn-dark" id="continue-btn">Continue &rarr;</button>
    </div>
  `;

  if(prevItem) document.getElementById('prev-btn').addEventListener('click', () => renderContent(prevItem));
  document.getElementById('toggle-complete').addEventListener('click', () => toggleComplete(item));
  document.getElementById('continue-btn').addEventListener('click', () => {
    const next = getAdjacentItem(item, 'next');
    if(next) renderContent(next); else renderSurvey();
  });

  if(item.type === 'discussion'){
    pane.querySelectorAll('.answer-box').forEach(box => {
      if(!currentUser){
        box.addEventListener('click', () => renderAuthModal('signup'));
        return;
      }
      let debounceTimer;
      box.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        const note = pane.querySelector(`[data-note-for="${box.dataset.questionId}"]`);
        if(note) note.textContent = 'Saving...';
        debounceTimer = setTimeout(() => saveDiscussionAnswer(box.dataset.questionId, box.value, note), 700);
      });
    });
  }
}

async function saveDiscussionAnswer(questionId, text, noteEl){
  if(!currentUser) return;
  await supabaseClient.from('discussion_responses').upsert({
    student_id: currentUser.id,
    question_id: questionId,
    response_text: text,
    updated_at: new Date().toISOString()
  }, { onConflict: 'student_id,question_id' });

  responsesByQuestion[questionId] = { ...(responsesByQuestion[questionId]||{}), response_text: text };
  if(noteEl){ noteEl.textContent = 'Saved'; setTimeout(()=>{ if(noteEl) noteEl.textContent=''; }, 1500); }
}

/* ---------- End of course survey ---------- */
function renderSurvey(){
  viewingSurvey = true;
  activeItem = null;
  const pane = document.getElementById('content-pane');

  const questionsHtml = surveyQuestions.map(q => {
    const val = surveyResponses[q.id];
    if(q.question_type === 'rating'){
      return `
        <div class="survey-q">
          <div class="question-text">${q.question_text}</div>
          <div class="rating-row" data-question-id="${q.id}">
            ${[1,2,3,4,5].map(n => `<div class="rating-opt" data-value="${n}" data-selected="${String(val)===String(n)}">${n}</div>`).join('')}
          </div>
        </div>`;
    }
    if(q.question_type === 'choice'){
      const choices = q.choices || [];
      return `
        <div class="survey-q">
          <div class="question-text">${q.question_text}</div>
          <div class="choice-row" data-question-id="${q.id}">
            ${choices.map(c => `<div class="choice-opt" data-value="${c}" data-selected="${val===c}">${c}</div>`).join('')}
          </div>
        </div>`;
    }
    return `
      <div class="survey-q">
        <div class="question-text">${q.question_text}</div>
        <textarea class="answer-box" data-question-id="${q.id}" placeholder="${currentUser ? 'Type your answer...' : 'Sign in to respond'}" ${currentUser?'':'disabled'}>${val||''}</textarea>
        <div class="save-note" data-note-for="${q.id}"></div>
      </div>`;
  }).join('');

  pane.innerHTML = `
    <div class="content-title">End of Course Survey</div>
    <div class="survey-intro">This is completely optional — but it helps your church leaders know how to support you next, and helps us improve the course.</div>
    ${questionsHtml}
  `;

  pane.querySelectorAll('.rating-opt').forEach(el => {
    el.addEventListener('click', () => {
      const qid = el.parentElement.dataset.questionId;
      el.parentElement.querySelectorAll('.rating-opt').forEach(o=>o.dataset.selected = (o===el));
      saveSurveyAnswer(qid, el.dataset.value);
    });
  });
  pane.querySelectorAll('.choice-opt').forEach(el => {
    el.addEventListener('click', () => {
      const qid = el.parentElement.dataset.questionId;
      el.parentElement.querySelectorAll('.choice-opt').forEach(o=>o.dataset.selected = (o===el));
      saveSurveyAnswer(qid, el.dataset.value);
    });
  });
  pane.querySelectorAll('textarea.answer-box').forEach(box => {
    let debounceTimer;
    box.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const note = pane.querySelector(`[data-note-for="${box.dataset.questionId}"]`);
      if(note) note.textContent = 'Saving...';
      debounceTimer = setTimeout(() => saveSurveyAnswer(box.dataset.questionId, box.value, note), 700);
    });
  });
}

async function saveSurveyAnswer(questionId, text, noteEl){
  if(!currentUser) return;
  await supabaseClient.from('course_survey_responses').upsert({
    student_id: currentUser.id,
    question_id: questionId,
    response_text: text
  }, { onConflict: 'student_id,question_id' });

  surveyResponses[questionId] = text;
  if(noteEl){ noteEl.textContent = 'Saved'; setTimeout(()=>{ if(noteEl) noteEl.textContent=''; }, 1500); }
}

async function toggleComplete(item){
  if(!currentUser){ renderAuthModal('signup'); return; }
  const nowDone = !doneItemIds.has(item.id);

  await supabaseClient.from('item_progress').upsert({
    student_id: currentUser.id,
    item_id: item.id,
    completed_at: nowDone ? new Date().toISOString() : null
  }, { onConflict: 'student_id,item_id' });

  if(nowDone) doneItemIds.add(item.id); else doneItemIds.delete(item.id);

  const totalItems = sessions.reduce((n,s)=>n+s.session_items.length,0);
  const completedCount = sessions.reduce((n,s)=>n+s.session_items.filter(i=>doneItemIds.has(i.id)).length,0);
  if(nowDone && totalItems > 0 && completedCount === totalItems){
    await issueCertificateIfNeeded();
  }

  // Marking something complete moves forward automatically — un-checking
  // stays put, since that's someone correcting a mistake, not progressing.
  if(nowDone){
    const next = getAdjacentItem(item, 'next');
    if(next){ renderPlayer(next); return; }
    renderPlayer(null);
    renderSurvey();
    return;
  }

  renderPlayer(item);
}

// Creates a certificate row the moment someone finishes their last item —
// only if one doesn't already exist for this student+course, so
// re-checking/unchecking items later never creates duplicates.
async function issueCertificateIfNeeded(){
  const { data: existing } = await supabaseClient
    .from('certificates').select('id').eq('student_id', currentUser.id).eq('course_id', course.id).maybeSingle();
  if(existing) return;

  const code = Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 6);
  const { data: profile } = await supabaseClient.from('profiles').select('church_id').eq('id', currentUser.id).maybeSingle();
  await supabaseClient.from('certificates').insert({
    certificate_code: code,
    student_id: currentUser.id,
    church_id: profile ? profile.church_id : null,
    course_id: course.id
  });
}

// Handles the actual browser back/forward buttons — reads whatever the
// URL now says and updates the view to match, without pushing another
// history entry (that would fight with the browser's own navigation and
// break the forward button).
window.addEventListener('popstate', () => {
  if(!sessions.length) return; // course data not loaded yet, nothing to restore
  const itemIdParam = getItemIdParam();
  const restoredItem = itemIdParam ? sessions.flatMap(s => s.session_items).find(i => i.id === itemIdParam) : null;
  if(restoredItem){
    const owningSession = sessions.find(s => s.session_items.some(i => i.id === restoredItem.id));
    openSessionId = owningSession?.id || null;
    renderPlayer(restoredItem, true);
  } else {
    renderHero(true);
  }
});

init();
</script>

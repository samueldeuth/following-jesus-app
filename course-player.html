<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Following Jesus — Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Lora:ital@1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#17191D;
    --ink-soft:#6B7280;
    --blue:#3E82F7;
    --bg:#FFFFFF;
    --bg-soft:#F4F4F2;
    --line:#E4E3DD;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}

  /* ---------- Top bar (shared) ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;
  }
  .topbar.on-hero{position:absolute;top:0;left:0;right:0;z-index:2;}
  .logo-badge{
    background:var(--ink);color:#fff;
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    letter-spacing:0.18em;font-size:13px;
    padding:12px 16px;text-transform:uppercase;
    display:inline-block;
  }
  .topbar nav{display:flex;align-items:center;gap:22px;font-size:12.5px;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;}
  .topbar.on-hero nav{color:#fff;}

  /* ---------- Hero / landing ---------- */
  .hero{
    position:relative;
    min-height:520px;
    background:linear-gradient(180deg, rgba(10,12,16,0.55), rgba(10,12,16,0.75)), #444 center/cover;
    display:flex;align-items:center;justify-content:center;
    text-align:center;color:#fff;padding:100px 20px 60px;
  }
  .hero h1{
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:clamp(32px,6vw,54px);letter-spacing:0.04em;
    margin:0 0 14px;
  }
  .hero p{max-width:560px;margin:0 auto 26px;font-size:16px;line-height:1.6;opacity:0.92;}
  .btn-blue{
    background:var(--blue);color:#fff;border:none;
    font-weight:600;font-size:15px;
    padding:14px 30px;border-radius:999px;
    cursor:pointer;
  }
  .below-hero{max-width:640px;margin:56px auto;padding:0 20px;text-align:center;}
  .below-hero h2{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:26px;line-height:1.3;}

  /* ---------- Player layout ---------- */
  .player-shell{display:flex;min-height:100vh;}
  .sidebar{
    width:340px;flex-shrink:0;border-right:1px solid var(--line);
    display:flex;flex-direction:column;
  }
  .sidebar-header{padding:0;}
  .sidebar-body{padding:20px;overflow-y:auto;}
  .back-link{font-size:13px;color:var(--ink-soft);text-decoration:none;display:block;margin-bottom:14px;}
  .course-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;margin:0 0 14px;}
  .progress-track{height:6px;background:var(--bg-soft);border-radius:3px;overflow:hidden;margin-bottom:8px;}
  .progress-fill{height:100%;background:var(--ink);}
  .progress-pct{font-size:13px;color:var(--ink-soft);margin-bottom:18px;}
  .cert-btn{
    width:100%;background:var(--ink);color:#fff;border:none;border-radius:8px;
    padding:13px;font-size:13.5px;font-weight:600;letter-spacing:0.03em;
    text-transform:uppercase;cursor:pointer;margin-bottom:22px;
  }

  .session{margin-bottom:6px;}
  .session-head{
    display:flex;align-items:center;gap:10px;padding:12px 4px;
    cursor:pointer;border-bottom:1px solid var(--line);
  }
  .session-head .check{
    width:22px;height:22px;border-radius:50%;flex-shrink:0;
    background:var(--bg-soft);border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#fff;
  }
  .session-head[data-complete="true"] .check{background:var(--ink);border-color:var(--ink);}
  .session-head .title{font-weight:600;font-size:14.5px;flex:1;}
  .session-head .frac{font-size:12.5px;color:var(--ink-soft);}
  .session-head .chev{color:var(--ink-soft);font-size:11px;transition:transform 0.15s;}
  .session-head[data-open="true"] .chev{transform:rotate(180deg);}

  .item-list{position:relative;padding-left:26px;margin:4px 0 10px;}
  .item-list::before{
    content:"";position:absolute;left:10px;top:2px;bottom:14px;width:1.5px;background:var(--line);
  }
  .item-row{
    position:relative;padding:10px 8px;border-radius:8px;cursor:pointer;
  }
  .item-row:hover{background:var(--bg-soft);}
  .item-row .dot{
    position:absolute;left:-19px;top:14px;width:12px;height:12px;border-radius:50%;
    background:#fff;border:2px solid var(--line);
  }
  .item-row[data-done="true"] .dot{background:var(--ink);border-color:var(--ink);}
  .item-row[data-active="true"]{background:var(--bg-soft);}
  .item-title{font-size:14px;font-weight:500;}
  .item-meta{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;margin-top:2px;}

  /* ---------- Content pane ---------- */
  .content-pane{flex:1;padding:32px 40px;max-width:900px;}
  .content-title{font-size:20px;font-weight:600;margin:0 0 18px;}
  .video-wrap{width:100%;aspect-ratio:16/9;background:#111;border-radius:var(--radius);overflow:hidden;}
  .video-wrap iframe{width:100%;height:100%;border:0;}
  .verse-block{text-align:center;margin:30px auto;max-width:520px;}
  .verse-label{font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px;}
  .verse-text{font-family:'Lora',serif;font-style:italic;font-size:19px;line-height:1.5;}
  .text-body{font-size:15px;line-height:1.8;}
  .text-body ul{padding-left:20px;}
  .action-row{display:flex;gap:12px;margin-top:28px;}
  .btn-outline{
    border:1.5px solid var(--ink);background:#fff;color:var(--ink);
    padding:12px 22px;border-radius:8px;font-weight:600;font-size:13.5px;
    text-transform:uppercase;letter-spacing:0.03em;cursor:pointer;
  }
  .btn-dark{
    border:none;background:var(--ink);color:#fff;
    padding:12px 22px;border-radius:8px;font-weight:600;font-size:13.5px;
    text-transform:uppercase;letter-spacing:0.03em;cursor:pointer;
  }

  .loading{padding:60px 20px;text-align:center;color:var(--ink-soft);font-size:13px;}
  @media(max-width:820px){
    .player-shell{flex-direction:column;}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);}
    .content-pane{padding:24px;}
  }
</style>
</head>
<body>

<div id="app">
  <div class="loading">Loading course…</div>
</div>

<script>
/* ============================================================
   CONFIG — reuse your app's existing Supabase client if you have
   one; otherwise fill these in. Renamed to supabaseClient to avoid
   colliding with an existing `supabase` variable in your app.
   ============================================================ */
const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR-ANON-KEY';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function getChurchSlug(){
  const pathMatch = window.location.pathname.match(/\/c\/([^\/]+)/);
  if(pathMatch) return pathMatch[1];
  const params = new URLSearchParams(window.location.search);
  return params.get('church') || 'default';
}

let church = null;
let course = null;
let sessions = [];       // each with .items[]
let currentUser = null;
let doneItemIds = new Set();
let activeItem = null;
let openSessionId = null;

async function init(){
  const slug = getChurchSlug();

  const { data: churchRow } = await supabaseClient.from('churches').select('*').eq('slug', slug).single();
  church = churchRow;
  if(church?.primary_color){
    document.documentElement.style.setProperty('--blue', church.primary_color);
  }

  const { data: { user } } = await supabaseClient.auth.getUser();
  currentUser = user;

  const { data: courseRow } = await supabaseClient
    .from('courses')
    .select('*, sessions(*, session_items(*))')
    .eq('is_free', true)
    .limit(1)
    .single();

  if(!courseRow){
    document.getElementById('app').innerHTML = '<div class="loading">No course found.</div>';
    return;
  }

  course = courseRow;
  sessions = (courseRow.sessions || [])
    .sort((a,b)=>a.sort_order-b.sort_order)
    .map(s => ({...s, session_items: (s.session_items||[]).sort((a,b)=>a.sort_order-b.sort_order)}));

  if(currentUser){
    const { data: progress } = await supabaseClient
      .from('item_progress')
      .select('item_id, completed_at')
      .eq('student_id', currentUser.id);
    (progress||[]).forEach(p => { if(p.completed_at) doneItemIds.add(p.item_id); });
  }

  renderHero();
}

/* ---------- Hero / landing ---------- */
function renderHero(){
  document.getElementById('app').innerHTML = `
    <div class="hero">
      <div class="topbar on-hero">
        <div class="logo-badge">${church?.name || 'Following Jesus'}</div>
        <nav><a href="#">App</a><a href="#">My Dashboard</a></nav>
      </div>
      <div>
        <h1>${course.title}</h1>
        <p>${course.subtitle || ''}</p>
        <button class="btn-blue" id="start-btn">Start Course Today!</button>
      </div>
    </div>
    <div class="below-hero">
      <h2>There is no greater life than the one lived in surrender to Jesus.</h2>
    </div>
  `;
  document.getElementById('start-btn').addEventListener('click', () => {
    const firstSession = sessions[0];
    const firstItem = firstSession?.session_items?.[0];
    openSessionId = firstSession?.id || null;
    renderPlayer(firstItem || null);
  });
}

/* ---------- Player shell ---------- */
function renderPlayer(item){
  activeItem = item;
  const totalItems = sessions.reduce((n,s)=>n+s.session_items.length,0);
  const completedCount = sessions.reduce((n,s)=>n+s.session_items.filter(i=>doneItemIds.has(i.id)).length,0);
  const pct = totalItems ? Math.round((completedCount/totalItems)*100) : 0;

  document.getElementById('app').innerHTML = `
    <div class="player-shell">
      <div class="sidebar">
        <div class="topbar"><div class="logo-badge">${church?.name || 'Following Jesus'}</div></div>
        <div class="sidebar-body">
          <a class="back-link" id="back-link">&larr; Go to Dashboard</a>
          <div class="course-name">${course.title}</div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-pct">${pct}% complete</div>
          <button class="cert-btn" id="cert-btn">🏅 Go to Certificate</button>
          <div id="session-list"></div>
        </div>
      </div>
      <div class="content-pane" id="content-pane"></div>
    </div>
  `;

  document.getElementById('back-link').addEventListener('click', renderHero);
  document.getElementById('cert-btn').addEventListener('click', () => alert('Wire this up to your certificates table once a course hits 100%.'));

  renderSessionList();
  renderContent(item);
}

function renderSessionList(){
  const list = document.getElementById('session-list');
  list.innerHTML = sessions.map(s => {
    const done = s.session_items.filter(i=>doneItemIds.has(i.id)).length;
    const total = s.session_items.length;
    const isOpen = openSessionId === s.id;
    return `
      <div class="session">
        <div class="session-head" data-complete="${done===total && total>0}" data-open="${isOpen}" data-session-id="${s.id}">
          <div class="check">${done===total && total>0 ? '✓' : ''}</div>
          <div class="title">${s.title}</div>
          <div class="frac">${done}/${total}</div>
          <div class="chev">▾</div>
        </div>
        ${isOpen ? `<div class="item-list">${s.session_items.map(i => renderItemRow(i)).join('')}</div>` : ''}
      </div>`;
  }).join('');

  list.querySelectorAll('.session-head').forEach(el => {
    el.addEventListener('click', () => {
      const sid = el.dataset.sessionId;
      openSessionId = openSessionId === sid ? null : sid;
      renderSessionList();
    });
  });
  list.querySelectorAll('.item-row').forEach(el => {
    el.addEventListener('click', () => {
      const item = sessions.flatMap(s=>s.session_items).find(i => i.id === el.dataset.itemId);
      renderContent(item);
      renderSessionList();
    });
  });
}

function renderItemRow(item){
  const metaMap = {
    video: `WATCH · ${item.duration_minutes || '—'} MIN`,
    download: 'DOWNLOAD',
    discussion: 'SHARE · DISCUSSION',
    text: 'ACT'
  };
  return `
    <div class="item-row" data-item-id="${item.id}" data-done="${doneItemIds.has(item.id)}" data-active="${activeItem?.id===item.id}">
      <div class="dot"></div>
      <div class="item-title">${item.title}</div>
      <div class="item-meta">${metaMap[item.type] || ''}</div>
    </div>`;
}

/* ---------- Content pane ---------- */
function renderContent(item){
  activeItem = item;
  const pane = document.getElementById('content-pane');
  if(!item){ pane.innerHTML = '<div class="loading">Select a lesson to begin.</div>'; return; }

  const isDone = doneItemIds.has(item.id);
  let body = '';

  if(item.type === 'video'){
    body = `
      <div class="video-wrap">
        <iframe src="https://www.youtube.com/embed/${item.youtube_video_id}"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
      </div>
      ${item.memory_verse ? `
        <div class="verse-block">
          <div class="verse-label">Memory Verse</div>
          <div class="verse-text">${item.memory_verse}</div>
        </div>` : ''}
    `;
  } else if(item.type === 'download'){
    body = `<div class="text-body"><p>${item.body || 'Download the resource below.'}</p>
      <p><a class="btn-dark" href="${item.download_url || '#'}" target="_blank" style="display:inline-block;text-decoration:none;">Download</a></p></div>`;
  } else {
    body = `<div class="text-body">${item.body || ''}</div>`;
  }

  pane.innerHTML = `
    <div class="content-title">${item.title}</div>
    ${body}
    <div class="action-row">
      <button class="btn-outline" id="toggle-complete">${isDone ? 'Mark Incomplete' : 'Mark Complete'}</button>
      <button class="btn-dark" id="continue-btn">Continue &rarr;</button>
    </div>
  `;

  document.getElementById('toggle-complete').addEventListener('click', () => toggleComplete(item));
  document.getElementById('continue-btn').addEventListener('click', () => {
    const flat = sessions.flatMap(s=>s.session_items);
    const idx = flat.findIndex(i=>i.id===item.id);
    const next = flat[idx+1];
    if(next) renderContent(next);
  });
}

async function toggleComplete(item){
  if(!currentUser){ alert('Sign in to save your progress.'); return; }
  const nowDone = !doneItemIds.has(item.id);

  await supabaseClient.from('item_progress').upsert({
    student_id: currentUser.id,
    item_id: item.id,
    completed_at: nowDone ? new Date().toISOString() : null
  }, { onConflict: 'student_id,item_id' });

  if(nowDone) doneItemIds.add(item.id); else doneItemIds.delete(item.id);
  renderPlayer(item);
}

init();
</script>
</body>
</html>

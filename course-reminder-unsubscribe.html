<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unsubscribe — Following Jesus</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f7f5f2;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  h1 { font-size: 1.25rem; margin-bottom: 12px; }
  p { color: #555; line-height: 1.5; }
  .status { font-weight: 600; margin-top: 16px; }
  .ok { color: #2a7a4a; }
  .err { color: #b3261e; }
</style>
</head>
<body>
  <div class="card">
    <h1>Course reminder emails</h1>
    <p id="message">Working on it…</p>
  </div>

<script>
  const SUPABASE_URL = "https://onflrmiifjjjboeimnva.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uZmxybWlpZmpqamJvZWltbnZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNTQ3NDUsImV4cCI6MjEwMjkzMDc0NX0.CeHfkR5PIH1dLW6JUPAoHSwx_AcQkFg0HtFQXV9jk5A"; // same public anon key used in course-player.html

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function run() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const messageEl = document.getElementById("message");

    if (!token) {
      messageEl.textContent = "This link is missing its token, so we couldn't process it.";
      messageEl.className = "status err";
      return;
    }

    const { data, error } = await supabaseClient.rpc(
      "unsubscribe_from_course_reminders",
      { p_token: token }
    );

    if (error || data !== true) {
      messageEl.textContent =
        "We couldn't find a matching subscription. It may already be turned off.";
      messageEl.className = "status err";
      return;
    }

    messageEl.textContent = "You're unsubscribed from reminders for this course.";
    messageEl.className = "status ok";
  }

  run();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Your Church's Location — Following Jesus</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- REPLACE YOUR_BROWSER_PLACES_API_KEY_HERE with the actual key value
     from the "Find a Church - Browser Autocomplete" key in Google Cloud
     Console -- this one is restricted to followingjesus.com/* and
     Places API (New) only, safe to have visible in page source. -->
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_BROWSER_PLACES_API_KEY_HERE&libraries=places&loading=async" async></script>
<style>
  :root{
    --black: #0a0a0a;
    --white: #ffffff;
    --ink-soft: #57534d;
    --ember: #c89b3c;
    --font-display: 'Archivo', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--black); color:var(--white);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  .wrap{
    max-width:440px; margin:0 auto; padding:60px 24px 40px;
    flex:1; display:flex; flex-direction:column; justify-content:center;
    text-align:center;
  }
  .logo-badge{
    background:var(--white); color:var(--black); font-family:var(--font-display); font-weight:700;
    letter-spacing:0.14em; font-size:13px; padding:10px 16px; text-transform:uppercase;
    display:inline-block; margin-bottom:32px;
  }
  h1{
    font-family:var(--font-display); font-weight:800; font-size:24px;
    line-height:1.3; margin:0 0 14px;
  }
  .detail{
    font-size:15px; color:rgba(255,255,255,0.75); line-height:1.6; margin:0 0 28px; text-align:left;
  }
  .detail strong{ color:var(--white); }
  .field-label{ display:block; font-size:12px; color:rgba(255,255,255,0.6); margin:0 0 6px; text-align:left; }
  .address-input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.06); color:var(--white); font-size:15px; margin-bottom:14px;
    font-family:var(--font-body);
  }
  .address-input::placeholder{ color:rgba(255,255,255,0.35); }
  /* Styling for Google's <gmp-place-autocomplete> element via its
     supported CSS custom properties -- matches the dark, rounded look
     of the plain .address-input fields elsewhere on this page. */
  gmp-place-autocomplete{
    width:100%; margin-bottom:14px;
    --gmpx-color-surface: rgba(255,255,255,0.06);
    --gmpx-color-on-surface: #ffffff;
    --gmpx-color-on-surface-variant: rgba(255,255,255,0.35);
    --gmpx-color-primary: var(--ember);
    --gmpx-font-family-base: 'Inter', sans-serif;
  }
  .btn{
    border:none; border-radius:6px; padding:14px 20px; font-family:var(--font-display);
    font-weight:700; font-size:15px; cursor:pointer; width:100%; text-decoration:none;
    display:inline-block;
  }
  .btn-primary{background:var(--white); color:var(--black);}
  .btn-secondary{background:rgba(255,255,255,0.06); color:var(--white); border:1px solid rgba(255,255,255,0.15);}
  .btn:disabled{opacity:0.5; cursor:default;}
  .status-icon{font-size:40px; margin-bottom:16px;}
  .loading{color:rgba(255,255,255,0.5); font-size:14px;}
  .location-row{
    background:rgba(255,255,255,0.06); border-radius:10px; padding:14px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px; text-align:left;
  }
  .location-row-name{ font-weight:700; font-size:14px; }
  .location-row-address{ font-size:12.5px; color:rgba(255,255,255,0.6); margin-top:2px; }
  .location-remove-btn{
    background:none; border:none; color:rgba(255,255,255,0.4); cursor:pointer; font-size:13px;
    flex-shrink:0; padding:4px;
  }
  .location-remove-btn:hover{ color:var(--white); }
</style>
</head>
<body>

<div class="wrap" id="content">
  <div class="logo-badge">Following Jesus</div>
  <p class="loading">Loading…</p>
</div>

<script>
const SUPABASE_URL = 'https://onflrmiifjjjboeimnva.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uZmxybWlpZmpqamJvZWltbnZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNTQ3NDUsImV4cCI6MjEwMjkzMDc0NX0.CeHfkR5PIH1dLW6JUPAoHSwx_AcQkFg0HtFQXV9jk5A';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getToken(){
  return new URLSearchParams(window.location.search).get('token');
}

function renderContent(html){
  document.getElementById('content').innerHTML = `<div class="logo-badge">Following Jesus</div>${html}`;
}

async function init(){
  const token = getToken();
  if(!token){
    renderContent(`<h1>Link Not Found</h1><p class="detail">This link is missing some information. Please use the link from your email directly.</p>`);
    return;
  }

  const { data, error } = await supabaseClient.rpc('get_church_locations_by_token', { lookup_token: token });
  const result = data && data[0];

  if(error || !result){
    renderContent(`<h1>Link Not Found</h1><p class="detail">This link doesn't match anything on file. It may have been entered incorrectly — please use the link from your email directly.</p>`);
    return;
  }

  renderMainScreen(token, result);
}

function renderMainScreen(token, result){
  const locations = result.locations || [];
  const locationsHtml = locations.length
    ? locations.map(loc => `
        <div class="location-row" data-location-id="${loc.id}">
          <div>
            <div class="location-row-name">${escapeHtml(loc.name)}</div>
            <div class="location-row-address">${escapeHtml(loc.address || '')}</div>
          </div>
          <button type="button" class="location-remove-btn" data-remove-location="${loc.id}">Remove</button>
        </div>
      `).join('')
    : `<p class="detail" style="text-align:center;color:rgba(255,255,255,0.5);">No locations added yet.</p>`;

  renderContent(`
    <h1>${escapeHtml(result.church_name)}'s Locations</h1>
    <p class="detail">We're launching a new "Find a Church" feature in the Following Jesus app to help people get connected, planted, and serving in a local church near them. Add every campus or location for <strong>${escapeHtml(result.church_name)}</strong> below and you'll show up as a featured Following Jesus partner church to anyone searching nearby.</p>
    <div id="locationsList">${locationsHtml}</div>
    <label class="field-label" style="margin-top:20px;">Location Name</label>
    <input type="text" class="address-input" id="nameInput" placeholder="e.g. Main Campus, Bressi Campus" />
    <label class="field-label">Address</label>
    <gmp-place-autocomplete id="addressInput" placeholder="Street, City, State, Zip"></gmp-place-autocomplete>
    <button type="button" class="btn btn-primary" id="addBtn">Add This Location</button>
  `);

  // Only settled once a real suggestion is picked from the dropdown --
  // requiring an actual selection (rather than accepting whatever raw
  // text someone typed) is what actually guarantees the address sent
  // to the server is a real, Google-verified one, cutting down on the
  // "couldn't find that address" failures that plain manual typing
  // could hit before.
  let selectedAddress = null;
  document.getElementById('addressInput').addEventListener('gmp-select', async ({ placePrediction }) => {
    const place = placePrediction.toPlace();
    await place.fetchFields({ fields: ['formattedAddress'] });
    selectedAddress = place.formattedAddress;
  });

  document.querySelectorAll('[data-remove-location]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Remove this location?')) return;
      btn.disabled = true;
      try {
        const res = await fetch('/.netlify/functions/submit-church-location', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, locationId: btn.dataset.removeLocation })
        });
        const r = await res.json();
        if(r.status === 'success'){
          const { data } = await supabaseClient.rpc('get_church_locations_by_token', { lookup_token: token });
          renderMainScreen(token, data[0]);
        } else {
          alert('Could not remove that location. Please try again.');
          btn.disabled = false;
        }
      } catch(e) {
        alert('Could not remove that location. Please try again.');
        btn.disabled = false;
      }
    });
  });

  document.getElementById('addBtn').addEventListener('click', async () => {
    const name = document.getElementById('nameInput').value.trim();
    if(!name){ alert('Please enter a name for this location (e.g. "Main Campus").'); return; }
    if(!selectedAddress){ alert('Please choose an address from the suggestions as you type.'); return; }
    const address = selectedAddress;
    const btn = document.getElementById('addBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      const res = await fetch('/.netlify/functions/submit-church-location', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, locationName: name, address })
      });
      const result = await res.json();
      if(result.status === 'success'){
        const { data } = await supabaseClient.rpc('get_church_locations_by_token', { lookup_token: token });
        renderMainScreen(token, data[0]);
      } else if(result.status === 'geocode_failed'){
        btn.disabled = false;
        btn.textContent = 'Add This Location';
        alert("We couldn't find that address on the map — please double-check it and try again.");
      } else {
        btn.disabled = false;
        btn.textContent = 'Add This Location';
        alert('Something went wrong. Please try again, or reach out directly if this keeps happening.');
      }
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Add This Location';
      alert('Something went wrong. Please try again, or reach out directly if this keeps happening.');
    }
  });
}

init();
</script>
</body>
</html>
